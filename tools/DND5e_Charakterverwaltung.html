:root{--bg1:#f6ecd2;--bg2:#e9d6a8;--gold:#b8902f;--gold2:#a07a2a;--bur:#6e1a1a;--bur2:#8a2222;--ink:#3b2416;--ink2:#5a3a22;--cream:#f5e9cc;--card:#fbf4e2;--line:#d8c193;--ok:#2e7d32;--nat20:#3c9d3c;--fail:#8a0303;--muted:#8a7155;
--fT:'Almendra','Fondamento','EB Title',serif;--fK:'Cinzel','EB Kicker',serif;--fB:'Crimson Text','EB Body','Book Antiqua',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#efe0bd}
body{background:radial-gradient(ellipse at center,var(--bg1) 0%,#f1e2bd 55%,var(--bg2) 100%) fixed;color:var(--ink);font-family:var(--fB);font-size:17px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--fT);color:var(--bur);font-weight:normal;margin:0}
.kicker{font-family:var(--fK);letter-spacing:.32em;color:var(--gold2);font-size:.8em;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.85em} .tiny{font-size:.75em}
.btn{border:2px solid var(--ink);background:var(--cream);border-radius:4px;padding:.38em .8em;font-weight:700;cursor:pointer;box-shadow:0 2px 3px rgba(59,36,22,.25);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 6px rgba(59,36,22,.3)} .btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#8a2222,#6e1a1a);color:#f8ecd0;border-color:#4d1010}
.btn.gold{background:linear-gradient(#d2ac4f,#a07a2a);color:#2b1a0e;border-color:#6f531b}
.btn.sm{padding:.18em .5em;font-size:.85em;border-width:1.5px}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
input[type=number],input[type=text],select,textarea{background:#fffaf0;border:1.5px solid #b49a6a;border-radius:4px;padding:.2em .35em}
input[type=number]{width:4.2em}
textarea{width:100%;min-height:4em}
/* Ornamente */
.orn{display:flex;align-items:center;gap:.6em;margin:.4em auto;width:min(520px,90%)}
.orn::before,.orn::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent)}
.orn i{width:11px;height:11px;background:var(--bur2);transform:rotate(45deg);border:1.5px solid var(--gold);display:block}
.corner{position:fixed;width:150px;height:150px;pointer-events:none;opacity:.95;z-index:0}
.corner.tl{top:6px;left:6px}.corner.tr{top:6px;right:6px;transform:scaleX(-1)}.corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}.corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}

<script>/* Minimal-PDF-Formularleser: liest AcroForm-Feldwerte (Text + Checkboxen) ohne externe Bibliothek.

(function (root) {
  'use strict';
  const WS = new Set([0, 9, 10, 12, 13, 32]);
  const DELIM = new Set('()<>[]{}/%'.split('').map(c => c.charCodeAt(0)));

  function Ref(n, g) { this.n = n; this.g = g; }

  class Lexer {
    constructor(bytes, pos) { this.b = bytes; this.p = pos || 0; }
    skip() {
      const b = this.b;
      for (;;) {
        while (this.p < b.length && WS.has(b[this.p])) this.p++;

    peekWord() {
      this.skip(); let s = '', q = this.p;
      while (q < this.b.length && !WS.has(this.b[q]) && !DELIM.has(this.b[q])) s += String.fromCharCode(this.b[q++]);

    }
    parse() {
      this.skip();
      const b = this.b, c = b[this.p];
      if (c === undefined) return null;

        this.p += 2; const d = {};

          this.skip();
          if (b[this.p] === 62 && b[this.p + 1] === 62) { this.p += 2; break; }
          if (this.p >= b.length) break;

          if (!(k instanceof Name)) { this.p++; continue; }
          d[k.name] = this.parse();
        }

      }
      if (c === 91) { // [
        this.p++; const a = [];
        for (;;) { this.skip(); if (b[this.p] === 93) { this.p++; break; } if (this.p >= b.length) break; a.push(this.parse()); }
        return a;
      }
      if (c === 40) return this.litString();
      if (c === 60) return this.hexString();
      if (c === 47) { // name
        this.p++; let s = '';
        while (this.p < b.length && !WS.has(b[this.p]) && !DELIM.has(b[this.p])) s += String.fromCharCode(b[this.p++]);

    }
    hexString() {

function cardEffects(ch) {

function doSpellAtk(ch) {

function doFeat(ch, sub) {

  if (o.font === 'toSlot') { const lv = +P.fontLvl || 1; const cost = { 1: 2, 2: 3, 3: 5, 4: 6, 5: 7 }[lv]; C.useRes(ch, 'sorcery', cost); const s = ch.slots[lv - 1]; if (s.used > 0) s.used--; else { s.max++; s.bonus = (s.bonus || 0) + 1; } }

function doCheck(ch) {
  const sel = S.sel, P = S.pan; let base, ctx, label, spec = {};

  else if (sel.k === 'check') { const a = sel.ab; base = sel.sk ? ch.skills[sel.sk].bonus : ch.abil[a].mod; ctx = C.rollContext(ch, 'check', { abil: a, skill: sel.sk }); label = sel.sk ? L(D.SKILLS.find(s => s[0] === sel.sk).slice(2, 4)) : ABN(a) + T('-Probe', ' check'); spec.kind = 'check'; spec.reliable = C.K(ch).reliable && sel.sk && ch.skills[sel.sk].prof; }

}

/* ---------- Import / Export ---------- */
async function importFile(file) {
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const isPdf = buf[0] === 0x25 && buf[1] === 0x50 && buf[2] === 0x44 && buf[3] === 0x46;
    if (isPdf) {
      const fields = await W.PdfForm.readFields(buf);
      const n = Object.values(fields).filter(v => v !== '' && v !== false).length;
      if (n < 3) { C.toast(T('Keine ausgefüllten Formularfelder gefunden – leerer Charakter angelegt.', 'No filled form fields found – created a blank character.')); }
      const ch = I.build(fields, file.name); C.upgrade(ch); S.chars.push(ch); S.active = ch.id; S.view = null; S.sel = null;
      C.logL(ch, ['Bogen „' + file.name + '“ geladen (' + n + ' Felder)', 'Loaded sheet "' + file.name + '" (' + n + ' fields)']);
      C.save(); openSetup(); return;
    }
    const data = JSON.parse(new TextDecoder().decode(buf));
    const list = Array.isArray(data) ? data : (data.chars || [data]);
    let added = 0; for (const c of list) { if (!c || !c.abil) continue; if (S.chars.some(x => x.id === c.id)) c.id = I.uid(); C.upgrade(c); S.chars.push(c); added++; }
    if (added) { S.active = S.chars[S.chars.length - 1].id; S.view = null; C.toast(added + T(' Charakter(e) geladen', ' character(s) loaded')); } else C.toast(T('Keine Charaktere in der Datei', 'No characters in file'));
    C.render();
  } catch (e) { console.error(e); C.toast(T('Datei konnte nicht gelesen werden: ', 'Could not read file: ') + e.message); C.render(); }
}
function exportParty() {
  const data = { app: 'DND5e Charakterverwaltung', v: 1, saved: new Date().toISOString(), chars: S.chars };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Gruppe_' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
