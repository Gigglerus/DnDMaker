<style>:root{--bg1:#f6ecd2;--bg2:#e9d6a8;--gold:#b8902f;--gold2:#a07a2a;--bur:#6e1a1a;--bur2:#8a2222;--ink:#3b2416;--ink2:#5a3a22;--cream:#f5e9cc;--card:#fbf4e2;--line:#d8c193;--ok:#2e7d32;--fail:#8a0303;--muted:#8a7155;
--fT:'Almendra','Fondamento','EB Title',serif;--fK:'Cinzel','EB Kicker',serif;--fB:'Crimson Text','EB Body','Book Antiqua',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:#efe0bd}
body{background:radial-gradient(ellipse at center,var(--bg1) 0%,#f1e2bd 55%,var(--bg2) 100%) fixed;color:var(--ink);font-family:var(--fB);font-size:17px;line-height:1.35;overflow:hidden}
body.home{overflow:auto}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--fT);color:var(--bur);font-weight:normal;margin:0}
.kicker{font-family:var(--fK);letter-spacing:.32em;color:var(--gold2);font-size:.8em;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.85em} .tiny{font-size:.75em}
.btn{border:2px solid var(--ink);background:var(--cream);border-radius:4px;padding:.32em .75em;font-weight:700;cursor:pointer;box-shadow:0 2px 3px rgba(59,36,22,.25);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 6px rgba(59,36,22,.3)} .btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#8a2222,#6e1a1a);color:#f8ecd0;border-color:#4d1010}
.btn.gold{background:linear-gradient(#d2ac4f,#a07a2a);color:#2b1a0e;border-color:#6f531b}
.btn.sm{padding:.15em .5em;font-size:.85em;border-width:1.5px}
.btn.on{background:var(--bur);color:var(--cream);border-color:#4d1010}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
input[type=number],input[type=text],input[type=search],select,textarea{background:#fffaf0;border:1.5px solid #b49a6a;border-radius:4px;padding:.2em .35em}
input[type=number]{width:5.5em}
textarea{width:100%;min-height:4.5em;resize:vertical}
input[type=range]{accent-color:var(--bur)}
.corner{position:fixed;width:150px;height:150px;pointer-events:none;opacity:.95;z-index:0}
.corner.tl{top:6px;left:6px}.corner.tr{top:6px;right:6px;transform:scaleX(-1)}.corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}.corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}
body.home::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(120,80,30,.22) 100%)}
.divider{display:block;margin:0 auto;width:min(520px,80vw);height:26px}

#app{height:100%}
.work{display:grid;grid-template-rows:auto 1fr;height:100vh}
.top{display:flex;align-items:center;gap:.45em;padding:.35em .7em;background:linear-gradient(#f8efd9,#efdfb8);border-bottom:2px solid var(--gold);flex-wrap:wrap;position:relative;z-index:20}

.brand b{font-family:var(--fT);color:var(--bur);font-size:1.2em;font-weight:normal}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 .15em}
.sp{flex:1}
.body{display:grid;grid-template-columns:260px 1fr auto;min-height:0}
.list{border-right:2px solid var(--line);background:rgba(251,244,226,.85);display:flex;flex-direction:column;min-height:0}
.list .hd{padding:.5em .6em;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.35em}

.it{display:flex;align-items:center;gap:.45em;padding:.25em .6em;border-bottom:1px dotted var(--line);cursor:pointer}

.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #2b1a0e;flex:none}
.dot.sq{border-radius:2px}
.legend{padding:.4em .6em;border-top:1px solid var(--line);font-size:.78em;display:flex;flex-wrap:wrap;gap:.2em .7em}

.mapwrap{position:relative;overflow:hidden;background:#d9c9a3;cursor:grab;min-width:0;touch-action:none}

.mk.prev.dup .core{fill:rgba(120,120,120,.25);stroke:#666}
.hint{position:absolute;left:50%;top:.6em;transform:translateX(-50%);background:rgba(59,36,22,.9);color:var(--cream);padding:.35em .9em;border-radius:6px;font-size:.92em;z-index:5;pointer-events:none;max-width:90%;text-align:center}

.detect input[type=range]{width:100%}
.swatch{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;image-rendering:pixelated;flex:none}

kbd{border:1px solid #b49a6a;border-bottom-width:2px;border-radius:3px;padding:0 .3em;font-size:.85em;background:#fffaf0}
