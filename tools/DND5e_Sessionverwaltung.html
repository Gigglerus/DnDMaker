:root{--bg1:#f6ecd2;--bg2:#e9d6a8;--gold:#b8902f;--gold2:#a07a2a;--bur:#6e1a1a;--bur2:#8a2222;--ink:#3b2416;--ink2:#5a3a22;--cream:#f5e9cc;--card:#fbf4e2;--line:#d8c193;--ok:#2e7d32;--nat20:#3c9d3c;--fail:#8a0303;--muted:#8a7155;
--fT:'Almendra','Fondamento','EB Title',serif;--fK:'Cinzel','EB Kicker',serif;--fB:'Crimson Text','EB Body','Book Antiqua',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#efe0bd}
body{background:radial-gradient(ellipse at center,var(--bg1) 0%,#f1e2bd 55%,var(--bg2) 100%) fixed;color:var(--ink);font-family:var(--fB);font-size:17px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--fT);color:var(--bur);font-weight:normal;margin:0}
.kicker{font-family:var(--fK);letter-spacing:.32em;color:var(--gold2);font-size:.8em;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.85em} .tiny{font-size:.75em}
.btn{border:2px solid var(--ink);background:var(--cream);border-radius:4px;padding:.38em .8em;font-weight:700;cursor:pointer;box-shadow:0 2px 3px rgba(59,36,22,.25);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 6px rgba(59,36,22,.3)} .btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#8a2222,#6e1a1a);color:#f8ecd0;border-color:#4d1010}
.btn.gold{background:linear-gradient(#d2ac4f,#a07a2a);color:#2b1a0e;border-color:#6f531b}
.btn.sm{padding:.18em .5em;font-size:.85em;border-width:1.5px}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
input[type=number],input[type=text],select,textarea{background:#fffaf0;border:1.5px solid #b49a6a;border-radius:4px;padding:.2em .35em}
input[type=number]{width:4.2em}
textarea{width:100%;min-height:4em}
/* Ornamente */
.orn{display:flex;align-items:center;gap:.6em;margin:.4em auto;width:min(520px,90%)}
.orn::before,.orn::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent)}
.orn i{width:11px;height:11px;background:var(--bur2);transform:rotate(45deg);border:1.5px solid var(--gold);display:block}
.corner{position:fixed;width:150px;height:150px;pointer-events:none;opacity:.95;z-index:0}
.corner.tl{top:6px;left:6px}.corner.tr{top:6px;right:6px;transform:scaleX(-1)}.corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}.corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(120,80,30,.22) 100%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.divider{display:block;margin:0 auto;width:min(520px,80vw);height:26px}
.top,.modal,.toast,.fx{z-index:20}.modal{z-index:50}.toast{z-index:80}.fx{z-index:100}
@media(max-width:640px){.corner{width:70px;height:70px}}
/* Willkommen */
.welcome{text-align:center;padding:4vh 1em;position:relative;z-index:1}
.welcome h1{font-size:clamp(40px,6vw,66px);line-height:1.05;text-shadow:0 2px 0 rgba(255,245,215,.8),0 3px 6px rgba(110,26,26,.25)}
.welcome .kicker{font-size:17px;letter-spacing:.42em}
.welcome .sub{font-style:italic;color:var(--ink2);max-width:640px;margin:.6em auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8em;max-width:560px;margin:1.2em auto}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:4px;overflow:hidden;margin:.6em}
.lang button{border:0;background:var(--cream);padding:.25em .8em;cursor:pointer;font-weight:700}
.lang button.on{background:var(--bur);color:var(--cream)}
.d20{width:118px;height:118px;margin:0 auto;display:block;filter:drop-shadow(0 4px 6px rgba(80,30,10,.3))}
.drop{border:2px dashed var(--gold);border-radius:8px;padding:1em;margin:1em auto;max-width:560px;color:var(--ink2);font-style:italic}
.drop.over{background:rgba(184,144,47,.15)}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6em;padding:.4em .9em;background:linear-gradient(#f8efd9ee,#efdfb8ee);border-bottom:2px solid var(--gold);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.4em;cursor:pointer}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--fT);color:var(--bur);font-size:1.25em;font-weight:normal}
.tabs{display:flex;gap:.3em;flex-wrap:wrap;flex:1}
.tab{border:1.5px solid var(--ink2);border-bottom-width:3px;background:var(--cream);border-radius:5px;padding:.15em .6em;cursor:pointer;font-weight:700;display:flex;gap:.4em;align-items:center}
.tab.on{background:var(--bur);color:var(--cream);border-color:#4d1010}
.tab .hpm{font-weight:400;font-size:.8em;opacity:.9}
/* Layout */
main{padding:.8em;position:relative;z-index:1}
.cols{display:grid;grid-template-columns:minmax(290px,1fr) minmax(340px,1.35fr) minmax(320px,1.15fr);gap:.8em;align-items:start}
@media(max-width:1250px){.cols{grid-template-columns:1fr 1fr}.col3{grid-column:1/-1}}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:.7em .8em;margin-bottom:.8em;box-shadow:0 2px 6px rgba(90,58,34,.12);position:relative}
.card>h3{font-size:1.25em;margin-bottom:.35em;display:flex;align-items:center;gap:.4em;justify-content:space-between}
.card>h3 .r{font-family:var(--fB);font-size:.7em;color:var(--ink)}
.row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.hdr h2{font-size:1.9em;line-height:1.1}
.badges{display:flex;gap:.35em;flex-wrap:wrap;margin-top:.3em}
.badge{background:#efe0bb;border:1px solid var(--line);border-radius:12px;padding:0 .55em;font-size:.85em}
.badge.bad{background:#f3d3cf;border-color:#c99} .badge.good{background:#dcebd2;border-color:#9b9}
/* TP */
.hpbar{height:14px;border-radius:7px;background:#e8d6b0;border:1px solid #b49a6a;overflow:hidden;position:relative;margin:.3em 0}
.hpbar i{display:block;height:100%;background:linear-gradient(#5aa05a,#2e7d32)} .hpbar i.low{background:linear-gradient(#d07a3a,#a04a1a)} .hpbar i.crit{background:linear-gradient(#b02020,#700)}
.hpbar b{position:absolute;right:0;top:0;height:100%;background:rgba(60,120,200,.55)}
.hpnum{font-family:var(--fT);font-size:2em;color:var(--bur)}
/* RK-Schild */
.stats3{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em;text-align:center}
.stat{border:1.5px solid var(--line);border-radius:6px;padding:.25em;background:#fffaf0;cursor:default}
.stat b{display:block;font-size:1.45em;font-family:var(--fT);color:var(--bur)} .stat span{font-size:.75em;color:var(--ink2)}
.stat.click{cursor:pointer} .stat.click:hover{background:#f6e7c5}
.shield{position:relative;width:100%;}
.acb{font-size:.85em;margin:.2em 0 0;padding-left:1em}
.acb li.neg{color:var(--fail)} .acb li.pos{color:var(--ok)}
/* Attribute */
.abils{display:grid;grid-template-columns:repeat(6,1fr);gap:.3em;text-align:center}
.abil{border:1.5px solid var(--line);border-radius:6px;background:#fffaf0;padding:.2em .1em}
.abil .n{font-family:var(--fK);font-size:.7em;letter-spacing:.1em;color:var(--gold2)}
.abil .m{font-size:1.35em;font-family:var(--fT);color:var(--bur);cursor:pointer}
.abil .s{font-size:.75em}
.abil .sv{font-size:.78em;cursor:pointer;border-top:1px dashed var(--line);margin-top:.15em}
.abil .sv.p{font-weight:700}
.skills{columns:2;column-gap:1em;font-size:.88em}
.skills div{display:flex;justify-content:space-between;cursor:pointer;padding:0 .2em;border-radius:3px;break-inside:avoid}
.skills div:hover,.abil .m:hover,.abil .sv:hover{background:#f1dfb5}
.skills div.p b{color:var(--bur)}
/* Ökonomie */
.econ{display:flex;gap:.4em;flex-wrap:wrap;margin:.3em 0}
.chip{border:2px solid var(--ink);border-radius:16px;padding:.1em .65em;font-weight:700;display:flex;align-items:center;gap:.35em;background:#fffaf0}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--ok);display:inline-block;border:1.5px solid #1b4d1e}
.chip.used{opacity:.55;border-style:dashed} .chip.used i{background:#bbb;border-color:#888}
.chip.extra i{background:var(--gold)}
.roundbar{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.roundbar .rn{font-family:var(--fT);font-size:1.6em;color:var(--bur)}
.phase{background:#eadcf7;border:1px solid #a98bc7;border-radius:6px;padding:.3em .6em;margin:.4em 0;font-size:.9em}
/* Optionen */
.grp{margin-top:.45em}
.grp h4{font-family:var(--fK);font-size:.78em;letter-spacing:.18em;color:var(--gold2);margin:.2em 0;text-transform:uppercase;display:flex;justify-content:space-between}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.35em}
.opt{border:1.5px solid #c2a874;border-radius:6px;background:#fffaf0;padding:.3em .45em;cursor:pointer;text-align:left;line-height:1.15;transition:background .1s}
.opt:hover{background:#f6e7c5;border-color:var(--gold2)}
.opt .t{font-weight:700;display:block}
.opt .d{font-size:.78em;color:var(--ink2)}
.opt.sel{border-color:var(--bur);box-shadow:0 0 0 2px rgba(138,34,34,.35)}
.opt.off{opacity:.45;cursor:not-allowed;background:#eee4cf}
.opt .tag{float:right;font-size:.7em;background:#efe0bb;border-radius:8px;padding:0 .35em;margin-left:.3em}
.opt.spell .tag{background:#e2d6f2} .opt.feat .tag{background:#f2dcc6}
/* Wurf */
.rollbox{border:2px solid var(--gold);border-radius:8px;background:#fffdf6;padding:.6em}
.rollbox h3{font-size:1.3em}
.mods{list-style:none;padding:0;margin:.3em 0;font-size:.9em}
.mods li{display:flex;gap:.4em;align-items:center;padding:.05em 0}
.mods li .v{margin-left:auto;font-weight:700}
.mods li.neg .v{color:var(--fail)} .mods li.pos .v{color:var(--ok)}
.advsel{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.advsel button{border:0;background:var(--cream);padding:.15em .5em;cursor:pointer;font-weight:700;font-size:.85em}
.advsel button.on{background:var(--bur);color:var(--cream)}
.result{margin-top:.5em;padding:.5em;border-radius:6px;background:#f7efd9;border:1px solid var(--line)}
.result .tot{font-family:var(--fT);font-size:2.4em;color:var(--bur);line-height:1}
.die{display:inline-flex;align-items:center;justify-content:center;min-width:1.9em;height:1.9em;border:2px solid var(--ink);border-radius:6px;background:#fff;font-weight:700;margin:.1em;padding:0 .2em}
.die.k{background:var(--bur);color:#fff;border-color:#4d1010}
.die.x{opacity:.4;text-decoration:line-through}
.die.n20{background:var(--nat20);border-color:#1e5e1e;color:#fff} .die.n1{background:var(--fail);border-color:#400;color:#fff}
.hit{color:var(--ok);font-weight:700} .miss{color:var(--fail);font-weight:700}
.log{max-height:300px;overflow:auto;font-size:.85em}
.log div{border-bottom:1px dotted var(--line);padding:.12em 0}
.log .rd{color:var(--gold2);font-family:var(--fK);font-size:.75em;margin-right:.3em}
/* Ressourcen */
.res{display:flex;align-items:center;gap:.4em;padding:.15em 0;border-bottom:1px dotted var(--line);flex-wrap:wrap}
.res .nm{flex:1;min-width:8em}
.pips{display:inline-flex;gap:3px;flex-wrap:wrap}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--bur);background:var(--bur2);cursor:pointer}
.pip.u{background:transparent}
.rech{font-size:.7em;border-radius:7px;padding:0 .35em;background:#e2d6f2} .rech.LR{background:#d8e6f2} .rech.SR{background:#f2e8c6}
.spl{border-bottom:1px dotted var(--line);padding:.15em 0;display:flex;gap:.4em;align-items:baseline;flex-wrap:wrap}
.spl .nm{font-weight:700;cursor:pointer} .spl .nm:hover{color:var(--bur)}
.spl .meta{font-size:.78em;color:var(--ink2)}
.spl.np{opacity:.55}
.lvlh{font-family:var(--fK);letter-spacing:.12em;font-size:.78em;color:var(--gold2);margin-top:.4em;display:flex;align-items:center;gap:.5em}
/* Zustände */
.eff{display:flex;gap:.35em;align-items:center;flex-wrap:wrap;padding:.15em .3em;border-radius:5px;margin:.15em 0;border:1px solid}
.eff.neg{background:#f6dcd8;border-color:#d1a39d} .eff.pos{background:#e1eed8;border-color:#a9c79c}
.eff .nm{font-weight:700} .eff .x{margin-left:auto}
/* Dialog */
.modal{position:fixed;inset:0;background:rgba(40,22,10,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:3vh 1em}
.dlg{background:var(--card);border:2px solid var(--gold);border-radius:10px;max-width:980px;width:100%;padding:1em 1.2em;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.dlg h2{font-size:1.8em;text-align:center}
.dlg h3{font-size:1.2em;margin:.7em 0 .3em;border-bottom:1px solid var(--line)}
.dlg table{border-collapse:collapse;width:100%;font-size:.92em}
.dlg td,.dlg th{padding:.15em .3em;border-bottom:1px dotted var(--line);text-align:left;vertical-align:middle}
.dlg .foot{display:flex;gap:.5em;justify-content:flex-end;margin-top:1em;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.3em .9em}
.fgrid label{display:flex;justify-content:space-between;align-items:center;gap:.4em}
.fgrid label input[type=text],.fgrid label select{width:62%;min-width:0}
.note{background:#fff3cd;border:1px solid #e0c36b;border-radius:5px;padding:.35em .6em;font-size:.9em;margin:.3em 0}
.remind{border:1px solid var(--line);border-radius:6px;padding:.4em .6em;margin:.35em 0;background:#fffaf0}
.toast{position:fixed;bottom:1em;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:.5em 1em;border-radius:6px;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.banner{background:#f6dcd8;border:2px solid var(--fail);border-radius:8px;padding:.5em .7em;margin-bottom:.8em}
.banner.info{background:#fff3cd;border-color:#c8a43e}
/* NAT20 / FAIL */
.fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100}
.fx span{font-family:var(--fT);font-size:clamp(3em,11vw,8.5em);font-weight:bold;letter-spacing:.04em;animation:fxPop 1.9s cubic-bezier(.2,.9,.3,1.2) forwards;white-space:nowrap}
.fx.n20 span{color:var(--nat20);text-shadow:0 0 18px rgba(80,200,80,.8),2px 3px 0 #1e4d1e,0 0 2px #fff}
.fx.n1 span{color:var(--fail);text-shadow:0 0 18px rgba(160,0,0,.75),2px 3px 0 #2a0000;animation:fxFail 1.9s ease-out forwards}
@keyframes fxPop{0%{transform:scale(.2) rotate(-8deg);opacity:0}18%{transform:scale(1.15) rotate(2deg);opacity:1}30%{transform:scale(1)}75%{opacity:1;transform:scale(1.04)}100%{transform:scale(1.25);opacity:0}}
@keyframes fxFail{0%{transform:translateY(-40px) scale(1.6);opacity:0}15%{transform:translateY(0) scale(1);opacity:1}20%,30%,40%{transform:translateX(-10px)}25%,35%{transform:translateX(10px)}45%{transform:none}78%{opacity:1;filter:blur(0)}100%{opacity:0;transform:translateY(30px);filter:blur(3px)}}
.hidden{display:none!important}
details summary{cursor:pointer;font-weight:700;color:var(--ink2)}
.txt{white-space:pre-wrap;font-size:.85em;max-height:220px;overflow:auto;background:#fffaf0;border:1px solid var(--line);padding:.4em;border-radius:5px}

a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}

/* Sessionverwaltung – Ergänzungen */
.campname{font-family:var(--fT);font-size:1.15em;color:var(--bur);background:transparent;border:1px dashed transparent;border-radius:4px;padding:.05em .3em;max-width:16em}
.campname:hover,.campname:focus{border-color:var(--gold);background:#fffaf0}
.cursess{font-size:.85em;background:#efe0bb;border:1px solid var(--line);border-radius:12px;padding:.1em .6em;cursor:pointer;white-space:nowrap;max-width:18em;overflow:hidden;text-overflow:ellipsis}
.camplist{max-width:620px;margin:1em auto;display:grid;gap:.5em;text-align:left}
.campcard{display:flex;align-items:center;gap:.5em;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:.5em .7em;box-shadow:0 2px 6px rgba(90,58,34,.12)}
.campcard .cc-main{flex:1;cursor:pointer;display:flex;flex-direction:column}
.campcard .cc-main b{font-family:var(--fT);font-size:1.25em;color:var(--bur);font-weight:normal}
.campcard:hover{border-color:var(--gold)}
.split{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:.8em;align-items:start}
.split.npcs{grid-template-columns:1fr minmax(260px,340px)}
@media(max-width:900px){.split,.split.npcs{grid-template-columns:1fr}}
.side .card{position:relative}
.li{display:flex;gap:.5em;align-items:flex-start;padding:.3em .4em;border-radius:6px;cursor:pointer;border:1px solid transparent}
.li:hover{background:#f6e7c5}
.li.on{background:#f1dfb5;border-color:var(--gold)}
.li .st{width:1.4em;text-align:center}
.sesslist,.npclist,.notelist,.mklist{max-height:60vh;overflow:auto;margin-top:.3em}
.empty{text-align:center;padding:2em 1em}
.fgrid.sform{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fgrid.sform label{flex-direction:column;align-items:stretch;gap:.1em;font-size:.85em;color:var(--ink2)}
.fgrid.sform label input,.fgrid.sform label select{width:100%;font-size:1.05em;color:var(--ink)}
.fgrid.sform label.wide{grid-column:span 2}
@media(max-width:640px){.fgrid.sform label.wide{grid-column:auto}}
.present{margin-top:.5em;display:flex;flex-wrap:wrap;gap:.2em .8em;align-items:center}
.chk{display:inline-flex;align-items:center;gap:.25em;cursor:pointer;white-space:nowrap}
.notes3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
@media(max-width:1200px){.notes3{grid-template-columns:1fr}}
.nb textarea{min-height:12em;resize:vertical}
.enc{border:1.5px solid var(--line);border-radius:8px;padding:.5em .6em;margin:.5em 0;background:#fffaf0}
.enc.done{opacity:.7;background:#eef3e6}
.enc .en{font-family:var(--fT);font-size:1.15em;color:var(--bur);font-weight:normal}
.mtab{border-collapse:collapse;width:100%;font-size:.9em;margin:.3em 0}
.mtab th,.mtab td{padding:.1em .35em;border-bottom:1px dotted var(--line);text-align:left}
.mtab th{font-family:var(--fK);font-size:.72em;letter-spacing:.1em;color:var(--gold2)}
.encnote{min-height:2.6em;margin-top:.35em;font-size:.9em}
.pmode{margin:.2em 0 .4em}
.chips{display:flex;flex-wrap:wrap;gap:.35em}
.npcchip{background:#fffaf0;border:1.5px solid var(--line);border-radius:14px;padding:.1em .3em .1em .6em;cursor:pointer;display:inline-flex;align-items:center;gap:.3em}
.npcchip:hover{border-color:var(--gold)}
.npcchip .x{border:0;background:transparent;cursor:pointer;color:var(--fail);font-weight:700;padding:0 .3em}
.ptab{width:100%;border-collapse:collapse;font-size:.88em}
.ptab td,.ptab th{padding:.1em .3em;border-bottom:1px dotted var(--line);text-align:left}
.ptab tr[data-a]{cursor:pointer} .ptab tr[data-a]:hover{background:#f6e7c5}
/* Charaktere */
.toolbar .row{gap:.5em}
.drop.slim{margin:.6em 0 0;max-width:none;padding:.5em;font-size:.9em}
.pcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:.8em}
.pc{margin:0}
.pc.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:0 2px 6px rgba(90,58,34,.12)}}
.pchead{display:flex;gap:.7em;align-items:center;margin-bottom:.4em}
.por{width:72px;height:72px;border-radius:50%;border:2.5px solid var(--gold);background:linear-gradient(#8a2222,#5a1212);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:none;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.por img{width:100%;height:100%;object-fit:cover}
.por span{font-family:var(--fT);color:#f0cf6a;font-size:1.7em}
.pcn h2{font-size:1.5em;line-height:1.1}
.stats3.s5{grid-template-columns:repeat(5,1fr);margin-bottom:.4em}
.pcx{margin:.35em 0}
.kick{font-family:var(--fK);font-size:.78em;letter-spacing:.16em;color:var(--gold2);margin:.6em 0 .2em;text-transform:uppercase;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.kick .btn{letter-spacing:0;text-transform:none;font-family:var(--fB)}
.pcnote{min-height:6em}
.pcbtn{margin:.4em 0 .2em}
.pc details .txt{max-height:130px;margin-bottom:.3em}
/* NSC */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.55em .9em}
.ngrid>label,.traits>label{display:flex;flex-direction:column;gap:.12em;font-size:.88em;color:var(--ink2)}
.ngrid>label.wide{grid-column:1/-1}
.fld{display:flex;align-items:center;gap:.25em;color:var(--ink);font-size:1.05em}
.fld>input[type=text],.fld>select,.fld>input[type=number]{flex:1;min-width:0;width:auto}
.fld>select+select{flex:.8}
.ngrid input[type=text]{width:100%}
.nmin{font-family:var(--fT);font-size:1.2em;color:var(--bur)}
.wslider{flex:1;accent-color:var(--bur)}
.agel{min-width:6em;color:var(--ink2)}
.lk,.dz{border:1px solid transparent;background:transparent;cursor:pointer;border-radius:4px;padding:0 .15em;font-size:1em;line-height:1.4;opacity:.55}
.lk:hover,.dz:hover{opacity:1;background:#f1dfb5;border-color:var(--line)}
.lk.on{opacity:1}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:.45em .9em}
.traits .tn{font-family:var(--fK);font-size:.75em;letter-spacing:.1em;color:var(--gold2);text-transform:uppercase}
.hint{background:#f3ead2;border-left:4px solid var(--bur);padding:.45em .7em;margin:.7em 0;border-radius:4px;font-size:.95em}
.npced textarea{min-height:5em}
.grow{flex:1;min-width:6em}
/* Notizen */
.ntitle{font-family:var(--fT);font-size:1.4em;color:var(--bur)}
.bignote{min-height:60vh;margin-top:.5em;font-size:1.02em;line-height:1.45}
/* Karte */
main.tab-map{padding-bottom:0}
.maptop{margin-bottom:.5em;padding:.45em .6em}
.maptop .row{gap:.4em}

<div id="app"></div>
<script>/* Minimal-PDF-Formularleser: liest AcroForm-Feldwerte (Text + Checkboxen) ohne externe Bibliothek.
   Unterstützt klassische Objekte, Objekt-Streams (FlateDecode via DecompressionStream) und inkrementelle Updates. */
(function (root) {
  'use strict';
  const WS = new Set([0, 9, 10, 12, 13, 32]);
  const DELIM = new Set('()<>[]{}/%'.split('').map(c => c.charCodeAt(0)));

  function Ref(n, g) { this.n = n; this.g = g; }
  function Name(s) { this.name = s; }

  class Lexer {
    constructor(bytes, pos) { this.b = bytes; this.p = pos || 0; }
    skip() {
      const b = this.b;
      for (;;) {
        while (this.p < b.length && WS.has(b[this.p])) this.p++;
        if (b[this.p] === 37) { while (this.p < b.length && b[this.p] !== 10 && b[this.p] !== 13) this.p++; }
        else break;
      }
    }
    peekWord() {
      this.skip(); let s = '', q = this.p;
      while (q < this.b.length && !WS.has(this.b[q]) && !DELIM.has(this.b[q])) s += String.fromCharCode(this.b[q++]);
      return s;
    }
    parse() {
      this.skip();
      const b = this.b, c = b[this.p];
      if (c === undefined) return null;
      if (c === 60 && b[this.p + 1] === 60) { // <<
        this.p += 2; const d = {};
        for (;;) {
          this.skip();
          if (b[this.p] === 62 && b[this.p + 1] === 62) { this.p += 2; break; }
          if (this.p >= b.length) break;
          const k = this.parse();
          if (!(k instanceof Name)) { this.p++; continue; }
          d[k.name] = this.parse();
        }
        return d;
      }
      if (c === 91) { // [
        this.p++; const a = [];
        for (;;) { this.skip(); if (b[this.p] === 93) { this.p++; break; } if (this.p >= b.length) break; a.push(this.parse()); }
        return a;
      }
      if (c === 40) return this.litString();
      if (c === 60) return this.hexString();
      if (c === 47) { // name
        this.p++; let s = '';
        while (this.p < b.length && !WS.has(b[this.p]) && !DELIM.has(b[this.p])) s += String.fromCharCode(b[this.p++]);
        s = s.replace(/#([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
        return new Name(s);
      }
      const w = this.peekWord();
      if (/^[+-]?(\d+\.?\d*|\.\d+)$/.test(w)) {
        this.p += w.length;

      this.p += Math.max(1, w.length);
      if (w === 'true') return true; if (w === 'false') return false; if (w === 'null') return null;
      return { op: w };

    litString() {
      const b = this.b; this.p++; let depth = 1; const out = [];
      while (this.p < b.length) {
        let c = b[this.p++];
        if (c === 92) {
          c = b[this.p++];

          else if (c === 13) { if (b[this.p] === 10) this.p++; }
          else if (c === 10) { /* Zeilenfortsetzung */ }
          else out.push(c);
        } else if (c === 40) { depth++; out.push(c); }
        else if (c === 41) { if (--depth === 0) break; out.push(c); }
        else out.push(c);
      }
      return { str: Uint8Array.from(out) };
    }
    hexString() {
      const b = this.b; this.p++; let h = '';
      while (this.p < b.length && b[this.p] !== 62) { const ch = String.fromCharCode(b[this.p++]); if (/[0-9a-fA-F]/.test(ch)) h += ch; }
      this.p++; if (h.length % 2) h += '0';
      const out = new Uint8Array(h.length / 2);

  // PDFDocEncoding-Abweichungen von Latin-1 (0x80–0x9F)
  const PDFDOC = { 0x80: 0x2022, 0x81: 0x2020, 0x82: 0x2021, 0x83: 0x2026, 0x84: 0x2014, 0x85: 0x2013, 0x86: 0x0192, 0x87: 0x2044, 0x88: 0x2039, 0x89: 0x203A, 0x8A: 0x2212, 0x8B: 0x2030, 0x8C: 0x201E, 0x8D: 0x201C, 0x8E: 0x201D, 0x8F: 0x2018, 0x90: 0x2019, 0x91: 0x201A, 0x92: 0x2122, 0x93: 0xFB01, 0x94: 0xFB02, 0x95: 0x0141, 0x96: 0x0152, 0x97: 0x0160, 0x98: 0x0178, 0x99: 0x017D, 0x9A: 0x0131, 0x9B: 0x0142, 0x9C: 0x0153, 0x9D: 0x0161, 0x9E: 0x017E, 0xA0: 0x20AC };
  function decodeStr(u) {

    if (u.length >= 2 && u[0] === 0xFE && u[1] === 0xFF) { let s = ''; for (let i = 2; i + 1 < u.length; i += 2) s += String.fromCharCode((u[i] << 8) | u[i + 1]); return s; }

  async function readFields(buf) {
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const objs = new Map(); const streams = [];

    let txt = ''; const CH = 1 << 16;
    for (let i = 0; i < b.length; i += CH) txt += String.fromCharCode.apply(null, b.subarray(i, i + CH));

        let p = lx.p + 6; if (b[p] === 13) p++; if (b[p] === 10) p++;

        if (end < 0) end = b.length;
        val.__data = b.subarray(p, end);

        const hl = new Lexer(data, 0); const pairs = [];

let img = null, svgUrl = null;
V.mountMap = function () {

  if (svgUrl) { URL.revokeObjectURL(svgUrl); svgUrl = null; }
  const src = m.kind === 'svg' ? (svgUrl = URL.createObjectURL(new Blob([m.src], { type: 'image/svg+xml' }))) : m.src;
  lay.innerHTML = '<img id="mapimg" draggable="false" alt="">'; img = $('#mapimg'); img.style.width = m.w + 'px'; img.style.height = m.h + 'px'; img.src = src;
  if (!S.mv.ok || S.mv.map !== m.id) fit(); else applyView();

};
function fit() {
  const m = V.curMap(); const v = $('#mapview'); if (!m || !v) return;
  const r = v.getBoundingClientRect(); const s = Math.min(r.width / m.w, r.height / m.h) || 1;
  S.mv = { s, tx: (r.width - m.w * s) / 2, ty: (r.height - m.h * s) / 2, ok: true, map: m.id }; applyView();
}
V.fitMap = fit;
function applyView() {
  const lay = $('#maplayer'); if (!lay) return;
  lay.style.transform = 'translate(' + S.mv.tx + 'px,' + S.mv.ty + 'px) scale(' + S.mv.s + ')';
  drawOverlay();
}
function drawOverlay() {
  const ov = $('#mapov'); const m = V.curMap(); if (!ov || !m) return;
  const { s, tx, ty } = S.mv; let h = '';

    const x = tx + c.x * s, y = ty + c.y * s; const on = S.selCity === c.id;
    h += '<div class="city ' + (on ? 'on' : '') + '" data-city="' + c.id + '" style="left:' + x + 'px;top:' + y + 'px" title="' + esc(c.name) + '"><i></i>' + (S.showLabels && c.name && (s > .35 || ['Metropole', 'Großstadt', 'Stadt'].includes(c.type)) ? '<span>' + esc(c.name) + '</span>' : '') + '</div>';
  });
  visibleMarkers(m).forEach(k => {
    const st = mkStyle(k); const a = anchor(st); const x = tx + k.x * s - a.ax, y = ty + k.y * s - a.ay;
    const fs = Math.max(10, Math.round(st.size * (st.shape === 'icon' ? .9 : .5)));
    h += '<div class="mk ' + (S.selMarker === k.id ? 'on' : '') + ' sh-' + st.shape + '" data-mk="' + k.id + '" style="left:' + x + 'px;top:' + y + 'px;width:' + a.w + 'px;height:' + a.h + 'px">' + shapeSvg(st) + '<span class="mki" style="font-size:' + fs + 'px;top:' + a.iy + 'px;left:' + (a.ix || a.w / 2) + 'px">' + esc(st.icon) + '</span>' + (S.showLabels && !k.hideLabel && k.label ? '<span class="mkl" style="top:' + (a.h + 2) + 'px">' + esc(k.label) + '</span>' : '') + '</div>';
  });
  ov.innerHTML = h;
}
V.drawOverlay = drawOverlay;
function toMap(ev) { const r = $('#mapview').getBoundingClientRect(); return { x: (ev.clientX - r.left - S.mv.tx) / S.mv.s, y: (ev.clientY - r.top - S.mv.ty) / S.mv.s }; }
function zoomAt(f, cx, cy) {
  const v = $('#mapview'); if (!v) return; const r = v.getBoundingClientRect(); if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
  const ns = Math.max(.05, Math.min(12, S.mv.s * f)); const k = ns / S.mv.s;

V.zoomMap = f => zoomAt(f);
let drag = null;
function bindView() {
  const v = $('#mapview'); if (!v || v._bound) return; v._bound = true;
  v.addEventListener('wheel', e => { e.preventDefault(); const r = v.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  v.addEventListener('mousedown', e => {
    if (e.button !== 0) return; const m = V.curMap(); if (!m) return;
    const mkEl = e.target.closest('[data-mk]'); const cEl = e.target.closest('[data-city]');
    if (mkEl && S.mapMode === 'select') { const k = m.markers.find(x => x.id === mkEl.dataset.mk); drag = { kind: 'mk', k, sx: e.clientX, sy: e.clientY, ox: k.x, oy: k.y, moved: false }; e.preventDefault(); return; }
    drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, tx: S.mv.tx, ty: S.mv.ty, moved: false, city: cEl ? cEl.dataset.city : null, mk: mkEl ? mkEl.dataset.mk : null }; e.preventDefault();

    if (!drag.moved) return;
    if (drag.kind === 'mk') { drag.k.x = drag.ox + dx / S.mv.s; drag.k.y = drag.oy + dy / S.mv.s; drawOverlay(); }

    if (S.mapMode === 'add') { const p = toMap(e); if (p.x < 0 || p.y < 0 || p.x > m.w || p.y > m.h) return; addMarker(m, p.x, p.y); return; }

}

const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error(T('Bild nicht lesbar', 'Image not readable'))); im.src = src; });

  const m = txt.match(/<svg[^>]*>/i); const tag = m ? m[0] : '';
  const vb = tag.match(/viewBox\s*=\s*["']\s*([-\d.]+)[ ,]+([-\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)/i);
  const w = tag.match(/\bwidth\s*=\s*["']([\d.]+)/i), h = tag.match(/\bheight\s*=\s*["']([\d.]+)/i);
  if (w && h) return { w: +w[1], h: +h[1] }; if (vb) return { w: +vb[3], h: +vb[4] }; return { w: 1600, h: 1000 };
}
V.loadMapFile = async function (f) {
  try {
    if (/\.json$/i.test(f.name) || f.type === 'application/json') { const p = JSON.parse(await V.readAs(f, 'readAsText')); return V.addAtlasProject(p, f.name); }
    if (/svg/i.test(f.type) || /\.svg$/i.test(f.name)) { const txt = await V.readAs(f, 'readAsText'); const sz = svgSize(txt); return addMap({ name: f.name.replace(/\.[^.]+$/, ''), kind: 'svg', src: txt, w: sz.w, h: sz.h }); }

    '<div class="row" style="margin:.35em 0"><button class="btn sm" data-a="gOpenEnt" data-v="' + K(r) + '">' + (r.t === 'pc' ? '🛡️ ' + T('Zum Charakter', 'Open character') : '🎭 ' + T('NSC öffnen', 'Open NPC')) + '</button>' + (onMap(r) ? '<button class="btn sm ghost" data-a="gRemoveNode" data-v="' + K(r) + '" title="' + T('Nur von der Mindmap nehmen – Beziehungen bleiben gespeichert', 'Only take off the mind map – relationships are kept') + '">⤫ ' + T('Von der Mindmap', 'Off the map') + '</button>' : '<button class="btn sm" data-a="gPut" data-v="' + K(r) + '">＋ ' + T('Auf die Mindmap', 'Onto the map') + '</button>') + '</div>' + imgBtns(r, e) +
    '<h4 class="kick">🏛️ ' + T('Gruppen', 'Groups') + '</h4><div class="chips">' + (grs.length ? grs.map(g => '<span class="npcchip" data-a="gSelect" data-v="grp:' + g.id + '"><i class="gdot" style="background:' + (g.color || GCOL[0]) + '"></i><b>' + esc(g.name) + '</b> <span class="tiny">' + esc(kindLbl(g)) + '</span><button class="x" data-a="gLeave" data-g="' + g.id + '" data-v="' + K(r) + '" title="' + T('Aus der Gruppe nehmen', 'Remove from group') + '">×</button></span>').join('') : '<span class="small muted">' + T('Keiner Gruppe zugeordnet.', 'Not in any group.') + '</span>') + '</div>' +
    (avail.length ? '<div class="row gaddrel"><select id="gJoin"><option value="">＋ ' + T('Zu Gruppe hinzufügen …', 'Add to group …') + '</option>' + avail.map(g => '<option value="' + g.id + '">' + (GKIND[g.kind] || GKIND.other)[2] + ' ' + esc(g.name) + ' (' + esc(kindLbl(g)) + ')</option>').join('') + '</select><button class="btn sm primary" data-a="gJoin" data-v="' + K(r) + '">＋</button></div>' : '') +
    relBlock(r);
}
function groupEditor(g) {
  const r = { t: 'grp', id: g.id }; const c = S.camp;
  const cand = c.pcs.map(p => ({ t: 'pc', id: p.id, n: '🛡️ ' + p.name })).concat(c.npcs.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '')).map(n => ({ t: 'npc', id: n.id, n: '🎭 ' + n.name + (n.city ? ' (' + n.city + ')' : '') }))).filter(x => !g.members.some(m => same(m, x)));
  const cityHits = g.kind === 'city' ? c.npcs.filter(n => n.city && n.city.trim().toLowerCase() === String(g.name || '').trim().toLowerCase() && !g.members.some(m => m.t === 'npc' && m.id === n.id)) : [];
  return '<h3>' + (GKIND[g.kind] || GKIND.other)[2] + ' <input type="text" class="cname" data-in="grp" data-k="name" value="' + esc(g.name) + '"><span class="r"><button class="btn sm ghost" data-a="gClose">✖</button></span></h3>' +
    '<div class="cgrid"><label>' + T('Art', 'Kind') + '<select data-ch="grpKind">' + Object.keys(GKIND).map(k => '<option value="' + k + '"' + (g.kind === k ? ' selected' : '') + '>' + GKIND[k][2] + ' ' + esc(L(GKIND[k])) + '</option>').join('') + '</select></label><label>' + T('Farbe', 'Colour') + '<input type="color" data-ch="grpColor" value="' + esc(g.color || GCOL[0]) + '"></label></div>' +
    (g.kind === 'other' ? '<label class="blk">' + T('Eigene Art', 'Custom kind') + '<input type="text" data-in="grp" data-k="kindText" value="' + esc(g.kindText) + '" placeholder="' + T('z. B. Handelsbund, Zirkel, Stamm', 'e.g. trade league, circle, tribe') + '"></label>' : '') +
    '<div class="row" style="margin:.35em 0">' + (onMap(r) ? '<button class="btn sm ghost" data-a="gRemoveNode" data-v="' + K(r) + '">⤫ ' + T('Von der Mindmap', 'Off the map') + '</button>' : '<button class="btn sm" data-a="gPut" data-v="' + K(r) + '">＋ ' + T('Auf die Mindmap', 'Onto the map') + '</button>') + '<button class="btn sm ghost" data-a="gGroupDel">🗑️ ' + T('Gruppe löschen', 'Delete group') + '</button></div>' + imgBtns(r, g) +
    '<label class="blk">' + T('Notizen', 'Notes') + '<textarea data-in="grp" data-k="notes" placeholder="' + T('Ziele, Anführer, Sitz, Geheimnisse …', 'Goals, leader, seat, secrets …') + '">' + esc(g.notes) + '</textarea></label>' +
    '<h4 class="kick">👥 ' + T('Mitglieder', 'Members') + ' <span class="tiny">' + g.members.length + '</span></h4>' +
    (g.members.length ? g.members.map(m => { const i = info(m); if (!i) return ''; return '<div class="li" data-a="gSelect" data-v="' + K(m) + '"><span class="st">' + (m.t === 'pc' ? '🛡️' : '🎭') + '</span><div><b>' + esc(i.name) + '</b><div class="tiny muted">' + esc([i.l1, i.l2].filter(Boolean).join(' · ')) + '</div></div><button class="btn sm ghost x" data-a="gLeave" data-g="' + g.id + '" data-v="' + K(m) + '">×</button></div>'; }).join('') : '<p class="small muted">' + T('Noch keine Mitglieder.', 'No members yet.') + '</p>') +
    (cand.length ? '<div class="row gaddrel"><select id="gMemberPick"><option value="">＋ ' + T('Mitglied hinzufügen …', 'Add member …') + '</option>' + cand.map(x => '<option value="' + x.t + ':' + x.id + '">' + esc(x.n) + '</option>').join('') + '</select><button class="btn sm primary" data-a="gMemberAdd">＋</button></div>' : '') +
    (cityHits.length ? '<button class="btn sm" data-a="gCityResidents">🏘️ ' + cityHits.length + ' ' + T('NSCs mit Wohnort hier zuordnen', 'NPCs living here – assign') + '</button>' : '') +
    relBlock(r);
}
function relEditor(r) {
  const a = info(r.a), b = info(r.b); const col = LEVEL[r.level || 'known'][2];
  return '<h3>↗ ' + T('Beziehung', 'Relationship') + '<span class="r"><button class="btn sm ghost" data-a="gClose">✖</button></span></h3>' +
    '<div class="relhead"><span class="npcchip" data-a="gSelect" data-v="' + K(r.a) + '"><b>' + esc(a ? a.name : '?') + '</b></span><span class="rarrow" style="color:' + col + '">' + (r.dir === 'both' ? '⟷' : '⟶') + '</span><span class="npcchip" data-a="gSelect" data-v="' + K(r.b) + '"><b>' + esc(b ? b.name : '?') + '</b></span></div>' +
    '<div class="row" style="margin:.4em 0"><div class="advsel"><button data-a="gDir" data-v="ab" class="' + (r.dir !== 'both' ? 'on' : '') + '">→ ' + T('einseitig', 'one-way') + '</button><button data-a="gDir" data-v="both" class="' + (r.dir === 'both' ? 'on' : '') + '">↔ ' + T('wechselseitig', 'mutual') + '</button></div>' + (r.dir !== 'both' ? '<button class="btn sm" data-a="gSwap" title="' + T('Richtung umkehren', 'Reverse direction') + '">⇄</button>' : '') + '</div>' +
    '<div class="tiny muted">' + T('Art der Beziehung', 'Kind of relationship') + '</div><div class="lvpick">' + LEVELS.map(l => '<button class="lvb ' + (r.level === l ? 'on' : '') + '" data-a="gLevelSet" data-v="' + l + '" style="--c:' + LEVEL[l][2] + '"><i></i>' + esc(L(LEVEL[l])) + '</button>').join('') + '</div>' +
    '<label class="blk">' + T('Bezeichnung (am Pfeil)', 'Label (on the arrow)') + '<input type="text" data-in="rel" data-k="label" value="' + esc(r.label) + '" placeholder="' + T('z. B. Bruder, schuldet Geld, Lehensherr', 'e.g. brother, owes money, liege lord') + '"></label>' +
    '<label class="blk">' + T('Notiz', 'Note') + '<textarea data-in="rel" data-k="note">' + esc(r.note) + '</textarea></label>' +
    '<div class="foot"><button class="btn sm ghost" data-a="gRelDel">🗑️ ' + T('Beziehung löschen', 'Delete relationship') + '</button></div>';
}

/* ---------- Mini-Ansicht für NSC- und Charakterseite ---------- */
V.graphMini = function (t, id) {
  ensure(); const r = { t, id }; const grs = groupsOf(r); const rs = relsOf(r);
  return '<h4 class="kick">🕸️ ' + T('Gruppen & Beziehungen', 'Groups & relationships') + ' <button class="btn sm" data-a="gShow" data-v="' + K(r) + '">' + T('In der Mindmap', 'In the mind map') + '</button></h4>' +
    '<div class="chips">' + grs.map(g => '<span class="npcchip" data-a="gShow" data-v="grp:' + g.id + '"><i class="gdot" style="background:' + (g.color || GCOL[0]) + '"></i>' + esc(g.name) + '</span>').join('') + rs.map(x => { const o = same(x.a, r) ? x.b : x.a; const i = info(o); if (!i) return ''; return '<span class="npcchip" data-a="gShowRel" data-id="' + x.id + '"><span style="color:' + LEVEL[x.level || 'known'][2] + ';font-weight:700">' + (x.dir === 'both' ? '↔' : same(x.a, r) ? '→' : '←') + '</span> ' + esc(i.name) + ' <span class="tiny">' + esc(x.label || L(LEVEL[x.level || 'known'])) + '</span></span>'; }).join('') + (grs.length || rs.length ? '' : '<span class="small muted">' + T('Noch keine.', 'None yet.') + '</span>') + '</div>';
};

/* ---------- Aktionen ---------- */
function parseRef(v) { const i = String(v || '').indexOf(':'); return i < 0 ? null : { t: v.slice(0, i), id: v.slice(i + 1) }; }
function createRel(a, b, level) {
  ensure(); if (same(a, b)) return; addNode(a); addNode(b);
  const r = { id: uid(), a: { t: a.t, id: a.id }, b: { t: b.t, id: b.id }, dir: 'ab', level: level || 'known', label: '', note: '', created: Date.now() };
  S.camp.rels.push(r); S.gRel = r.id; S.gSel = null; S.gLinkFrom = null; save(); render();
  setTimeout(() => { const i = $('[data-in="rel"][data-k="label"]'); if (i) i.focus(); }, 30);
  return r;
}
V.graphCreateRel = createRel;
function newGroup(o) {
  ensure(); const c = S.camp;
  const g = Object.assign({ id: uid(), name: T('Neue Gruppe', 'New group'), kind: 'faction', kindText: '', color: GCOL[c.groups.length % GCOL.length], img: '', notes: '', members: [], created: Date.now() }, o || {});
  c.groups.push(g); return g;
}
V.graphNewGroup = newGroup;
/* Mitglied aufnehmen – standardmäßig nur eine Gruppe je Art */
function join(g, r, mode) {
  const kk = kindKey(g); const clash = S.camp.groups.filter(x => x !== g && kindKey(x) === kk && x.members.some(m => same(m, r)));
  if (clash.length && !mode) {
    S.pendingJoin = { g: g.id, r };
    S.modal = () => '<h2>🏛️ ' + T('Schon in einer Gruppe dieser Art', 'Already in a group of this kind') + '</h2><p>' + T('„', '"') + esc((info(r) || {}).name) + T('“ gehört bereits zu ', '" already belongs to ') + clash.map(x => '<b>' + esc(x.name) + '</b>').join(', ') + ' (' + esc(kindLbl(g)) + '). ' + T('Normalerweise gehört eine Person nur zu einer Gruppe jeder Art.', 'Normally a person belongs to only one group of each kind.') + '</p>' +
      '<div class="foot"><button class="btn" data-a="closeModal">' + T('Abbrechen', 'Cancel') + '</button><button class="btn" data-a="gJoinDo" data-v="also">＋ ' + T('Zusätzlich (Ausnahme)', 'Additionally (exception)') + '</button><button class="btn primary" data-a="gJoinDo" data-v="replace">⇄ ' + T('Wechseln zu „', 'Switch to "') + esc(g.name) + T('“', '"') + '</button></div>';
    render(); return false;
  }
  if (mode === 'replace') clash.forEach(x => { x.members = x.members.filter(m => !same(m, r)); });
  if (!g.members.some(m => same(m, r))) g.members.push({ t: r.t, id: r.id });
  save(); return true;
}
V.graphJoin = join;
function purge(t, id) {
  const c = S.camp; if (!c) return; ensure(); const r = { t, id };
  c.rels = c.rels.filter(x => !same(x.a, r) && !same(x.b, r)); c.groups.forEach(g => { g.members = g.members.filter(m => !same(m, r)); });
  c.graph.nodes = c.graph.nodes.filter(n => !same(n, r)); if (S.gSel && same(S.gSel, r)) S.gSel = null;
}
V.graphPurge = purge;
const curRel = () => S.camp.rels.find(x => x.id === S.gRel);
const curGrp = () => S.gSel && S.gSel.t === 'grp' ? S.camp.groups.find(g => g.id === S.gSel.id) : null;
Object.assign(V.A, {
  gMode(el) { S.gMode = el.dataset.v; S.gLinkFrom = null; render(); },
  gZoom(el) { const v = $('#gview'); if (!v) return; const r = v.getBoundingClientRect(); zoomAt(+el.dataset.v, r.width / 2, r.height / 2); },
  gFit() { fit(); },
  gLayout() { layout(); save(); fit(); },
  gNewGroup() { const g = newGroup(); addNode({ t: 'grp', id: g.id }); S.gSel = { t: 'grp', id: g.id }; S.gRel = null; S.tab = 'graph'; save(); render(); setTimeout(() => { const i = $('.cname'); if (i) { i.focus(); i.select(); } }, 30); },
  gAddAll() { ensure(); S.camp.pcs.forEach(p => addNode({ t: 'pc', id: p.id })); S.camp.groups.forEach(g => addNode({ t: 'grp', id: g.id })); S.gv.ok = false; save(); render(); },
  gCities() {
    ensure(); let ng = 0, nm = 0;
    V.cityList().forEach(ci => { let g = S.camp.groups.find(x => x.kind === 'city' && x.name.trim().toLowerCase() === ci.name.trim().toLowerCase()); if (!g) { g = newGroup({ name: ci.name, kind: 'city', notes: ci.city && ci.city.notes ? ci.city.notes : '' }); ng++; }
      S.camp.npcs.forEach(n => { if (n.city && n.city.trim().toLowerCase() === ci.name.trim().toLowerCase() && !g.members.some(m => m.t === 'npc' && m.id === n.id) && !S.camp.groups.some(x => x !== g && x.kind === 'city' && x.members.some(m => m.t === 'npc' && m.id === n.id))) { g.members.push({ t: 'npc', id: n.id }); nm++; } }); });
    save(); toast('🏰 ' + ng + ' ' + T('Städte angelegt', 'towns created') + ', ' + nm + ' ' + T('NSCs zugeordnet', 'NPCs assigned')); render();
  },
  gSelect(el, ev) { if (ev && ev.target.closest('.x')) return; const r = parseRef(el.dataset.v); if (!r || !ent(r)) return; S.gSel = r; S.gRel = null; render(); },
  gSelRel(el) { S.gRel = el.dataset.id; S.gSel = null; render(); },
  gClose() { S.gSel = null; S.gRel = null; render(); },
  gPut(el) { const r = parseRef(el.dataset.v); addNode(r); save(); render(); },
  gRemoveNode(el) { const r = parseRef(el.dataset.v); S.camp.graph.nodes = S.camp.graph.nodes.filter(n => !same(n, r)); save(); render(); },
  gOpenEnt(el) { const r = parseRef(el.dataset.v); if (r.t === 'npc') V.A.openNpc({ dataset: { id: r.id } }, { target: el }); else V.A.gotoPc({ dataset: { id: r.id } }); },
  gImg(el) { const r = parseRef(el.dataset.v); V.pickFile('image/*', false, async fs => { if (!fs[0]) return; const e = ent(r); e.img = await V.shrinkImg(await V.readAs(fs[0], 'readAsDataURL'), 240); save(); render(); }); },
  gImgDel(el) { const e = ent(parseRef(el.dataset.v)); e.img = ''; save(); render(); },
  gJoin(el) { const r = parseRef(el.dataset.v); const gid = ($('#gJoin') || {}).value; const g = S.camp.groups.find(x => x.id === gid); if (!g) { toast(T('Bitte eine Gruppe wählen.', 'Please choose a group.')); return; } if (join(g, r)) render(); },
  gJoinDo(el) { const p = S.pendingJoin; S.modal = null; S.pendingJoin = null; if (!p) return render(); const g = S.camp.groups.find(x => x.id === p.g); if (g) join(g, p.r, el.dataset.v); render(); },
  gLeave(el) { const g = S.camp.groups.find(x => x.id === el.dataset.g); const r = parseRef(el.dataset.v); if (g) { g.members = g.members.filter(m => !same(m, r)); save(); } render(); },
  gMemberAdd() { const g = curGrp(); const r = parseRef(($('#gMemberPick') || {}).value); if (!g || !r) { toast(T('Bitte zuerst jemanden wählen.', 'Please choose someone first.')); return; } if (join(g, r)) { if (onMap({ t: 'grp', id: g.id })) addNode(r); save(); render(); } },
  gCityResidents() { const g = curGrp(); let n = 0; S.camp.npcs.forEach(x => { if (x.city && x.city.trim().toLowerCase() === g.name.trim().toLowerCase() && !g.members.some(m => m.t === 'npc' && m.id === x.id)) { const ok = !S.camp.groups.some(o => o !== g && o.kind === 'city' && o.members.some(m => m.t === 'npc' && m.id === x.id)); if (ok) { g.members.push({ t: 'npc', id: x.id }); n++; } } }); save(); toast('🏘️ ' + n + ' ' + T('zugeordnet', 'assigned')); render(); },
  gGroupDel() { const g = curGrp(); S.modal = () => V.confirmDlg('🗑️ ' + esc(g.name), T('Gruppe samt ihren Beziehungen löschen? Die Mitglieder bleiben erhalten.', 'Delete the group and its relationships? Members are kept.'), 'gGroupDelDo', g.id); render(); },
  gGroupDelDo(el) { const id = el.dataset.id; purge('grp', id); S.camp.groups = S.camp.groups.filter(g => g.id !== id); S.modal = null; save(); render(); },
  gLinkStart(el) { S.gMode = 'link'; S.gLinkFrom = parseRef(el.dataset.v); addNode(S.gLinkFrom); S.gSel = null; S.gRel = null; render(); },
  gRelAdd(el) { const a = parseRef(el.dataset.v); const b = parseRef(($('#gRelTo') || {}).value); if (!b) { toast(T('Bitte ein Ziel wählen.', 'Please choose a target.')); return; } createRel(a, b, ($('#gRelLv') || {}).value || 'known'); },
  gDir(el) { const r = curRel(); r.dir = el.dataset.v; save(); render(); },
  gSwap() { const r = curRel(); const t = r.a; r.a = r.b; r.b = t; save(); render(); },
  gLevelSet(el) { const r = curRel(); r.level = el.dataset.v; save(); render(); },
  gRelDel() { const r = curRel(); if (!r) return; S.camp.rels = S.camp.rels.filter(x => x !== r); S.gRel = null; save(); render(); },
  gShow(el) { const r = parseRef(el.dataset.v); addNode(r); S.gSel = r; S.gRel = null; S.tab = 'graph'; S.modal = null; save(); render(); centerOn(r); },
  gShowRel(el) { const r = S.camp.rels.find(x => x.id === el.dataset.id); if (!r) return; addNode(r.a); addNode(r.b); S.gRel = r.id; S.gSel = null; S.tab = 'graph'; save(); render(); centerOn(r.a); }
});
function centerOn(r) { setTimeout(() => { const n = onMap(r); const v = $('#gview'); if (!n || !v) return; const b = v.getBoundingClientRect(); S.gv.tx = b.width / 2 - n.x * S.gv.s; S.gv.ty = b.height / 2 - n.y * S.gv.s; S.gv.ok = true; draw(); }, 40); }
Object.assign(V.IN, {
  grp(el) { const g = curGrp(); if (!g) return; g[el.dataset.k] = el.value; save(); draw(); },
  rel(el) { const r = curRel(); if (!r) return; r[el.dataset.k] = el.value; save(); draw(); }
});
Object.assign(V.CH, {
  gAdd(el) { const r = parseRef(el.value); if (!r) return; addNode(r); S.gSel = r; S.gRel = null; save(); render(); },
  gLevel(el) { S.gLevels[el.dataset.v] = el.checked; draw(); },
  gMembers(el) { S.gMembers = el.checked; draw(); },
  grpKind(el) { const g = curGrp(); g.kind = el.value; save(); render(); },
  grpColor(el) { const g = curGrp(); g.color = el.value; save(); render(); }
});
/* Aufräumen beim Löschen von NSC / Charakter */
const oNpc = V.A.npcDelDo, oPc = V.A.pcDelDo;
V.A.npcDelDo = function (el) { purge('npc', el.dataset.id); return oNpc.apply(this, arguments); };
V.A.pcDelDo = function (el) { purge('pc', el.dataset.id); return oPc.apply(this, arguments); };
})(window);
</script>
</body>
</html>
