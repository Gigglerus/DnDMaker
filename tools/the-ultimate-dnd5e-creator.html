GT=["Ich bin neugierig und stelle ständig Fragen.","Ich bleibe auch in Gefahr ruhig.","Ich mache Witze, um Spannung abzubauen.","Ich vertraue Fremden nur langsam."],
GI=["Freiheit: Niemand soll unterdrückt werden. (Chaotisch)","Gemeinwohl: Die Gruppe zählt mehr als der Einzelne. (Rechtschaffen)","Güte: Ich helfe, wo ich kann. (Gut)","Macht: Wer stark ist, darf führen. (Böse)","Wissen: Verstehen ist mehr wert als Besitz. (Neutral)"],
GB=["Meine Gefährten sind meine Familie.","Ich suche meine verlorene Heimat.","Ich schulde einem Mentor mein Leben."],
GF=["Ich traue niemandem ganz.","Ich kann Rache schwer vergessen.","Ich unterschätze Gefahren."],
BGP=[[["Ich zitiere Lehrsätze meines Glaubens für jede Lage.","Ich sehe in jedem Fremden einen Pilger."],"Glaube: Mein Gott führt meine Hand. (Rechtschaffen)","Ich beschütze das Heiligtum, in dem ich diente.","Ich vertraue meiner Kirche blind."],
[["Ich wechsle Rollen schneller als Kleider.","Ich lüge auch ohne Grund."],"Unabhängigkeit: Regeln sind für andere. (Chaotisch)","Ich will einem Mann heimzahlen, den ich einst betrog.","Ich kann einem leichten Gewinn nicht widerstehen."],
[["Ich habe immer einen Fluchtplan.","Ich rede wenig und beobachte viel."],"Ehre unter Dieben: Ich hintergehe meine Leute nie. (Neutral)","Ich muss einem Hehler noch einen Gefallen zurückzahlen.","Bei Beute werde ich gierig."],
[["Ich brauche Publikum und rede gern in Versen.","Ich merke mir jede Geschichte."],"Schönheit: Kunst macht die Welt besser. (Gut)","Mein Instrument ist ein unersetzliches Erbstück.","Ich bin eitel und hasse Kritik."],
[["Ich bleibe bescheiden und packe einfach an.","Ich verteidige die Schwachen."],"Gerechtigkeit: Tyrannen müssen fallen. (Chaotisch)","Meine Heimatgemeinde ist mir heilig.","Mein Ruhm macht mich leichtsinnig."],
[["Ich bin stolz auf saubere Arbeit.","Ich schätze Dinge nach ihrer Machart."],"Gemeinschaft: Gemeinsam bauen wir mehr auf. (Rechtschaffen)","Meine Werkstatt und Zunft brauchen mich.","Für Geld tue ich fast alles."],
[["Ich schweige lieber, als Unsinn zu reden.","Ich denke laut über Rätsel des Lebens nach."],"Erkenntnis: Wahrheit liegt in der Stille. (Neutral)","Ich habe eine Entdeckung gemacht, die die Welt verändern könnte.","Ich bin mürrisch gegenüber Gesellschaft."],
[["Ich erwarte höfliches Auftreten von allen.","Ich genieße Luxus und Etikette."],"Verantwortung: Wer führt, dient den Menschen. (Rechtschaffen)","Der Ruf meiner Familie ist mein wichtigstes Gut.","Ich blicke auf einfache Leute herab."],
[["Ich bin ruhig in der Wildnis und unruhig in Städten.","Ich messe Menschen an ihrem Überlebenswillen."],"Natur: Das Land verdient Respekt. (Neutral)","Ich schütze die Heimat meines Stammes.","Ich traue Stadtmenschen kaum."],
[["Ich liebe Bücher mehr als Menschen.","Ich erkläre auch ungefragt."],"Wissen: Wer sucht, wird finden. (Neutral)","Ich suche ein verlorenes Werk meines Lehrers.","Ich bin zerstreut und verliere mich in Details."],

Nachteil=Roll the d20 twice and take the lower result.
Übungsbonus=A bonus added to rolls you are proficient in: skills, saving throws, weapons and spell attacks. It grows from +2 to +6 with level.
Rettungswurf=d20 plus ability modifier (plus proficiency bonus if proficient) against a difficulty class to resist an effect.
Rüstungsklasse=The number an attack roll must reach to hit you.
Initiative=d20 plus Dexterity modifier. The result sets the turn order in combat.
Inspiration=A reward from the DM. Spend it once to gain advantage on a roll.
Konzentration=Some spells last only while you concentrate. Damage or casting another concentration spell breaks it; damage requires a Constitution saving throw.
Todesrettungswürfe=At 0 hit points you roll a d20 each turn. 10 or higher is a success, lower a failure. Three successes stabilize you, three failures kill you.
Bonusaktion=An extra short action each turn, available only if an ability or spell grants one.
Reaktion=You get one per round, triggered by an event such as an opportunity attack.
Kurze Rast=At least one hour of rest. You can spend Hit Dice to heal, and some abilities recharge.
Lange Rast=At least eight hours. You regain all hit points and half your Hit Dice; spell slots and most abilities recharge.
Zauberrettungswurf-SG=8 plus proficiency bonus plus your spellcasting ability modifier.
Passive Wahrnehmung=10 plus your Perception bonus. It lets you notice things without rolling.
Zaubertrick=A level 0 spell. You can cast it at will without a spell slot.
Zaubertricks=Level 0 spells. You can cast them at will without spell slots.
Stärke=Physical power: Athletics, melee attacks and damage, carrying capacity.
Geschicklichkeit=Reflexes and balance: armor class, initiative, ranged attacks, stealth.
Konstitution=Endurance and toughness: hit points and concentration.
Intelligenz=Reasoning, memory and knowledge, such as Arcana, History and Investigation.
Weisheit=Perception, insight and willpower.
Charisma=Force of personality and persuasiveness.
Akrobatik=Dexterity: keeping balance, rolling, breaking a fall, stunts.
Arkane Kunde=Intelligence: knowledge of magic, spells, magic items and other planes.
Athletik=Strength: climbing, swimming, long jumps, grappling.
Auftreten=Charisma: music, dance, acting and speeches.
Einschüchtern=Charisma: causing fear through threats or violence.
Geschichte=Intelligence: knowledge of events, legends, wars and realms.
Heilkunde=Wisdom: stabilizing the dying, recognizing wounds and diseases.
Heimlichkeit=Dexterity: moving silently and staying unnoticed.
Motiv erkennen=Wisdom: judging intentions and feelings, spotting lies.
Nachforschungen=Intelligence: searching for clues and drawing conclusions.
Naturkunde=Intelligence: knowledge of terrain, plants, animals and weather.
Religion=Intelligence: knowledge of gods, rites, holy symbols and undead.
Fingerfertigkeit=Dexterity: pickpocketing, sleight of hand, opening locks with tools.
Täuschen=Charisma: lying, concealing the truth, disguising convincingly.
Überlebenskunst=Wisdom: tracking, hunting, finding your way in the wild.
Überzeugen=Charisma: influencing others politely and tactfully.
Umgang mit Tieren=Wisdom: calming, directing or frightening animals, handling mounts.
Wahrnehmung=Wisdom: seeing, hearing or smelling something, noticing ambushes.
Blind=You can't see and fail checks that need sight. Attacks against you have advantage, your attacks have disadvantage.
Bezaubert=You can't attack the charmer or target them with harmful effects. The charmer has advantage on social checks against you.
Taub=You can't hear and fail checks that need hearing.
Erschöpfung=Six levels: 1 disadvantage on checks, 2 speed halved, 3 disadvantage on attacks and saves, 4 hit point maximum halved, 5 speed 0, 6 death. A long rest lowers it by one.
Verängstigt=Disadvantage on checks and attacks while the source of fear is in sight. You can't willingly move closer to it.
Gepackt=Your speed is 0. It ends if the grappler is incapacitated or you are moved out of reach.
Handlungsunfähig=You can't take actions or reactions.
Unsichtbar=You can only be seen with magic or special senses. Attacks against you have disadvantage, your attacks have advantage.
Gelähmt=You are incapacitated and can't move or speak. Strength and Dexterity saves fail, attacks have advantage, hits from close range are critical hits.
Versteinert=You turn to stone, are incapacitated and resist all damage. You are immune to poison and disease; attacks have advantage.
Vergiftet=Disadvantage on attack rolls and ability checks.
Liegend=You can only crawl until you stand up (costs half your movement). Melee attacks against you have advantage, ranged attacks disadvantage. Your own attacks have disadvantage.
Festgesetzt=Speed 0. Attacks against you have advantage, yours have disadvantage, as do Dexterity saves.
Betäubt=You are incapacitated, can't move and barely speak. Strength and Dexterity saves fail, attacks have advantage.
Bewusstlos=You are incapacitated, fall prone and drop everything. Attacks have advantage, hits from close range are critical hits.
Kampfrausch=Bonus action: advantage on Strength checks and saves, bonus melee damage, resistance to bludgeoning, piercing and slashing. Limited uses per day.
Ungepanzerte Verteidigung=Without armor your AC is 10 plus Dexterity plus Constitution (barbarian) or Wisdom (monk).
Rücksichtsloser Angriff=Advantage on your melee attacks, but enemies have advantage against you until your next turn.
Gefahrensinn=Advantage on Dexterity saves against effects you can see.
Zusätzlicher Angriff=You attack twice with the Attack action, more often at higher levels.
