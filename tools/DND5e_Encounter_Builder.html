:root{
  --parch-in:#f6ecd2; --parch-out:#e9d6a8; --parch-card:#fbf4e1; --parch-deep:#efdfb8;
  --gold:#b8902f; --gold-dk:#a07a2a; --gold-lt:#d9b862;
  --burg:#6e1a1a; --burg-2:#8a2222; --burg-lt:#a83a2e;
  --ink:#3b2416; --ink-2:#5a3a22; --ink-3:#7a5a3a;
  --cream:#f5e9cc; --line:#cdb27a;
  --ok:#3f6b2a; --bad:#8a2222; --warn:#a8641a;
  --d-easy:#5f8a3a; --d-medium:#c19a2c; --d-hard:#c46a1f; --d-deadly:#8a2222; --d-trivial:#8b8170;
  --f-kicker:'Cinzel','EB Kicker',serif; --f-title:'Almendra','Fondamento','EB Title',serif; --f-body:'Crimson Text','EB Body','Book Antiqua',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--f-body); color:var(--ink); font-size:17px; line-height:1.4;
  background-color:var(--parch-out);
  background-image:radial-gradient(ellipse at center, var(--parch-in) 0%, #f3e5c3 45%, var(--parch-out) 100%);
  background-attachment:fixed; min-height:100vh;
}
body::before{ /* Vignette + Pergamentkörnung */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse at center, transparent 55%, rgba(120,80,30,.22) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.corner{position:fixed;width:150px;height:150px;z-index:1;pointer-events:none;opacity:.95}
body.inner .corner{width:84px;height:84px;opacity:.85}
.corner.tl{top:6px;left:6px}.corner.tr{top:6px;right:6px;transform:scaleX(-1)}
.corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}.corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}
#app{position:relative;z-index:2;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:normal}
.hidden{display:none!important}

/* ---------- Ornament-Elemente ---------- */
.divider{display:block;margin:0 auto;width:min(520px,80vw);height:26px}
.kicker{font-family:var(--f-kicker);color:var(--gold-dk);letter-spacing:.42em;font-size:17px;text-transform:uppercase;padding-left:.42em}
.title{font-family:var(--f-title);color:var(--burg);text-shadow:0 2px 0 rgba(255,245,215,.8),0 3px 6px rgba(110,26,26,.25)}
.sub{font-style:italic;color:var(--ink-2)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  font-weight:700;border-radius:4px;padding:.55em 1.1em;cursor:pointer;
  background:var(--cream);color:var(--ink);border:2px solid var(--ink);
  box-shadow:0 2px 0 rgba(59,36,22,.25),0 4px 10px rgba(59,36,22,.18);
  transition:transform .08s ease, box-shadow .12s ease, filter .12s;
  font-size:16px; line-height:1.15; white-space:nowrap;
}
.btn:hover{filter:brightness(1.04);box-shadow:0 2px 0 rgba(59,36,22,.25),0 6px 14px rgba(59,36,22,.25)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--burg-lt) 0%,var(--burg-2) 40%,var(--burg) 100%);color:#f8ecd0;border:1px solid #4a0f0f;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.small{padding:.3em .65em;font-size:14px;border-width:1.5px}
.btn.tiny{padding:.15em .45em;font-size:13px;border-width:1px;box-shadow:0 1px 2px rgba(59,36,22,.2)}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ico{font-size:1.05em}

/* Sprachumschalter */
.lang{display:inline-flex;align-items:center;gap:.4em;border:1.5px solid var(--gold);border-radius:4px;padding:3px;background:rgba(251,244,225,.7)}
.lang .globe{padding:0 .3em}
.lang button{border:0;background:transparent;padding:.2em .7em;border-radius:3px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.lang button.on{background:linear-gradient(180deg,var(--burg-2),var(--burg));color:#f8ecd0}

/* ---------- Willkommen ---------- */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 60px;gap:10px}
.welcome .logo{width:118px;height:118px;filter:drop-shadow(0 4px 6px rgba(80,30,10,.3))}
.welcome .title{font-size:clamp(40px,6vw,66px);line-height:1.05}
.welcome .tagline{max-width:600px;font-size:19px;margin-top:6px}
.welcome .begins{font-style:italic;font-weight:600;color:var(--burg);font-size:19px;margin:2px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(230px,1fr));gap:14px;margin-top:14px}
.grid2 .btn{padding:.85em 1.2em;font-size:18px}
.footnote{font-size:13px;color:var(--ink-3);font-style:italic;margin-top:22px;max-width:620px}

/* ---------- Kopfleiste ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 92px 6px 92px;flex-wrap:wrap;position:relative}
.topbar .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.topbar .brand svg{width:46px;height:46px}
.topbar .brand .kicker{font-size:11px;display:block;letter-spacing:.35em}
.topbar .brand .title{font-size:27px;line-height:1}
.topbar .spacer{flex:1}
.page-title{text-align:center;margin:0 0 4px}
.page-title .title{font-size:34px}
.wrap{padding:6px 34px 40px;max-width:1500px;margin:0 auto}

/* ---------- Karten/Panels ---------- */
.card{background:linear-gradient(180deg,rgba(251,244,225,.92),rgba(246,234,205,.92));border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:0 2px 10px rgba(90,58,34,.12),inset 0 0 0 3px rgba(255,250,235,.5);position:relative}
.card + .card{margin-top:14px}
.card h3{font-family:var(--f-kicker);color:var(--burg);font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.label{font-size:14px;color:var(--ink-2);font-weight:600;margin:10px 0 5px;display:block}
.cols{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
@media (max-width:1050px){.cols{grid-template-columns:1fr}}

input[type=text],input[type=number],select,textarea{
  background:#fffaf0;border:1.5px solid var(--line);border-radius:4px;padding:.3em .5em;color:var(--ink);
}
input[type=number]{width:4.2em}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-lt);border-color:var(--gold)}
textarea{width:100%;min-height:60px;resize:vertical}

/* Auswahl-Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fbf3df;border-radius:999px;padding:.22em .75em;cursor:pointer;font-size:15px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:.35em;align-items:center}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(180deg,var(--burg-2),var(--burg));color:#f8ecd0;border-color:#4a0f0f}
.chip.cat{border-radius:5px;padding:.4em .8em;font-size:15.5px;background:var(--cream);border:2px solid var(--ink);box-shadow:0 2px 0 rgba(59,36,22,.2);color:var(--ink)}
.chip.cat:hover{background:#fff4da}
.chip .n{font-weight:400;color:var(--ink-3);font-size:13px}
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.diffs .chip{justify-content:center;border-radius:4px;padding:.35em .2em}

.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.players label{display:flex;flex-direction:column;font-size:13px;color:var(--ink-3);background:#fbf3df;border:1px solid var(--line);border-radius:4px;padding:4px 6px}
.players select{margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:0}
.stepper button{width:30px;height:30px;border:1.5px solid var(--ink);background:var(--cream);cursor:pointer;font-weight:700}
.stepper button:first-child{border-radius:4px 0 0 4px}.stepper button:last-child{border-radius:0 4px 4px 0}
.stepper input{width:3em;height:30px;text-align:center;border-radius:0;border-left:0;border-right:0;border-color:var(--ink)}

.hint{background:rgba(255,248,228,.8);border-left:3px solid var(--gold);padding:8px 12px;font-style:italic;color:var(--ink-2);border-radius:0 4px 4px 0;font-size:15.5px}
.hint p{margin:0 0 6px}.hint p:last-child{margin:0}

/* ---------- Schwierigkeitsanzeige ---------- */
.meter-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rating{font-family:var(--f-title);font-size:34px;line-height:1}
.rating.easy{color:var(--d-easy)}.rating.medium{color:var(--d-medium)}.rating.hard{color:var(--d-hard)}.rating.deadly{color:var(--d-deadly)}.rating.trivial,.rating.none{color:var(--d-trivial)}
.target-tag{font-size:14px;color:var(--ink-3);font-style:italic}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:#fbf3df;border:1px solid var(--line);border-radius:4px;padding:6px 8px;text-align:center}
.stat .v{font-size:22px;font-weight:700;color:var(--ink)}
.stat .k{font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.stat .s{font-size:12px;color:var(--ink-3);font-style:italic}
.bar{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#d8ccae,#e6dbc0);border:1px solid var(--line);overflow:visible;margin:22px 0 26px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .25s ease,background .25s}
.bar .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink-2)}
.bar .mk span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--ink-2)}
.bar .mk b{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--ink-3);font-weight:600}
.thr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thr div{border:1px solid var(--line);border-radius:4px;padding:4px;text-align:center;font-size:14px;background:#fbf3df}
.thr div.on{outline:2px solid var(--burg);background:#fff4da;font-weight:700}

/* ---------- Begegnungsliste ---------- */
.enc-list{display:flex;flex-direction:column;gap:6px}
.enc-row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;background:#fffaf0;border:1px solid var(--line);border-radius:5px;padding:6px 10px}
.enc-row .nm{font-weight:700;cursor:pointer}
.enc-row .nm small{font-weight:400;color:var(--ink-3);font-style:italic;margin-left:6px}
.enc-row .meta{font-size:14px;color:var(--ink-2)}
.enc-row .xpcell{font-size:14px;color:var(--ink-3);min-width:80px;text-align:right}
.enc-row .detail{grid-column:1/-1}
.badge{display:inline-block;min-width:38px;text-align:center;font-size:13px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--burg);color:#f8ecd0}
.badge.gold{background:var(--gold-dk)}
.empty{padding:16px;text-align:center;color:var(--ink-3);font-style:italic}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(40,22,10,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{width:min(1000px,100%);background:var(--parch-in);background-image:radial-gradient(ellipse at center,#faf1da,#efdcae);border:2px solid var(--gold);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4);padding:18px 20px;position:relative}
.modal .mh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.modal .mh .title{font-size:30px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:15px}
.mlist{display:flex;flex-direction:column;gap:5px;max-height:none}
.mrow{background:#fffaf0;border:1px solid var(--line);border-radius:5px}
.mrow .head{display:grid;grid-template-columns:1fr 70px 80px 60px 70px auto;gap:8px;align-items:center;padding:6px 10px;cursor:pointer}
.mrow .head:hover{background:#fff4da}
.mrow .head .nm{font-weight:700}
.mrow .head .nm small{font-weight:400;font-style:italic;color:var(--ink-3);margin-left:6px}
.mrow .head .c{font-size:14px;text-align:center;color:var(--ink-2)}
.mrow .addbox{display:flex;gap:6px;align-items:center}
.mrow .addbox input{width:3.4em}
.cols-head{display:grid;grid-template-columns:1fr 70px 80px 60px 70px auto;gap:8px;padding:0 10px;font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--burg);color:#f8ecd0;padding:.6em 1.2em;border-radius:4px;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:600}

/* ---------- Werteblock ---------- */
.sb{padding:10px 14px 14px;border-top:1px solid var(--line);font-size:15.5px;background:linear-gradient(180deg,#fdf7e6,#f8edd0)}
.sb .tl{font-style:italic;color:var(--ink-2);margin-bottom:6px}
.sb .rule{height:3px;background:linear-gradient(90deg,var(--burg),var(--burg) 60%,transparent);margin:7px 0;border-radius:2px}
.sb .p{margin:2px 0}.sb .p b{color:var(--burg)}
.sb table.abl{border-collapse:collapse;margin:4px 0;width:100%;max-width:520px}
.sb table.abl th{color:var(--burg);font-size:13px;letter-spacing:.06em}
.sb table.abl td{text-align:center;font-size:15px;padding:1px 4px}
.sb table.abl td.sv{font-size:13px;color:var(--ink-3)}
.sb table.abl td.sv.prof{color:var(--burg);font-weight:700}
.sb h4{font-family:var(--f-kicker);color:var(--burg);font-size:15px;letter-spacing:.08em;border-bottom:1px solid var(--burg);margin:10px 0 4px;padding-bottom:1px}
.sb .ent{margin:4px 0}
.sb .ent b i{color:var(--ink)}
.dmgtag{font-size:13px;color:var(--ink-3)}

/* ---------- Gespeicherte Liste ---------- */
.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.saved-card .nm{font-family:var(--f-title);font-size:24px;color:var(--burg);line-height:1.1;margin-bottom:4px;word-break:break-word}
.saved-card .info{font-size:14.5px;color:var(--ink-2)}
.saved-card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.saved-card .rn{display:flex;gap:6px}
.saved-card .rn input{flex:1}

/* ---------- Kampfansicht ---------- */
.cbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cbar .round{font-family:var(--f-title);font-size:26px;color:var(--burg);margin-right:6px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--cream);padding:.3em .7em;cursor:pointer;font-weight:700;font-size:14.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,var(--burg-2),var(--burg));color:#f8ecd0}
.seg button.on.adv{background:linear-gradient(180deg,#5b8a3d,#3f6b2a)}
.ctl{display:inline-flex;align-items:center;gap:5px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.ccols{display:grid;grid-template-columns:300px 1fr 330px;gap:14px;align-items:start}
@media (max-width:1250px){.ccols{grid-template-columns:280px 1fr}.ccols .dicecol{grid-column:1/-1}}
@media (max-width:800px){.ccols{grid-template-columns:1fr}}
.ilist{display:flex;flex-direction:column;gap:4px}
.irow{display:grid;grid-template-columns:44px 1fr auto;gap:6px;align-items:center;background:#fffaf0;border:1px solid var(--line);border-radius:5px;padding:5px 7px;cursor:pointer;position:relative}
.irow:hover{background:#fff4da}
.irow.sel{outline:2px solid var(--burg);background:#fff1d0}
.irow.turn{box-shadow:inset 4px 0 0 var(--gold)}
.irow.turn::before{content:"▶";position:absolute;left:-15px;color:var(--gold-dk);font-size:12px}
.irow.down{opacity:.55}
.irow.down .nm{text-decoration:line-through}
.irow.player{background:#f1ead8}
.irow .ini{width:40px;text-align:center;padding:.15em .1em;font-weight:700}
.irow .nm{font-weight:700;font-size:15.5px;line-height:1.1}
.irow .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3)}
.irow .hpmini{font-size:13px;text-align:right;color:var(--ink-2);min-width:70px}
.hpbar{height:5px;border-radius:3px;background:#dccfae;margin-top:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.hpbar i.mid{background:var(--warn)}.hpbar i.low{background:var(--bad)}
.cicons{font-size:11.5px;color:var(--burg);font-style:italic}
.det-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.det-head .title{font-size:32px;line-height:1}
.det-head input.lbl{font-family:var(--f-title);font-size:26px;color:var(--burg);background:transparent;border:1px dashed transparent;width:auto;max-width:100%}
.det-head input.lbl:hover,.det-head input.lbl:focus{border-color:var(--line);background:#fffaf0}
.hpbox{display:grid;grid-template-columns:repeat(4,auto) 1fr;gap:10px;align-items:end;margin:8px 0}
.hpbox label{display:flex;flex-direction:column;font-size:12.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.hpbox input{font-size:20px;font-weight:700;width:4.2em}
.hpbig{font-size:30px;font-weight:700;color:var(--ink)}
.hpbig small{font-size:18px;color:var(--ink-3)}
.dmgctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dmgctl input{width:6em;font-size:18px}
.abgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.abbox{background:#fffaf0;border:1px solid var(--line);border-radius:5px;padding:5px 4px;text-align:center}
.abbox .an{font-family:var(--f-kicker);color:var(--burg);font-size:13px;letter-spacing:.08em;font-weight:700}
.abbox input{width:3em;text-align:center;font-weight:700}
.abbox .md{font-size:14px;color:var(--ink-2)}
.abbox .bt{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.abbox .bt .btn{padding:.18em .2em;font-size:12.5px;white-space:normal}
.abbox .bt .btn.prof{border-color:var(--burg);color:var(--burg)}
.atk{display:flex;flex-wrap:wrap;gap:6px}
.atk .btn{white-space:normal;text-align:left}
.atk .btn small{font-weight:400;color:var(--ink-3)}
.cond-chips .chip{font-size:13px;padding:.15em .55em}
.dicecol .card{position:sticky;top:10px}
.dicebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dicebtns .btn{padding:.4em .2em}
.loglist{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:5px;margin-top:8px;padding-right:4px}
.logentry{background:#fffaf0;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px;padding:5px 8px;font-size:14.5px;line-height:1.3}
.logentry .who{font-weight:700;color:var(--burg)}
.logentry .tm{float:right;font-size:11.5px;color:var(--ink-3)}
.logentry .res{font-size:19px;font-weight:700}
.logentry.hit{border-left-color:var(--ok)}.logentry.miss{border-left-color:var(--bad)}.logentry.crit{border-left-color:#c4911a;background:#fff3cf}
.logentry .ok{color:var(--ok);font-weight:700}.logentry .no{color:var(--bad);font-weight:700}.logentry .cr{color:#a8641a;font-weight:700}
.logentry .dice{color:var(--ink-3);font-size:13px}
.logentry .dropped{text-decoration:line-through;text-decoration-thickness:1px;color:#a8977c}
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px 0}
.muted{color:var(--ink-3);font-size:14px;font-style:italic}
.bigroll{text-align:center;font-family:var(--f-title);font-size:54px;color:var(--burg);line-height:1;margin:6px 0}
.saved-grid .card + .card{margin-top:0}
@media (max-width:600px){
  .grid2{grid-template-columns:1fr;width:100%;max-width:340px}
  .corner{width:70px;height:70px}
  .topbar{padding:10px 16px 4px}
  .wrap{padding:6px 16px 30px}
  .stats,.thr,.diffs{grid-template-columns:repeat(2,1fr)}
  .abgrid{grid-template-columns:repeat(3,1fr)}
  .mrow .head,.cols-head{grid-template-columns:1fr 50px 50px;}
  .mrow .head .c:nth-child(3),.mrow .head .c:nth-child(5),.cols-head span:nth-child(3),.cols-head span:nth-child(5),.cols-head span:nth-child(6){display:none}
  .mrow .addbox{grid-column:1/-1}
}
.players input.pname{width:100%;margin-bottom:3px;padding:.15em .35em;font-size:14px}
.cform{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cform label{display:flex;flex-direction:column;font-size:13px;color:var(--ink-3);gap:2px}
.cform label input,.cform label select{width:100%}
.catk{display:flex;flex-direction:column;gap:5px}
.catk input[type=number]{width:4em}
.chip input.hidden{display:none}
.logentry .need{color:var(--ink-2);font-size:13.5px;font-style:italic}
small.needs{font-weight:600;opacity:.85;font-size:11.5px;color:inherit;flex-basis:100%;text-align:center;line-height:1.1}
.btn:has(small.needs){flex-wrap:wrap;row-gap:0}
.atk .btn small.needs{text-align:left;color:inherit}
.chip.cat.fac{background:#f3e6c4;border-color:var(--burg)}

</style>
</head>

egen Effekte, die Gefühle erspüren oder Gedanken lesen, und gegen Erkenntniszauber, die sie ablehnt. Weisheitswürfe (Motiv erkennen) gegen sie haben Nachteil."},{"n":"Magic Weapons","nd":"Magische Waffen","d":"Its weapon attacks are magical.","dd":"Ihre Waffenangriffe gelten als magisch."},{"n":"Spellcasting","nd":"Zauberwirken","d":"12th-level caster, Wis, save DC 18, +10 to hit; requires no material components; cleric spells. Cantrips: sacred flame, spare the dying, thaumaturgy. 1st (4): command, detect evil and good, detect magic. 2nd (3): lesser restoration, zone of truth. 3rd (3): dispel magic, tongues. 4th (3): banishment, freedom of movement. 5th (2): flame strike, greater restoration. 6th (1): heroes' feast.","dd":"Zauberwirkerin der 12. Stufe, Weisheit, SG 18, +10 auf Treffer; keine Materialkomponenten; Klerikerzauber. Zaubertricks: Heilige Flamme, Verschonung der Sterbenden, Thaumaturgie. 1. (4): Befehl, Gutes und Böses entdecken, Magie entdecken. 2. (3): Schwache Genesung, Zone der Wahrheit. 3. (3): Magie bannen, Zungen. 4. (3): Verbannung, Bewegungsfreiheit. 5. (2): Flammenschlag, Vollständige Genesung. 6. (1): Heldenmahl."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"Two claw attacks.","dd":"Zwei Klauenangriffe."},{"n":"Claw","nd":"Klaue","hit":12,"rng":"reach 5 ft.","dmg":[["2d10+6","slashing"]]},{"n":"Roar","nd":"Brüllen","use":"3/day","dc":18,"dmg":[["8d10","thunder"]],"d":"Roars, effects within 500 ft. (end at end of its next turn). First: each creature that hears it DC 18 Wis save or frightened 1 minute (repeat save each turn). Second: DC 18 Wis save or deafened and frightened 1 minute; frightened this way it is paralyzed and repeats the save each turn. Third: DC 18 Con save, 44 (8d10) thunder and knocked prone on a failure, half and not prone on a success.","dd":"Brüllt; wirkt im Umkreis von 150 m. Erstes: SG-18-Weisheitsrettungswurf, sonst 1 Minute verängstigt. Zweites: SG-18-Weisheitsrettungswurf, sonst 1 Minute taub und verängstigt u  m Radius, 9 m hoch) in 36 m (Konzentration). Kreaturen darin: bei Misserfolg festgesetzt; kann 18 m bewegt werden. Entkommen per Aktion und SG-18-Stärkewurf."}],"spell":{"dc":17,"hit":9}},{"id":"doppelganger","en":"Doppelganger","de":"Doppelgänger","size":"M","type":"monstrosity","sub":"shapechanger","al":"neutral","ac":14,"hp":52,"hd":"8d8+16","spd":{"walk":30},"ab":[11,18,14,11,12,14],"sk":{"Deception":6,"Insight":3},"ci":"charmed","sen":"darkvision 60 ft., passive Perception 11","lang":"Common","cr":"3","env":["urban","underdark","dungeon"],"tr":[{"n":"Shapechanger","nd":"Gestaltwandler","d":"Can use its action to polymorph into a Small or Medium humanoid it has seen, or back. Statistics are the same; equipment isn't transformed. Reverts on death.","dd":"Kann sich mit einer Aktion in einen kleinen oder mittelgroßen Humanoiden verwandeln, den es gesehen hat, oder zurück. Werte bleiben gleich; Ausrüstung wird nicht verwandelt. Stirbt es, nimmt es seine wahre Gestalt an."},{"n":"Ambusher","nd":"Hinterhalt","d":"Advantage on attack rolls against any creature it has surprised.","dd":"Vorteil auf Angriffswürfe gegen überraschte Kreaturen."},{"n":"Surprise Attack","nd":"Überraschungsangriff","d":"If it surprises a creature and hits it with an attack during the first round of combat, the target takes an extra 10 (3d6) damage.","dd":"Überrascht es eine Kreatur und trifft sie in der ersten Kampfrunde, erleidet sie zusätzlich 10 (3d6) Schaden."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"Two melee attacks.","dd":"Zwei Nahkampfangriffe."},{"n":"Slam","nd":"Hieb","hit":6,"rng":"reach 5 ft.","dmg":[["1d6+4","bludgeoning"]]},{"n":"Read Thoughts","nd":"Gedanken lesen","d":"Magically reads the surface thoughts of one creature within 60 ft. (blocked by 3 ft. of wood or dirt, 2 ft. of stone, 2 in. of metal, or thin lead). While the target is in range, it can continue reading as long as its concentration isn't broken; it has advantage on Insight and Deception/Intimidation/Persuasion checks against the target.","dd":"Liest magisch die oberflächlichen Gedanken einer Kreatur im Umkreis von 18 m (durch Barrieren blockiert). Solange es sich konzentriert, Vorteil auf Motiv erkennen, Täuschen, Einschüchtern und Überzeugen gegen das Ziel."}]},{"id":"draft-horse","en":"Draft Horse","de":"Zugpferd","size":"L","type":"beast","al":"unaligned","ac":10,"hp":19,"hd":"3d10+3","spd":{"walk":40},"ab":[18,10,12,2,11,7],"sen":"passive Perception 10","lang":"—","cr":"1/4","env":["urban","grassland"],"act":[{"n":"Hooves","nd":"Hufe","hit":6,"rng":"reach 5 ft.","dmg":[["2d4+4","bludgeoning"]]}]},{"id":"dragon-turtle","en":"Dragon Turtle","de":"Drachenschildkröte","size":"G","type":"dragon","al":"neutral","ac":20,"acn":"natural armor","hp":341,"hd":"22d20+110","spd":{"walk":20,"swim":40},"ab":[25,10,20,10,12,12],"sv":{"dex":6,"con":11,"wis":7},"dr":"fire","sen":"darkvision 120 ft., passive Perception 11","lang":"Aquan, Draconic","cr":"17","env":["coast"],"tr":[{"n":"Amphibious","nd":"Amphibisch","d":"The dragon turtle can breathe air and water.","dd":"Die Drachenschildkröte kann Luft und Wasser atmen."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The dragon turtle makes three attacks: one with its bite and two with its claws. It can make one tail attack in place of its two claw attacks.","dd":"Die Drachenschildkröte führt drei Angriffe aus: einen Biss- und zwei Klauenangriffe. Sie kann statt der zwei Klauenangriffe einen Schwanzangriff ausführen."},{"n":"Bite","nd":"Biss","hit":13,"rng":"reach 15 ft.","dmg":[["3d12+7","piercing"]]},{"n":"Claw","nd":"Klaue","hit":13,"rng":"reach 10 ft.","dmg":[["2d8+7","slashing"]]},{"n":"Tail","nd":"Schwanz","hit":13,"rng":"reach 15 ft.","dmg":[["3d12+7","bludgeoning"]],"d":"Target must succeed on a DC 20 Str save or be pushed up to 10 ft. away and knocked prone.","dd":"Das Ziel muss einen SG-20-Stärkerettungswurf bestehen oder wird bis zu 10 ft. weggestoßen und umgestoßen."},{"n":"Steam Breath","nd":"Dampfode },"ab":[16,16,18,13,14,12],"sk":{"Perception":5,"Stealth":9},"sen":"darkvision 120 ft., passive Perception 15","lang":"Elvish, Undercommon","cr":"6","env":["underdark"],"tr":[{"n":"Fey Ancestry","nd":"Feenblut","d":"Advantage on saves against being charmed; magic can't put it to sleep.","dd":"Vorteil auf Rettungswürfe gegen Bezauberung; kann nicht magisch eingeschläfert werden."},{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"Wis, save DC 13, no material components. At will: dancing lights. 1/day each: darkness, faerie fire.","dd":"Weisheit, Zauberrettungswurf-SG 13, keine Materialkomponenten. Beliebig oft: Tanzende Lichter. Je 1/Tag: Dunkelheit, Feenfeuer."},{"n":"Spider Climb","nd":"Spinnenklettern","d":"Can climb difficult surfaces, including upside down on ceilings, without an ability check.","dd":"Klettert ohne Attributswurf an schwierigen Oberflächen und kopfüber an Decken."},{"n":"Sunlight Sensitivity","nd":"Empfindlichkeit gegenüber Sonnenlicht","d":"In sunlight, disadvantage on attack rolls and on Wisdom (Perception) checks that rely on sight.","dd":"Im Sonnenlicht Nachteil auf Angriffswürfe und auf Wahrnehmungswürfe, die auf Sicht beruhen."},{"n":"Web Walker","nd":"Netzläufer","d":"Ignores movement restrictions caused by webbing.","dd":"Ignoriert Bewegungseinschränkungen durch Netze."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"Three attacks, either with its longsword or its longbow. It can replace one of those attacks with a bite attack.","dd":"Drei Angriffe mit Langschwert oder Langbogen; einer davon kann durch einen Biss ersetzt werden."},{"n":"Bite","nd":"Biss","hit":6,"rng":"reach 5 ft.","dmg":[["1d4","piercing"],["2d8","poison"]]},{"n":"Longsword","nd":"Langschwert","hit":6,"rng":"reach 5 ft.","dmg":[["1d8+3","slashing"]],"d":"Two-handed: 1d10+3 slashing.","dd":"Zweihändig: 1d10+3 Hiebschaden."},{"n":"Longbow","nd":"Langbogen","hit":6,"rng":"range 150/600 ft.","dmg":[["1d8+3","piercing"],["1d8","poison"]]}],"spell":{"dc": ith barkskin","hp":27,"hd":"5d8+5","spd":{"walk":30},"ab":[10,12,13,12,15,11],"sk":{"Medicine":4,"Nature":3,"Perception":4},"sen":"passive Perception 14","lang":"Druidic plus any two languages","cr":"2","env":["forest","grassland","swamp","mountain","arctic","desert","coast"],"tr":[{"n":"Spellcasting","nd":"Zauberwirken","d":"4th-level spellcaster, Wisdom (spell save DC 12, +4 to hit). Cantrips: druidcraft, produce flame, shillelagh. 1st (4 slots): entangle, longstrider, speak with animals, thunderwave. 2nd (3 slots): animal messenger, barkskin.","dd":"Zauberwirker der 4. Stufe, Weisheit (Zauber-SG 12, +4 auf Treffer). Zaubertricks: Druidenkunst, Flammen erzeugen, Shillelagh. 1. Grad (4 Plätze): Verstricken, Großer Schritt, Mit Tieren sprechen, Donnerwoge. 2. Grad (3 Plätze): Tierbote, Rindenhaut."}],"act":[{"n":"Quarterstaff","nd":"Kampfstab","hit":2,"rng":"reach 5 ft.","dmg":[["1d6","bludgeoning"]],"d":"Or 1d8 if used with two hands. With shillelagh: +4 to hit, 1d8+2 bludgeoning.","dd":"Oder 1W8 zweihändig. Mit Shillelagh: +4 auf Treffer, 1W8+2 Wucht."}],"spell":{"dc":12,"hit":4}},{"id":"dryad","en":"Dryad","de":"Dryade","size":"M","type":"fey","al":"neutral","ac":11,"acn":"16 with barkskin","hp":22,"hd":"5d8","spd":{"walk":30},"ab":[10,12,11,14,15,18],"sk":{"Perception":4,"Stealth":5},"sen":"darkvision 60 ft., passive Perception 14","lang":"Elvish, Sylvan","cr":"1","env":["forest"],"tr":[{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"Cha, save DC 14. At will: druidcraft. 3/day each: entangle, goodberry. 1/day each: barkskin, pass without trace, shillelagh.","dd":"Charisma, SG 14. Beliebig oft: Druidenkunst. Je 3/Tag: Verstricken, Gute Beeren. Je 1/Tag: Rindenhaut, Spurloses Gehen, Shillelagh."},{"n":"Magic Resistance","nd":"Magieresistenz","d":"Advantage on saves against spells and magical effects.","dd":"Vorteil auf Rettungswürfe gegen Zauber und magische Effekte."},{"n":"Speak with Beasts and Plants","nd":"Mit Tieren und Pflanzen sprechen","d":"Can communicate with beasts and plants as if they shared a language.","dd":"Kann sich mit Tieren und Pflanzen verständigen."},{"n":"Tree Stride","nd":"Baumschreiten","d":"Once on her turn, can use 10 ft. of movement to step into a living tree and emerge from another within 60 ft.","dd":"Einmal pro Zug kann sie mit 3 m Bewegung in einen lebenden Baum treten und aus einem anderen in 18 m heraustreten."}],"act":[{"n":"Club","nd":"Knüppel","hit":2,"rng":"reach 5 ft.","dmg":[["1d4","bludgeoning"]],"d":"With shillelagh: +6 to hit, 1d8+4 bludgeoning.","dd":"Mit Shillelagh: +6, 1W8+4 Wucht."},{"n":"Fey Charm","nd":"Feenbezauberung","dc":14,"save":"wis","d":"One humanoid or beast within 30 ft. she can see: charmed for 1 day (regards dryad as trusted friend); save repeated each time dryad or allies harm it. Up to one humanoid and three beasts at once.","dd":"Ein Humanoider oder Tier in 9 m: 1 Tag bezaubert; neuer Rettungswurf, wenn die Dryade oder Verbündete ihm schaden. Höchstens ein Humanoider und drei Tiere gleichzeitig."}],"spell":{"dc":14,"hit":null}},{"id":"duergar","en":"Duergar","de":"Duergar","size":"M","type":"humanoid","sub":"dwarf","al":"lawful evil","ac":16,"acn":"scale mail, shield","hp":26,"hd":"4d8+8","spd":{"walk":25},"ab":[14,11,14,11,10,9],"dr":"poison","sen":"darkvision 120 ft., passive Perception 10","lang":"Dwarvish, Undercommon","cr":"1","env":["underdark","dungeon"],"tr":[{"n":"Duergar Resilience","nd":"Duergar-Widerstandskraft","d":"Advantage on saving throws against poison, spells, and illusions, as well as to resist being charmed or paralyzed.","dd":"Vorteil bei Rettungswürfen gegen Gift, Zauber und Illusionen sowie gegen bezaubert und gelähmt."},{"n":"Sunlight Sensitivity","nd":"Sonnenlichtempfindlichkeit","d":"While in sunlight, disadvantage on attack rolls and on Wisdom (Perception) checks that rely on sight.","dd":"Im Sonnenlicht Nachteil bei Angriffswürfen und bei Weisheitswürfen (Wahrnehmung), die auf Sicht beruhen."}],"act":[{"n":"Enlarge","  120 ft., passive Perception 13","lang":"—","cr":"3","env":["coast","arctic"],"tr":[{"n":"Echolocation","nd":"Echoortung","d":"Can't use its blindsight while deafened.","dd":"Kann seine Blindsicht nicht nutzen, solange er taub ist."},{"n":"Hold Breath","nd":"Atem anhalten","d":"Can hold its breath for 30 minutes.","dd":"Kann 30 Minuten lang den Atem anhalten."},{"n":"Keen Hearing","nd":"Scharfes Gehör","d":"Advantage on Wisdom (Perception) checks that rely on hearing.","dd":"Vorteil bei Weisheitswürfen (Wahrnehmung), die auf Gehör beruhen."}],"act":[{"n":"Bite","nd":"Biss","hit":6,"rng":"reach 5 ft.","dmg":[["5d6+4","piercing"]]}]},{"id":"knight","en":"Knight","de":"Ritter","size":"M","type":"humanoid","sub":"any race","al":"any alignment","ac":18,"acn":"plate","hp":52,"hd":"8d8+16","spd":{"walk":30},"ab":[16,11,14,11,11,15],"sv":{"con":4,"wis":2},"sen":"passive Perception 10","lang":"any one language (usually Common)","cr":"3","env":["urban","grassland"],"tr":[{"n":"Brave","nd":"Tapfer","d":"Advantage on saving throws against being frightened.","dd":"Vorteil bei Rettungswürfen gegen verängstigt."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The knight makes two melee attacks.","dd":"Der Ritter führt zwei Nahkampfangriffe aus."},{"n":"Greatsword","nd":"Zweihandschwert","hit":5,"rng":"reach 5 ft.","dmg":[["2d6+3","slashing"]]},{"n":"Heavy Crossbow","nd":"Schwere Armbrust","hit":2,"rng":"range 100/400 ft.","dmg":[["1d10","piercing"]]},{"n":"Leadership","nd":"Anführerschaft","use":"1/short rest","d":"Recharges after a short or long rest. For 1 minute, the knight can utter a special command or warning whenever a nonhostile creature it can see within 30 feet makes an attack roll or saving throw; the creature can add a d4 to its roll if it can hear and understand the knight. A creature benefits from only one Leadership die at a time. Ends if the knight is incapacitated.","dd":"Erneuert sich nach kurzer oder langer Rast. 1 Minute lang kann der Ritter, wenn eine nicht feindliche Kreatur, die er im Umkreis von 9 m (30 ft.) sieht, einen Angriffs- oder Rettungswurf macht, einen Befehl rufen; sie addiert 1W4, wenn sie ihn hören und verstehen kann. Nur ein Anführerschaftswürfel gleichzeitig. Endet, wenn der Ritter kampfunfähig ist."}],"rea":[{"n":"Parry","nd":"Parieren","d":"The knight adds 2 to its AC against one melee attack that would hit it. To do so, it must see the attacker and be wielding a melee weapon.","dd":"Der Ritter erhöht seine RK gegen einen Nahkampfangriff, der ihn treffen würde, um 2. Er muss den Angreifer sehen und eine Nahkampfwaffe führen."}]},{"id":"kobold","en":"Kobold","de":"Kobold","size":"S","type":"humanoid","sub":"kobold","al":"lawful evil","ac":12,"hp":5,"hd":"2d6-2","spd":{"walk":30},"ab":[7,15,9,8,7,8],"sen":"darkvision 60 ft., passive Perception 8","lang":"Common, Draconic","cr":"1/8","env":["forest","mountain","underdark","dungeon","grassland"],"tr":[{"n":"Sunlight Sensitivity","nd":"Sonnenlichtempfindlichkeit","d":"While in sunlight, disadvantage on attack rolls and on Wisdom (Perception) checks that rely on sight.","dd":"Im Sonnenlicht Nachteil bei Angriffswürfen und bei Weisheitswürfen (Wahrnehmung), die auf Sicht beruhen."},{"n":"Pack Tactics","nd":"Rudeltaktik","d":"Advantage on attack rolls against a creature if at least one of the kobold's allies is within 5 feet of the creature and the ally isn't incapacitated.","dd":"Vorteil bei Angriffswürfen gegen eine Kreatur, wenn mindestens ein nicht kampfunfähiger Verbündeter innerhalb von 1,5 m (5 ft.) um sie ist."}],"act":[{"n":"Dagger","nd":"Dolch","hit":4,"rng":"reach 5 ft.","dmg":[["1d4+2","piercing"]]},{"n":"Sling","nd":"Schleuder","hit":4,"rng":"range 30/120 ft.","dmg":[["1d4+2","bludgeoning"]]}]},{"id":"kraken","en":"Kraken","de":"Krake","size":"G","type":"monstrosity","sub":"titan","al":"chaotic evil","ac":18,"acn":"natural armor","hp":472,"hd":"27d20+189","spd":{"walk":20,"swim":60},"ab":[30,11,25,22,18,20],"sv":{"str":17,"dex":7,"con":14, t.","dmg":[["3d6+10","bludgeoning"]],"d":"Target is grappled (escape DC 18) and restrained while grappled. The kraken has ten tentacles, each can grapple one target.","dd":"Ziel wird gepackt (Rettung SG 18) und ist dabei festgesetzt. Zehn Tentakel, jedes kann ein Ziel packen."},{"n":"Fling","nd":"Schleudern","dc":18,"save":"dex","dmg":[],"d":"One Large or smaller object held or creature grappled is thrown up to 60 ft. in a random direction and knocked prone. If it strikes a solid surface it takes 1d6 bludgeoning per 10 ft. thrown; if thrown at another creature, that creature must succeed on a DC 18 Dex save or take the same damage and be knocked prone.","dd":"Ein gehaltener höchstens großer Gegenstand oder gepackte Kreatur wird bis zu 18 m in zufällige Richtung geschleudert und liegt. Prallt es auf eine feste Fläche, 1d6 Wucht je 3 m; wird eine andere Kreatur getroffen, SG-18-Geschicklichkeitsrettungswurf, sonst gleicher Schaden und liegend."},{"n":"Lightning Storm","nd":"Blitzsturm","dc":23,"save":"dex","dmg":[["4d10","lightning"]],"half":true,"d":"Three bolts of lightning, each striking a target the kraken can see within 120 ft.","dd":"Drei Blitze, jeder trifft ein sichtbares Ziel im Umkreis von 36 m."}],"leg":[{"n":"Legendary Actions","nd":"Legendäre Aktionen","d":"The kraken can take 3 legendary actions, one at a time at the end of another creature's turn; regains spent actions at the start of its turn.","dd":"Der Krake kann 3 legendäre Aktionen ausführen, jeweils am Ende des Zuges einer anderen Kreatur; erhält sie zu Beginn seines Zuges zurück."},{"n":"Tentacle Attack or Fling","nd":"Tentakelangriff oder Schleudern","d":"Makes one tentacle attack or uses its Fling.","dd":"Ein Tentakelangriff oder Schleudern."},{"n":"Lightning Storm (Costs 2 Actions)","nd":"Blitzsturm (kostet 2 Aktionen)","d":"Uses Lightning Storm.","dd":"Setzt Blitzsturm ein."},{"n":"Ink Cloud (Costs 3 Actions)","nd":"Tintenwolke (kostet 3 Aktionen)","dc":23,"save":"con","dmg":[["3d10","poison"]],"half":true,"d":"While underwater, expels ink in a 60-ft. radius; area is heavily obscured for 1 minute (a strong current disperses it). Each creature other than the kraken that ends its turn there makes the save.","dd":"Unter Wasser stößt er Tinte im Radius von 18 m aus; 1 Minute komplett verschleiert. Jede andere Kreatur, die ihren Zug dort beendet, legt den Rettungswurf ab."}]},{"id":"lamia","en":"Lamia","de":"Lamia","size":"L","type":"monstrosity","al":"chaotic evil","ac":13,"acn":"natural armor","hp":97,"hd":"13d10+26","spd":{"walk":30},"ab":[16,13,15,14,15,16],"sk":{"Deception":7,"Insight":4,"Stealth":3},"sen":"darkvision 60 ft., passive Perception 12","lang":"Abyssal, Common","cr":"4","env":["desert"],"tr":[{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"Cha, save DC 13, no material components. At will: disguise self (any humanoid form), major image. 3/day each: charm person, mirror image, scrying, suggestion. 1/day: geas.","dd":"Charisma, Zauberrettungswurf-SG 13, keine Materialkomponenten. Beliebig oft: Selbstverkleidung (jede humanoide Gestalt), Größeres Abbild. Je 3/Tag: Person bezaubern, Spiegelbilder, Ausspähung, Einflüsterung. 1/Tag: Auftrag."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"Two attacks: one with its claws and one with its dagger or Intoxicating Touch.","dd":"Zwei Angriffe: Klauen und Dolch oder Berauschende Berührung."},{"n":"Claws","nd":"Klauen","hit":5,"rng":"reach 5 ft.","dmg":[["2d10+3","slashing"]]},{"n":"Dagger","nd":"Dolch","hit":5,"rng":"reach 5 ft.","dmg":[["1d4+3","piercing"]]},{"n":"Intoxicating Touch","nd":"Berauschende Berührung","hit":5,"rng":"reach 5 ft.","dmg":[],"d":"Melee spell attack. The target is magically cursed for 1 hour: disadvantage on Wisdom saves and all ability checks.","dd":"Nahkampf-Zauberangriff. Das Ziel ist 1 Stunde magisch verflucht: Nachteil auf Weisheitsrettungswürfe und alle Attributswürfe."}],"spell":{"dc":13,"hit":null}},{"id":"lemure","en":"Lemure","de":"Lemure","size":"M","type":"fiend","sub":"devil","al":"lawful evil","ac":7,"hp":13,"hd":"3d8","spd":{"walk":15},"ab":[10,5,11,1,11,3],"dr":"cold","di":"fire, poison","ci":"charmed, frightened, poisoned","sen":"darkvision 120 ft., passive Perception 10","lang":"understands Infernal but can't speak","cr":"0","env":["dungeon","underdark"],"tr":[{"n":"Devil's Sight","nd":"Teufelssicht","d":"Magical darkness doesn't impede its darkvision.","dd":"Magische Dunkelheit behindert seine Dunkelsicht nicht."},{"n":"Hellish Rejuvenation","nd":"Höllische Verjüngung","d":"A lemure that dies in the Nine Hells returns to life with all its HP in 1d10 days unless killed by a good-aligned creature with bless cast on it or its remains are sprinkled with holy water.","dd":"Ein Lemure, der in den Neun Höllen stirbt, kehrt nach 1W10 Tagen mit allen TP zurück, außer er wurde von einer guten Kreatur unter Segen getötet oder seine Überreste wurden mit Weihwasser besprengt."}],"act":[{"n":"Fist","nd":"Faust","hit":3,"rng":"reach 5 ft.","dmg":[["1d4","bludgeoning"]]}]},{"id":"lich","en":"Lich","de":"Leichnam","size":"M","type":"undead","al":"any evil alignment","ac":17,"acn":"natural armor","hp":135,"hd":"18d8+54","spd":{"walk":30},"ab":[11,16,16,20,14,16],"sv":{"con":10,"int":12,"wis":9},"sk":{"Arcana":18,"History":12,"Insight":9,"Perception":9},"dr":"cold, lightning, necrotic","di":"poison; bludgeoning, piercing, and slashing from nonmagical attacks","ci":"charmed, exhaustion, frightened, paralyzed, poisoned","sen":"truesight 120 ft., passive Perception 19","lang":"Common plus up to five other languages","cr":"21","env":["dungeon"],"tr":[{"n":"Legendary Resistance (3/Day)","nd":"Legendäre Resistenz (3/Tag)","d":"If the lich fails a saving throw, it can choose to succeed instead.","dd":"Scheitert der Leichnam bei einem Rettungswurf, kann er ihn stattdessen bestehen."},{"n":"Rejuvenation","nd":"Verjüngung","d":"If it has a phylactery, a destroyed lich gains a new body in 1d10 days, regaining all HP, appearing s turn; regains spent actions at the start of its turn.","dd":"Der Leichnam kann 3 legendäre Aktionen ausführen, jeweils eine am Ende des Zuges einer anderen Kreatur; verbrauchte Aktionen erhält er zu Beginn seines Zuges zurück."},{"n":"Cantrip","nd":"Zaubertrick","d":"The lich casts a cantrip.","dd":"Der Leichnam wirkt einen Zaubertrick."},{"n":"Paralyzing Touch (Costs 2 Actions)","nd":"Lähmende Berührung (kostet 2 Aktionen)","d":"The lich uses its Paralyzing Touch.","dd":"Der Leichnam setzt seine Lähmende Berührung ein."},{"n":"Frightening Gaze (Costs 2 Actions)","nd":"Furchterregender Blick (kostet 2 Aktionen)","dc":18,"save":"wis","d":"One creature within 10 ft. that can see the lich must save or be frightened for 1 minute (repeat save). Success: immune for 24 hours.","dd":"Eine Kreatur im Umkreis von 3 m, die den Leichnam sehen kann, muss einen Rettungswurf bestehen oder ist 1 Minute lang verängstigt (Wiederholung). Bei Erfolg 24 Stunden immun."},{"n":"Disrupt Life (Costs 3 Actions)","nd":"Leben zerrütten (kostet 3 Aktionen)","dc":18,"save":"con","dmg":[["6d6","necrotic"]],"half":true,"d":"Each non-undead creature within 20 ft. of the lich must save.","dd":"Jede nicht untote Kreatur im Umkreis von 6 m muss einen Rettungswurf ablegen."}],"spell":{"dc":20,"hit":12}},{"id":"lion","en":"Lion","de":"Löwe","size":"L","type":"beast","al":"unaligned","ac":12,"hp":26,"hd":"4d10+4","spd":{"walk":50},"ab":[17,15,13,3,12,8],"sk":{"Perception":3,"Stealth":6},"sen":"passive Perception 13","lang":"—","cr":"1","env":["grassland","desert"],"tr":[{"n":"Keen Smell","nd":"Scharfer Geruchssinn","d":"Advantage on Wisdom (Perception) checks that rely on smell.","dd":"Vorteil bei Weisheitswürfen (Wahrnehmung), die auf Geruch beruhen."},{"n":"Pack Tactics","nd":"Rudeltaktik","d":"Advantage on attack rolls against a creature if at least one of its allies is within 5 ft. of the creature and isn't incapacitated.","dd":"Vorteil bei Angriffswürfen gegen eine Kreatur, wenn mindestens ein nicht kampfunfähiger Verbündeter innerhalb von 1,5 m davon ist."},{"n":"Pounce","nd":"Anspringen","d":"If it moves at least 20 ft. straight toward a creature and hits it with a claw attack on the same turn, the target must succeed on a DC 13 Strength saving throw or be knocked prone. If prone, the lion can make one bite attack against it as a bonus action.","dd":"Bewegt er sich mindestens 6 m geradlinig auf eine Kreatur zu und trifft sie im selben Zug mit einem Klauenangriff, muss das Ziel einen SG-13-Stärkerettungswurf bestehen oder wird umgestoßen. Liegt es, kann der Löwe als Bonusaktion einen Bissangriff gegen es ausführen."},{"n":"Running Leap","nd":"Weitsprung mit Anlauf","d":"With a 10-foot running start, the lion can long jump up to 25 ft.","dd":"Mit 3 m Anlauf kann der Löwe bis zu 7,5 m weit springen."}],"act":[{"n":"Bite","nd":"Biss","hit":5,"rng":"reach 5 ft.","dmg":[["1d8+3","piercing"]]},{"n":"Claw","nd":"Klaue","hit":5,"rng":"reach 5 ft.","dmg":[["1d6+3","slashing"]]}]},{"id":"lizard","en":"Lizard","de":"Eidechse","size":"T","type":"beast","al":"unaligned","ac":10,"hp":2,"hd":"1d4","spd":{"walk":20,"climb":20},"ab":[2,11,10,1,8,3],"sen":"darkvision 30 ft., passive Perception 9","lang":"—","cr":"0","env":["desert","forest","swamp","grassland"],"act":[{"n":"Bite","nd":"Biss","hit":0,"rng":"reach 5 ft.","dmg":[["1","piercing"]]}]},{"id":"lizardfolk","en":"Lizardfolk","de":"Echsenmensch","size":"M","type":"humanoid","sub":"lizardfolk","al":"neutral","ac":15,"acn":"natural armor, shield","hp":22,"hd":"4d8+4","spd":{"walk":30,"swim":30},"ab":[15,10,13,7,12,7],"sk":{"Perception":3,"Stealth":4,"Survival":5},"sen":"passive Perception 13","lang":"Draconic","cr":"1/2","env":["swamp","forest","coast"],"tr":[{"n":"Hold Breath","nd":"Atem anhalten","d":"The lizardfolk can hold its breath for 15 minutes.","dd":"Der Echsenmensch kann 15 Minuten lang den Atem anhalten."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The lizardfolk makes two melee attacks, each one  passive Perception 10","lang":"Ignan, Terran","cr":"1/2","env":["mountain","underdark","dungeon"],"tr":[{"n":"Death Burst","nd":"Todesexplosion","d":"When it dies, explodes in lava: each creature within 5 ft. DC 11 Dex save, 2d6 fire on failure or half on success.","dd":"Stirbt er, explodiert er in Lava: Kreaturen in 1,5 m SG-11-Geschicklichkeitsrettungswurf, 2W6 Feuerschaden, halb bei Erfolg."},{"n":"False Appearance","nd":"Falsches Erscheinungsbild","d":"While motionless, indistinguishable from an ordinary mound of magma.","dd":"Reglos nicht von einem gewöhnlichen Magmahaufen zu unterscheiden."},{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"1/day: heat metal (spell save DC 10; Cha).","dd":"1/Tag: Metall erhitzen (SG 10; Charisma)."}],"act":[{"n":"Claws","nd":"Klauen","hit":3,"rng":"reach 5 ft.","dmg":[["1d4+1","slashing"],["2d4","fire"]]},{"n":"Fire Breath","nd":"Feuerodem","dc":11,"save":"dex","dmg":[["2d6","fire"]],"half":true,"rec":"6","d":"15-ft. cone.","dd":"Kegel von 4,5 m."}],"spell":{"dc":10,"hit":null}},{"id":"magmin","en":"Magmin","de":"Magmin","size":"S","type":"elemental","al":"chaotic neutral","ac":14,"acn":"natural armor","hp":9,"hd":"2d6+2","spd":{"walk":30},"ab":[7,15,12,8,11,10],"dr":"bludgeoning, piercing, and slashing from nonmagical attacks","di":"fire","sen":"darkvision 60 ft., passive Perception 10","lang":"Ignan","cr":"1/2","env":["mountain","underdark","dungeon"],"tr":[{"n":"Death Burst","nd":"Todesexplosion","d":"When it dies, explodes: each creature within 10 ft. makes a DC 11 Dex save, 2d6 fire on failure or half on success. Unattended flammable objects ignite.","dd":"Stirbt er, explodiert er: Kreaturen in 3 m SG-11-Geschicklichkeitsrettungswurf, 2W6 Feuerschaden, halb bei Erfolg. Brennbare Gegenstände entzünden sich."},{"n":"Ignited Illumination","nd":"Entfachtes Leuchten","d":"Bonus action: ignite or extinguish flames; while ignited, bright light 10 ft. and dim light additional 10 ft.","dd":"Bonusaktion: Flammen entf e Perception 14","lang":"Common","cr":"6","env":["desert","mountain","dungeon","swamp"],"tr":[{"n":"Petrifying Gaze","nd":"Versteinernder Blick","d":"When a creature that can see the medusa's eyes starts its turn within 30 ft., the medusa can force a DC 14 Con save if it can see the creature and isn't incapacitated. Fail by 5 or more: instantly petrified. Otherwise a failure means it begins to turn to stone and is restrained; repeat at the end of its next turn, petrified on failure until freed by greater restoration. Unsurprised creatures can avert their eyes. If the medusa sees its reflection in bright light within 30 ft., it is affected by its own gaze.","dd":"Beginnt eine Kreatur, die die Augen der Medusa sehen kann, ihren Zug innerhalb 9 m, SG-14-Konstitutionsrettungswurf. Misserfolg um 5+: sofort versteinert. Sonst beginnt sie zu versteinern und ist festgesetzt; Wiederholung am Ende ihres nächsten Zuges, bei Misserfolg versteinert bis Vollständige Genesung. Blick abwenden möglich. Sieht die Medusa ihr Spiegelbild, wirkt der Blick auf sie selbst."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"Three melee attacks (one with its snake hair and two with its shortsword) or two ranged attacks with its longbow.","dd":"Drei Nahkampfangriffe (Schlangenhaar und zweimal Kurzschwert) oder zwei Fernkampfangriffe mit dem Langbogen."},{"n":"Snake Hair","nd":"Schlangenhaar","hit":5,"rng":"reach 5 ft.","dmg":[["1d4+2","piercing"],["4d6","poison"]]},{"n":"Shortsword","nd":"Kurzschwert","hit":5,"rng":"reach 5 ft.","dmg":[["1d6+2","piercing"]]},{"n":"Longbow","nd":"Langbogen","hit":5,"rng":"range 150/600 ft.","dmg":[["1d8+2","piercing"],["2d6","poison"]]}]},{"id":"merfolk","en":"Merfolk","de":"Meervolk","size":"M","type":"humanoid","sub":"merfolk","al":"neutral","ac":11,"hp":11,"hd":"2d8+2","spd":{"walk":10,"swim":40},"ab":[10,13,12,11,11,12],"sk":{"Perception":2},"sen":"passive Perception 12","lang":"Aquan, Common","cr":"1/8","env":["coast"],"tr":[{"n":"Amphibious","nd": sn't transformed. Reverts on death.","dd":"Kann sich mit einer Aktion in einen Gegenstand oder zurück in seine amorphe Gestalt verwandeln. Werte bleiben gleich. Stirbt er, nimmt er seine wahre Gestalt an."},{"n":"Adhesive (Object Form Only)","nd":"Klebrig (nur in Gegenstandsform)","d":"Adheres to anything that touches it. A Huge or smaller creature adhered to it is also grappled (escape DC 13); ability checks to escape have disadvantage.","dd":"Alles, was ihn berührt, bleibt kleben. Eine höchstens riesige Kreatur ist dabei gepackt (Rettung SG 13); Attributswürfe zum Entkommen haben Nachteil."},{"n":"False Appearance (Object Form Only)","nd":"Falsches Erscheinungsbild (nur in Gegenstandsform)","d":"While motionless, indistinguishable from an ordinary object.","dd":"Reglos nicht von einem gewöhnlichen Gegenstand zu unterscheiden."},{"n":"Grappler","nd":"Ringer","d":"Advantage on attack rolls against any creature grappled by it.","dd":"Vorteil auf Angriffswürfe gegen von ihm gepackte Kreaturen."}],"act":[{"n":"Pseudopod","nd":"Pseudopodium","hit":5,"rng":"reach 5 ft.","dmg":[["1d8+3","bludgeoning"]],"d":"If in object form, the target is subjected to its Adhesive trait.","dd":"In Gegenstandsform unterliegt das Ziel dem Merkmal Klebrig."},{"n":"Bite","nd":"Biss","hit":5,"rng":"reach 5 ft.","dmg":[["1d8+3","piercing"],["1d8","acid"]]}]},{"id":"minotaur","en":"Minotaur","de":"Minotaurus","size":"L","type":"monstrosity","al":"chaotic evil","ac":14,"acn":"natural armor","hp":76,"hd":"9d10+27","spd":{"walk":40},"ab":[18,11,16,6,16,9],"sk":{"Perception":7},"sen":"darkvision 60 ft., passive Perception 17","lang":"Abyssal","cr":"3","env":["underdark","dungeon"],"tr":[{"n":"Charge","nd":"Sturmangriff","d":"If it moves at least 10 ft. straight toward a target and then hits it with a gore attack on the same turn, the target takes an extra 9 (2d8) piercing damage and must succeed on a DC 14 Str save or be pushed up to 10 ft. away and knocked prone.","dd":"Bewegt er sich mindestens 3 m gerade auf ein Ziel zu und trifft im selben Zug mit dem Hornstoß, zusätzlich 9 (2d8) Stichschaden und SG-14-Stärkerettungswurf, sonst bis 3 m weggestoßen und liegend."},{"n":"Labyrinthine Recall","nd":"Labyrinthgedächtnis","d":"Can perfectly recall any path it has traveled.","dd":"Erinnert sich perfekt an jeden Weg, den er gegangen ist."},{"n":"Reckless","nd":"Rücksichtslos","d":"At the start of its turn, can gain advantage on all melee weapon attack rolls during that turn, but attack rolls against it have advantage until the start of its next turn.","dd":"Zu Beginn seines Zuges kann er Vorteil auf alle Nahkampfwaffenangriffe erhalten; dann haben Angriffe gegen ihn bis zu seinem nächsten Zug Vorteil."}],"act":[{"n":"Greataxe","nd":"Zweihandaxt","hit":6,"rng":"reach 5 ft.","dmg":[["2d12+4","slashing"]]},{"n":"Gore","nd":"Hornstoß","hit":6,"rng":"reach 5 ft.","dmg":[["2d8+4","piercing"]]}]},{"id":"minotaur-skeleton","en":"Minotaur Skeleton","de":"Minotaurenskelett","size":"L","type":"undead","al":"lawful evil","ac":12,"acn":"natural armor","hp":67,"hd":"9d10+18","spd":{"walk":40},"ab":[18,11,15,6,8,5],"dv":"bludgeoning","di":"poison","ci":"exhaustion, poisoned","sen":"darkvision 60 ft., passive Perception 9","lang":"understands Abyssal but can't speak","cr":"2","env":["dungeon","underdark"],"tr":[{"n":"Charge","nd":"Sturmangriff","d":"If it moves at least 10 ft. straight toward a target and then hits with a gore attack on the same turn, the target takes an extra 9 (2d8) piercing damage and must succeed on a DC 14 Strength save or be pushed up to 10 ft. away and knocked prone.","dd":"Bewegt es sich mindestens 3 m geradlinig auf ein Ziel zu und trifft im selben Zug mit einem Hornstoß, erleidet das Ziel zusätzlich 9 (2W8) Stichschaden und muss einen SG-14-Stärkerettungswurf bestehen oder wird bis zu 3 m weggestoßen und umgestoßen."}],"act":[{"n":"Greataxe","nd":"Zweihandaxt","hit":6,"rng":"reach 5 ft.","dmg":[["2d12+4","slashing"]]},{"n":"Gore","nd":"Hornstoß","hit":6,"rng":"reach 5 ft.","dmg":[["2d8+4","piercing"]]}]},{"id":"mule","en":"Mule","de":"Maultier","size":"M","type":"beast","al":"unaligned","ac":10,"hp":11,"hd":"2d8+2","spd":{"walk":40},"ab":[14,10,13,2,10,5],"sen":"passive Perception 10","lang":"—","cr":"1/8","env":["urban","grassland","mountain"],"tr":[{"n":"Beast of Burden","nd":"Lasttier","d":"Considered a Large animal for determining its carrying capacity.","dd":"Gilt zur Bestimmung der Traglast als großes Tier."},{"n":"Sure-Footed","nd":"Trittsicher","d":"Advantage on Strength and Dexterity saving throws made against effects that would knock it prone.","dd":"Vorteil bei Stärke- und Geschicklichkeitsrettungswürfen gegen Effekte, die es umstoßen würden."}],"act":[{"n":"Hooves","nd":"Hufe","hit":2,"rng":"reach 5 ft.","dmg":[["1d4+2","bludgeoning"]]}]},{"id":"mummy","en":"Mummy","de":"Mumie","size":"M","type":"undead","al":"lawful evil","ac":11,"acn":"natural armor","hp":58,"hd":"9d8+18","spd":{"walk":20},"ab":[16,8,15,6,10,12],"sv":{"wis":2},"dv":"fire","dr":"bludgeoning, piercing, and slashing from nonmagical attacks","di":"necrotic, poison","ci":"charmed, exhaustion, frightened, paralyzed, poisoned","sen":"darkvision 60 ft., passive Perception 10","lang":"the languages it knew in life","cr":"3","env":["desert","dungeon"],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The mummy can use its Dreadful Glare and makes one attack with its rotting fist.","dd":"Die Mumie kann ihren Schrecklichen Blick einsetzen und führt einen Angriff mit ihrer Faulenden Faust aus."},{"n":"Rotting Fist","nd":"Faulende Faust","hit":5,"rng":"reach 5 ft.","dmg":[["2d6+3","bludgeoning"],["3d6","necrotic"]],"d":"Target must succeed on a DC 12 Constitution save or be cursed with mummy rot: can't regain HP, HP max decreases by 3d6 every 24 hours; dies at 0.","dd":"Das Ziel muss einen SG-12-Konstitutionsrettungswurf bestehen oder wird mit Mumienfäule verflucht: kann keine TP zurückerhalten, TP-Maximum sinkt alle 24 Stunden um 3W6; stirbt bei 0."},{"n":"Dreadful Glare","nd":"Schrecklicher Blick","dc":11,"save":"wis","d":"One creature within 60 ft. that can see the mummy must save or be frightened until the end of the mummy's next turn; if it fails by 5 or more, it is also paralyzed for the same duration. Success: immune to all mummies' (not mummy lords') glare for 24 hours.","dd":"Eine Kreatur im Umkreis von 18 m, die die Mumie sehen kann, muss einen Rettungswurf bestehen oder ist bis zum Ende des nächsten Zuges der Mumie verängstigt; scheitert sie um 5 oder mehr, ist sie zudem gelähmt. Bei Erfolg 24 Stunden immun gegen den Blick aller Mumien (nicht Mumienfürsten)."}]},{"id":"mummy-lord","en":"Mummy Lord","de":"Mumienfürst","size":"M","type":"undead","al":"lawful evil","ac":17,"acn":"natural armor","hp":97,"hd":"13d8+39","spd":{"walk":20},"ab":[18,10,17,11,18,16],"sv":{"con":8,"int":5,"wis":9,"cha":8},"sk":{"History":5,"Religion":5},"dv":"fire","di":"necrotic, poison; bludgeoning, piercing, and slashing from nonmagical attacks","ci":"charmed, exhaustion, frightened, paralyzed, poisoned","sen":"darkvision 60 ft., passive Perception 14","lang":"the languages it knew in life","cr":"15","env":["desert","dungeon"],"tr":[{"n":"Magic Resistance","nd":"Magieresistenz","d":"Advantage on saving throws against spells and other magical effects.","dd":"Vorteil bei Rettungswürfen gegen Zauber und andere magische Effekte."},{"n":"Rejuvenation","nd":"Verjüngung","d":"A destroyed mummy lord gains a new body in 24 hours if its heart is intact, regaining all HP.","dd":"Ein zerstörter Mumienfürst erhält nach 24 Stunden einen neuen Körper mit allen TP, sofern sein Herz intakt ist."},{"n":"Spellcasting","nd":"Zauberwirken","d":"10th-level cleric, Wis, save DC 17, +9 to hit. Cantrips: sacred flame, thaumaturgy. 1st (4): command, guiding bolt, shield of faith. 2nd (3): hold person, silence, spiritual weapon. 3rd (3): animate dead, dispel magic. 4th (3): divination, guardian of faith. 5th (2): contagion, insect plague. 6th (1): harm.","dd":"Kleriker der 10. Stufe, Wei, SG 17, +9 auf Treffer. Zaubertricks: Heilige Flamme, Thaumaturgie. 1. (4): Befehl, Lenkendes Geschoss, Schild des Glaubens. 2. (3): Person festhalten, Stille, Spirituelle Waffe. 3. (3): Tote beleben, Magie bannen. 4. (3): Weissagung, Wächter des Glaubens. 5. (2): Ansteckung, Insektenplage. 6. (1): Leid."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The mummy can use its Dreadful Glare and makes one attack with its rotting fist.","dd":"Der Mumienfürst kann seinen Schrecklichen Blick einsetzen und führt einen Angriff mit seiner Faulenden Faust aus."},{"n":"Rotting Fist","nd":"Faulende Faust","hit":9,"rng":"reach 5 ft.","dmg":[["3d6+4","bludgeoning"],["6d6","necrotic"]],"d":"DC 16 Constitution save or cursed with mummy rot (no HP regain, HP max -3d6 per 24 hours).","dd":"SG-16-Konstitutionsrettungswurf oder Mumienfäule (keine TP-Rückgewinnung, TP-Maximum sinkt alle 24 Stunden um 3W6)."},{"n":"Dreadful Glare","nd":"Schrecklicher Blick","dc":16,"save":"wis","d":"One creature within 60 ft. that can see it must save or be frightened until end of the mummy's next turn; paralyzed too if it fails by 5 or more. Success: immune for 24 hours.","dd":"Eine Kreatur im Umkreis von 18 m muss einen Rettungswurf bestehen oder ist bis zum Ende des nächsten Zuges verängstigt; scheitert sie um 5 oder mehr, auch gelähmt. Bei Erfolg 24 Stunden immun."}],"leg":[{"n":"Legendary Actions","nd":"Legendäre Aktionen","d":"The mummy lord can take 3 legendary actions, one at a time at the end of another creature's turn.","dd":"Der Mumienfürst kann 3 legendäre Aktionen ausführen, jeweils eine am Ende des Zuges einer anderen Kreatur."},{"n":"Attack","nd":"Angriff","d":"Makes one attack with its rotting fist or uses its Dreadful Glare.","dd":"Führt einen Angriff mit der Faulenden Faust aus oder setzt den Schrecklichen Blick ein."},{"n":"Blinding Dust","nd":"Blendender Staub","dc":16,"save":"con","d":"Each creature within 5 ft. must save or be blinded until the end of its next turn.","dd":"Jede Kreatur im Umkreis von 1,5 m muss einen Rettungswurf bestehen oder ist bis zum Ende ihres nächsten Zuges blind."},{"n":"Blasphemous Word (Costs 2 Actions)","nd":"Lästerliches Wort (kostet 2 Aktionen)","dc":16,"save":"con","d":"Each non-undead creature within 10 ft. that can hear it must save or be stunned until the end of the mummy lord's next turn.","dd":"Jede nicht untote Kreatur im Umkreis von 3 m, die es hört, muss einen Rettungswurf bestehen oder ist bis zum Ende des nächsten Zuges des Mumienfürsten betäubt."},{"n":"Channel Negative Energy (Costs 2 Actions)","nd":"Negative Energie kanalisieren (kostet 2 Aktionen)","d":"Until the end of its next turn, creatures within 60 ft. can't regain HP.","dd":"Bis zum Ende seines nächsten Zuges können Kreaturen im Umkreis von 18 m keine TP zurückerhalten."},{"n":"Whirlwind of Sand (Costs 2 Actions)","nd":"Sandwirbel (kostet 2 Aktionen)","d":"Transforms into a whirlwind of sand, moves up to 60 ft., and reverts; immune to all damage while a whirlwind.","dd":"Verwandelt sich in einen Sandwirbel, bewegt sich bis zu 18 m und nimmt wieder seine normale Gestalt an; dabei immun gegen jeden Schaden."}],"spell":{"dc":17,"hit":9}},{"id":"nalfeshnee","en":"Nalfeshnee","de":"Nalfeshnee","size":"L","type":"fiend","sub":"demon","al":"chaotic evil","ac":18,"acn":"natural armor","hp":184,"hd":"16d10+96","spd":{"walk":20,"fly":30},"ab":[21,10,22,19,12,15],"sv":{"con":11,"int":9,"wis":6,"cha":7},"dr":"cold, fire, lightning; bludgeoning, piercing, and slashing from nonmagical attacks","di":"poison","ci":"poisoned","sen":"truesight 120 ft., passive Perception 11","lang":"Abyssal, telepathy 120 ft.","cr":"13","env":["dungeon","underdark"],"tr":[{"n":"Magic Resistance","nd":"Magieresistenz","d":"Advantage on saving throws against spells and other magical effects.","dd":"Vorteil bei Rettungswürfen gegen Zauber und andere magische Effekte."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The nalfeshnee uses Horror Nimbus if it can. It then makes three attacks: one with its bite and two with its claws.","dd":"Der Nalfeshnee setzt, wenn möglich, seinen Schreckensnimbus ein. Dann führt er drei Angriffe aus: einen Biss und zwei Klauenangriffe."},{"n":"Bite","nd":"Biss","hit":10,"rng":"reach 5 ft.","dmg":[["5d10+5","piercing"]]},{"n":"Claw","nd":"Klaue","hit":10,"rng":"reach 10 ft.","dmg":[["3d6+5","slashing"]]},{"n":"Horror Nimbus","nd":"Schreckensnimbus","rec":"5-6","dc":15,"save":"wis","d":"Each creature within 15 ft. that can see the nalfeshnee must save or be frightened for 1 minute (repeat save at end of each turn). Success: immune for 24 hours.","dd":"Jede Kreatur im Umkreis von 4,5 m, die den Nalfeshnee sehen kann, muss einen Rettungswurf bestehen oder ist 1 Minute lang verängstigt (Wiederholung am Ende jedes Zuges). Bei Erfolg 24 Stunden immun."},{"n":"Teleport","nd":"Teleportieren","d":"Magically teleports, with carried gear, up to 120 ft. to an unoccupied space it can see.","dd":"Teleportiert sich mit getragener Ausrüstung bis zu 36 m weit an einen freien Ort, den er sehen kann."}]},{"id":"night-hag","en":"Night Hag","de":"Nachtvettel","size":"M","type":"fiend","al":"neutral evil","ac":17,"acn":"natural armor","hp":112,"hd":"15d8+45","spd":{"walk":30},"ab":[18,15,16,16,14,16],"sk":{"Deception":7,"Insight":6,"Perception":6,"Stealth":6},"dr":"cold, fire; bludgeoning, piercing, and slashing from nonmagical attacks that aren't silvered","ci":"charmed","sen":"darkvision 120 ft., passive Perception 16","lang":"Abyssal, Common, Infernal, Primordial","cr":"5","env":["dungeon","swamp","urban"],"tr":[{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"Spell save DC 14, +6 to hit with spell attacks. At will: detect magic, magic missile. 2/day each: plane shift (self only), ray of enfeeblement, sleep.","dd":"Zauber-SG 14, +6 auf Zauberangriffe. Beliebig oft: Magie entdecken, Magisches Geschoss. Je 2/Tag: Ebenenwechsel (nur selbst), Strahl der Schwächung, Schlaf."},{"n":"Magic Resistance","nd":"Magieresistenz","d":"The hag has advantage on saving throws against spells and other magical effects.","dd":"Die Vettel ist bei Rettungswürfen gegen Zauber und andere magische Effekte im Vorteil."}],"act":[{"n":"Claws (Hag Form Only)","nd":"Klauen (nur Vettelgestalt)","hit":7,"rng":"reach 5 ft.","dmg":[["2d8+4","slashing"]]},{"n":"Change Shape","nd":"Gestaltwandel","d":"The hag magically polymorphs into a Small or Medium female humanoid, or back into her true form.","dd":"Die Vettel verwandelt sich magisch in eine kleine oder mittelgroße weibliche Humanoide oder zurück."},{"n":"Etherealness","nd":"Körperlosigkeit","d":"The hag magically enters the Ethereal Plane from the Material Plane, or vice versa (requires heartstone).","dd":"Die Vettel betritt magisch die Ätherebene oder kehrt zurück (benötigt Herzstein)."},{"n":"Nightmare Haunting (1/Day)","nd":"Albtraumspuk (1/Tag)","use":"1/day","d":"While on the Ethereal Plane, the hag touches a sleeping humanoid; the target gains no benefit from rest and its hit point maximum is reduced by 5 (3d10) psychic damage until the curse ends.","dd":"Auf der Ätherebene berührt die Vettel einen schlafenden Humanoiden; das Ziel erhält keinen Nutzen aus der Rast, und sein LP-Maximum sinkt um 5 (3d10) psychischen Schaden."}],"env_note":"","spell":{"dc":14,"hit":6}},{"id":"nightmare","en":"Nightmare","de":"Nachtmahr","size":"L","type":"fiend","al":"neutral evil","ac":13,"acn":"natural armor","hp":68,"hd":"8d10+24","spd":{"walk":60,"fly":90},"ab":[18,15,16,10,13,15],"di":"fire","sen":"passive Perception 11","lang":"understands Abyssal, Common, and Infernal but can't speak","cr":"3","env":["dungeon","grassland","underdark"],"tr":[{"n":"Confer Fire Resistance","nd":"Feuerresistenz verleihen","d":"Can grant resistance to fire damage to anyone riding it.","dd":"Kann jedem, der auf ihm reitet, Resistenz gegen Feuerschaden verleihen."},{"n":"Illumination","nd":"Leuchten","d":"Sheds bright light in a 10-ft. radius and dim light for an additional 10 ft.","dd":"Spendet helles Licht im Radius von 3 m und dämmriges Licht für weitere 3 m."}],"act":[{"n":"Hooves","nd":"Hufe","hit":6,"rng":"reach 5 ft.","dmg":[["2d8+4","bludgeoning"],["2d6","fire"]]},{"n":"Ethereal Stride","nd":"Ätherschritt","d":"The nightmare and up to three willing creatures within 5 ft. magically enter the Ethereal Plane from the Material Plane, or vice versa.","dd":"Der Nachtmahr und bis zu drei bereitwillige Kreaturen im Umkreis von 1,5 m wechseln magisch von der materiellen Ebene in die Ätherebene oder umgekehrt."}]},{"id":"noble","en":"Noble","de":"Adliger","size":"M","type":"humanoid","sub":"any race","al":"any alignment","ac":15,"acn":"breastplate","hp":9,"hd":"2d8","spd":{"walk":30},"ab":[11,12,11,12,14,16],"sk":{"Deception":5,"Insight":4,"Persuasion":5},"sen":"passive Perception 12","lang":"any two languages","cr":"1/8","env":["urban"],"act":[{"n":"Rapier","nd":"Rapier","hit":3,"rng":"reach 5 ft.","dmg":[["1d8+1","piercing"]]}],"rea":[{"n":"Parry","nd":"Parieren","d":"The noble adds 2 to its AC against one melee attack that would hit it. To do so, it must see the attacker and be wielding a melee weapon.","dd":"Der Adlige erhöht seine RK gegen einen Nahkampfangriff, der ihn treffen würde, um 2. Er muss den Angreifer sehen und eine Nahkampfwaffe führen."}]},{"id":"ochre-jelly","en":"Ochre Jelly","de":"Ockergallerte","size":"L","type":"ooze","al":"unaligned","ac":8,"hp":45,"hd":"6d10+12","spd":{"walk":10,"climb":10},"ab":[15,6,14,2,6,1],"dr":"acid","di":"lightning, slashing","ci":"blinded, charmed, deafened, exhaustion, frightened, prone","sen":"blindsight 60 ft. (blind beyond this radius), passive Perception 8","lang":"—","cr":"2","env":["underdark","swamp","dungeon"],"tr":[{"n":"Amorphous","nd":"Amorph","d":"Can move through a space as narrow as 1 inch without squeezing.","dd":"Passt ohne Zwängen durch 2,5 cm breite Öffnungen."},{"n":"Spider Climb","nd":"Spinnenklettern","d":"Can climb difficult surfaces, including ceilings, without an ability check.","dd":"Kann ohne Attributswurf schwierige Oberflächen und Decken erklettern."}],"act":[{"n":"Pseudopod","nd":"Pseudopodium","hit":4,"rng":"reach 5 ft.","dmg":[["2d6+2","bludgeoning"],["1d6","acid"]]}],"rea":[{"n":"Split","nd":"Teilen","d":"When a Medium or larger jelly is subjected to lightning or slashing damage, it splits into two new jellies if it has at least 10 HP; each has half the HP (rounded down) and is one size smaller.","dd":"Erleidet eine mindestens mittelgroße Gallerte Blitz- oder Hiebschaden und hat mindestens 10 TP, teilt sie sich in zwei mit je halben TP, eine Größenkategorie kleiner."}]},{"id":"octopus","en":"Octopus","de":"Oktopus","size":"S","type":"beast","al":"unaligned","ac":12,"hp":3,"hd":"1d6","spd":{"walk":5,"swim":30},"ab":[4,15,11,3,10,4],"sk":{"Perception":2,"Stealth":4},"sen":"darkvision 30 ft., passive Perception 12","lang":"—","cr":"0","env":["coast"],"tr":[{"n":"Hold Breath","nd":"Atem anhalten","d":"While out of water, can hold its breath for 30 minutes.","dd":"Kann außerhalb des Wassers 30 Minuten lang den Atem anhalten."},{"n":"Underwater Camouflage","nd":"Unterwassertarnung","d":"Advantage on Dexterity (Stealth) checks made while underwater.","dd":"Vorteil bei Geschicklichkeitswürfen (Heimlichkeit) unter Wasser."},{"n":"Water Breathing","nd":"Wasseratmung","d":"Can breathe only underwater.","dd":"Kann nur unter Wasser atmen."}],"act":[{"n":"Tentacles","nd":"Tentakel","hit":4,"rng":"reach 5 ft.","dmg":[["1","bludgeoning"]],"d":"Target is grappled (escape DC 10). Until the grapple ends, the octopus can't use its tentacles on another target.","dd":"Ziel wird gepackt (Entkommen SG 10). Bis der Griff endet, kann der Krake seine Tentakel nicht gegen ein anderes Ziel einsetzen."},{"n":"Ink Cloud","nd":"Tintenwolke","use":"1/short rest","d":"Recharges after a short or long rest. A 5-ft.-radius cloud of ink extends around the octopus if it is underwater; the area is heavily o  100 ft. übermitteln, die eine Sprache versteht."}],"act":[{"n":"Bite","nd":"Biss","hit":4,"rng":"reach 5 ft.","dmg":[["1d4+2","piercing"]]},{"n":"Sting","nd":"Stachel","hit":4,"rng":"reach 5 ft.","dmg":[["1d4+2","piercing"]],"d":"Target must succeed on a DC 11 Con save or be poisoned for 1 hour. If it fails by 5 or more, it falls unconscious for the same duration, or until it takes damage or another creature uses an action to shake it awake.","dd":"Das Ziel muss einen SG-11-Konstitutionsrettungswurf bestehen oder ist 1 Stunde lang vergiftet. Scheitert es um 5 oder mehr, wird es für dieselbe Dauer bewusstlos oder bis es Schaden erleidet oder eine andere Kreatur es mit einer Aktion wachrüttelt."}]},{"id":"purple-worm","en":"Purple Worm","de":"Purpurwurm","size":"G","type":"monstrosity","al":"unaligned","ac":18,"acn":"natural armor","hp":247,"hd":"15d20+90","spd":{"walk":50,"burrow":30},"ab":[28,7,22,1,8,4],"sv":{"con":11,"wis":4},"sen":"blindsight 30 ft., tremorsense 60 ft., passive Perception 9","lang":"—","cr":"15","env":["underdark","desert"],"tr":[{"n":"Tunneler","nd":"Tunnelgräber","d":"Can burrow through solid rock at half its burrow speed and leaves a 10-ft.-diameter tunnel in its wake.","dd":"Kann sich mit halber Grabgeschwindigkeit durch festen Fels graben und hinterlässt einen Tunnel mit 3 m Durchmesser."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"Two attacks: one with its bite and one with its stinger.","dd":"Zwei Angriffe: Biss und Stachel."},{"n":"Bite","nd":"Biss","hit":14,"rng":"reach 10 ft.","dmg":[["3d8+9","piercing"]],"d":"If the target is Large or smaller, DC 19 Dex save or be swallowed: blinded, restrained, total cover, 21 (6d6) acid at the start of each of the worm's turns. If the worm takes 30+ damage in one turn from a creature inside, DC 21 Con save or it regurgitates all swallowed creatures (prone within 10 ft.).","dd":"Ist das Ziel höchstens groß, SG-19-Geschicklichkeitsrettungswurf, sonst verschlungen: blind, festgesetzt, volle Deckung, 21 (6d6) Säure zu Beginn jedes Zuges des Wurms. Erleidet er in einem Zug 30+ Schaden von innen, SG-21-Konstitutionsrettungswurf, sonst würgt er alle aus."},{"n":"Tail Stinger","nd":"Schwanzstachel","hit":14,"rng":"reach 10 ft.","dmg":[["3d6+9","piercing"]],"dc":19,"save":"con","d":"The target must make a DC 19 Con save, taking 42 (12d6) poison damage on a failure, or half on a success.","dd":"SG-19-Konstitutionsrettungswurf: 42 (12d6) Giftschaden bei Misserfolg, halb bei Erfolg.","rider":{"dc":19,"save":"con","dmg":[["12d6","poison"]],"half":true,"ongoing":false}}]},{"id":"quasit","en":"Quasit","de":"Quasit","size":"T","type":"fiend","sub":"demon, shapechanger","al":"chaotic evil","ac":13,"hp":7,"hd":"3d4","spd":{"walk":40},"ab":[5,17,10,7,10,10],"sk":{"Stealth":5},"dr":"cold, fire, lightning; bludgeoning, piercing, and slashing from nonmagical attacks","di":"poison","ci":"poisoned","sen":"darkvision 120 ft., passive Perception 10","lang":"Abyssal, Common","cr":"1","env":["dungeon","underdark","urban"],"tr":[{"n":"Shapechanger","nd":"Gestaltwandler","d":"Can use its action to polymorph into a bat (speed 10, fly 40), a centipede (40, climb 40), or a toad (40, swim 40), or back. Statistics otherwise unchanged.","dd":"Kann sich als Aktion in eine Fledermaus (Bewegung 3 m, Fliegen 12 m), einen Tausendfüßler (12 m, Klettern 12 m) oder eine Kröte (12 m, Schwimmen 12 m) verwandeln oder zurück. Werte sonst unverändert."},{"n":"Magic Resistance","nd":"Magieresistenz","d":"Advantage on saving throws against spells and other magical effects.","dd":"Vorteil bei Rettungswürfen gegen Zauber und andere magische Effekte."}],"act":[{"n":"Claws (Bite in Beast Form)","nd":"Klauen (Biss in Tiergestalt)","hit":4,"rng":"reach 5 ft.","dmg":[["1d4+3","piercing"]],"d":"Target must succeed on a DC 10 Constitution save or take 5 (2d4) poison damage and be poisoned for 1 minute (repeat save at end of each turn).","dd":"Das Ziel muss einen SG-10-Konstitutionsrettungswurf bestehen oder erleidet 5 (2W4) Giftschaden und ist 1 Minute lang vergiftet (Wiederholung am Ende jedes Zuges).","rider":{"dc":10,"save":"con","dmg":[["2d4","poison"]],"half":false,"ongoing":false}},{"n":"Scare","nd":"Erschrecken","use":"1/day","dc":10,"save":"wis","d":"One creature within 20 ft. must save or be frightened for 1 minute; repeat save at end of each turn, with disadvantage if the quasit is within line of sight.","dd":"Eine Kreatur im Umkreis von 6 m muss einen Rettungswurf bestehen oder ist 1 Minute lang verängstigt; Wiederholung am Ende jedes Zuges, mit Nachteil, wenn der Quasit in Sichtlinie ist."},{"n":"Invisibility","nd":"Unsichtbarkeit","d":"Magically turns invisible until it attacks, uses Scare, or its concentration ends; carried gear also invisible.","dd":"Wird magisch unsichtbar, bis er angreift, Erschrecken einsetzt oder seine Konzentration endet; getragene Ausrüstung ebenfalls."}]},{"id":"quipper","en":"Quipper","de":"Quipper","size":"T","type":"beast","al":"unaligned","ac":13,"hp":1,"hd":"1d4-1","spd":{"walk":0,"swim":40},"ab":[2,16,9,1,7,2],"sen":"darkvision 60 ft., passive Perception 8","lang":"—","cr":"0","env":["swamp","coast"],"tr":[{"n":"Blood Frenzy","nd":"Blutrausch","d":"Advantage on melee attack rolls against any creature that doesn't have all its hit points.","dd":"Vorteil bei Nahkampfangriffswürfen gegen Kreaturen, die nicht alle Trefferpunkte haben."},{"n":"Water Breathing","nd":"Wasseratmung","d":"Can breathe only underwater.","dd":"Kann nur unter Wasser atmen."}],"act":[{"n":"Bite","nd":"Biss","hit":5,"rng":"reach 5 ft.","dmg":[["1","piercing"]]}]},{"id":"rakshasa","en":"Rakshasa","de":"Rakshasa","size":"M","type":"fiend","al":"lawful evil","ac":16,"acn":"natural armor","hp":110,"hd":"13d8+52","spd":{"walk":40},"ab":[14,17,18,13,16,20],"sk":{"Deception":10,"Insight":8},"dv":"piercing from magic weapons wielded by good creatures","di":"bludgeoning, piercing, and slashing from nonmagical attacks","sen":"darkvision 60 ft., passive Perception 13","lang":"Common, Infernal","cr":"13","env":["urban"],"tr":[{"n":"Limited Magic Immunity","nd":"Begrenzte Magieimmunität","d":"Can't be affected or detected by spells of 6th level or lower unless it wishes to. Advantage on saving throws against all other spells and magical effects.","dd":"Kann von Zaubern des 6. Grades oder niedriger nicht beeinflusst oder entdeckt werden, sofern er es nicht will. Vorteil bei Rettungswürfen gegen alle anderen Zauber und magischen Effekte."},{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"Cha, save DC 18, +10 to hit with spell attacks, no material components. At will: detect thoughts, disguise self, mage hand, minor illusion. 3/day each: charm person, detect magic, invisibility, major image, suggestion. 1/day each: dominate person, fly, plane shift, true seeing.","dd":"Cha, SG 18, +10 auf Zauberangriffe, keine Materialkomponenten. Beliebig oft: Gedanken wahrnehmen, Selbstverkleidung, Magierhand, Kleine Illusion. Je 3/Tag: Person bezaubern, Magie entdecken, Unsichtbarkeit, Große Illusion, Einflüsterung. Je 1/Tag: Person beherrschen, Fliegen, Ebenenwechsel, Wahrer Blick."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The rakshasa makes two claw attacks.","dd":"Der Rakshasa führt zwei Klauenangriffe aus."},{"n":"Claw","nd":"Klaue","hit":7,"rng":"reach 5 ft.","dmg":[["2d6+2","slashing"]],"d":"Target is cursed if it is a creature: it gains no benefit from finishing a short or long rest and can't regain HP unless by magic. Lasts until removed by remove curse or similar magic.","dd":"Ist das Ziel eine Kreatur, wird es verflucht: Es profitiert nicht von kurzen oder langen Rasten und kann TP nur durch Magie zurückerhalten. Hält an, bis es durch Fluch brechen oder ähnliche Magie entfernt wird."}],"spell":{"dc":18,"hit":10}},{"id":"rat","en":"Rat","de":"Ratte","size":"T","type":"beast","al":"unaligned","ac":10,"hp":1,"hd":"1d4-1","spd":{"walk":20},"ab":[2,11,9,2,10,4],"sen":"darkvision 30 ft., passive Perception 10","
