ch on a successful one.","dd":"Der Drache atmet Feuer in einem Kegel von 15 Fuß aus. Jede Kreatur in diesem Bereich muss einen Geschicklichkeitsrettungswurf gegen SG 13 ablegen. Bei einem Misserfolg erleidet sie 24 (7d6) Feuerschaden, bei einem Erfolg die Hälfte."}]},{"id":"reef-shark","en":"Reef Shark","de":"Riffhai","size":"M","type":"beast","al":"unaligned","ac":12,"acn":"natural armor","hp":22,"hd":"4d8+4","spd":{"walk":0,"swim":40},"ab":[14,13,13,1,10,4],"sk":{"Perception":2},"sen":"blindsight 30 ft., passive Perception 12","lang":"—","cr":"1/2","env":["coast"],"tr":[{"n":"Pack Tactics","nd":"Rudeltaktik","d":"Advantage on attack rolls against a creature if at least one of its allies is within 5 ft. of the creature and isn't incapacitated.","dd":"Vorteil bei Angriffswürfen gegen eine Kreatur, wenn mindestens ein nicht kampfunfähiger Verbündeter innerhalb von 1,5 m davon ist."},{"n":"Water Breathing","nd":"Wasseratmung","d":"Can breathe only underwater.","dd":"Kann nur unter Wasser atmen."}],"act":[{"n":"Bite","nd":"Biss","hit":4,"rng":"reach 5 ft.","dmg":[["1d8+2","piercing"]]}]},{"id":"remorhaz","en":"Remorhaz","de":"Remorhaz","size":"H","type":"monstrosity","al":"unaligned","ac":17,"acn":"natural armor","hp":195,"hd":"17d12+85","spd":{"walk":30,"burrow":20},"ab":[24,13,21,4,10,5],"di":"cold, fire","sen":"darkvision 60 ft., tremorsense 60 ft., passive Perception 10","lang":"—","cr":"11","env":["arctic"],"tr":[{"n":"Heated Body","nd":"Glühender Körper","d":"A creature that touches the remorhaz or hits it with a melee attack while within 5 ft. of it takes 10 (3d10) fire damage.","dd":"Eine Kreatur, die den Remorhaz berührt oder ihn innerhalb von 1,5 m mit einem Nahkampfangriff trifft, erleidet 10 (3d10) Feuerschaden."}],"act":[{"n":"Bite","nd":"Biss","hit":11,"rng":"reach 10 ft.","dmg":[["6d10+7","piercing"],["3d6","fire"]],"d":"If the target is a creature, it is grappled (escape DC 17) and restrained while grappled; the remorhaz can't bite another target.","dd" acks","di":"necrotic, poison","ci":"charmed, exhaustion, frightened, poisoned","sen":"truesight 120 ft., passive Perception 24","lang":"all, telepathy 120 ft.","cr":"21","env":["mountain","urban","grassland"],"tr":[{"n":"Angelic Weapons","nd":"Engelswaffen","d":"Its weapon attacks are magical and deal an extra 6d8 radiant damage on a hit (included).","dd":"Seine Waffenangriffe sind magisch und verursachen bei einem Treffer zusätzlich 6W8 gleißenden Schaden (eingerechnet)."},{"n":"Divine Awareness","nd":"Göttliche Wahrnehmung","d":"Knows if it hears a lie.","dd":"Erkennt, wenn es eine Lüge hört."},{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"Cha, save DC 25, no material components. At will: detect evil and good, invisibility (self only). 3/day each: blade barrier, dispel evil and good, resurrection. 1/day each: commune, control weather.","dd":"Cha, SG 25, keine Materialkomponenten. Beliebig oft: Gutes und Böses entdecken, Unsichtbarkeit (nur selbst). Je 3/Tag: Klingenbarriere, Gutes und Böses bannen, Auferstehung. Je 1/Tag: Kommunion, Wetterkontrolle."},{"n":"Magic Resistance","nd":"Magieresistenz","d":"Advantage on saving throws against spells and other magical effects.","dd":"Vorteil bei Rettungswürfen gegen Zauber und andere magische Effekte."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The solar makes two greatsword attacks.","dd":"Der Solar führt zwei Zweihandschwertangriffe aus."},{"n":"Greatsword","nd":"Zweihandschwert","hit":15,"rng":"reach 5 ft.","dmg":[["4d6+8","slashing"],["6d8","radiant"]]},{"n":"Slaying Longbow","nd":"Tödlicher Langbogen","hit":13,"rng":"range 150/600 ft.","dmg":[["2d8+6","piercing"],["6d8","radiant"]],"d":"If the target has 100 HP or fewer, it must succeed on a DC 15 Constitution save or die.","dd":"Hat das Ziel 100 TP oder weniger, muss es einen SG-15-Konstitutionsrettungswurf bestehen oder stirbt."},{"n":"Flying Sword","nd":"Fliegendes Schwert","d":"Releases its greatsword to hover magically in an unoccupied space within 5 ft.; on later turns it can direct the sword (as a bonus action) to fly 50 ft. and attack or return. The sword is immune to all damage.","dd":"Lässt sein Zweihandschwert in einem freien Feld im Umkreis von 1,5 m schweben; in späteren Zügen kann er es (als Bonusaktion) 15 m fliegen und angreifen oder zurückkehren lassen. Das Schwert ist gegen jeden Schaden immun."},{"n":"Healing Touch","nd":"Heilende Berührung","use":"4/day","d":"Touches another creature, which magically regains 40 (8d8+4) HP and is freed from any curse, disease, poison, blindness, or deafness.","dd":"Berührt eine andere Kreatur, die magisch 40 (8W8+4) TP zurückerhält und von Flüchen, Krankheiten, Gift, Blindheit und Taubheit befreit wird."}],"leg":[{"n":"Legendary Actions","nd":"Legendäre Aktionen","d":"The solar can take 3 legendary actions, one at a time at the end of another creature's turn.","dd":"Der Solar kann 3 legendäre Aktionen ausführen, jeweils eine am Ende des Zuges einer anderen Kreatur."},{"n":"Teleport","nd":"Teleportieren","d":"Magically teleports, with carried gear, up to 120 ft. to an unoccupied space it can see.","dd":"Teleportiert sich mit getragener Ausrüstung bis zu 36 m weit an einen freien Ort, den er sehen kann."},{"n":"Searing Burst (Costs 2 Actions)","nd":"Sengender Ausbruch (kostet 2 Aktionen)","dc":23,"save":"dex","dmg":[["4d6","fire"],["4d6","radiant"]],"half":true,"d":"Each creature within 10 ft. of the solar must save.","dd":"Jede Kreatur im Umkreis von 3 m um den Solar muss einen Rettungswurf ablegen."},{"n":"Blinding Gaze (Costs 3 Actions)","nd":"Blendender Blick (kostet 3 Aktionen)","dc":15,"save":"con","d":"One creature within 30 ft. that can see the solar must save or be blinded until magic such as lesser restoration removes it.","dd":"Eine Kreatur im Umkreis von 9 m, die den Solar sehen kann, muss einen Rettungswurf bestehen oder ist blind, bis Magie wie Schwache Genesung dies aufhebt."}],"spell":{"dc":25,"hit":null}},{"id":"specter","en":"Specter","de":"Schreckgespenst","size":"M","type":"undead","al":"chaotic evil","ac":12,"hp":22,"hd":"5d8","spd":{"walk":0,"fly":50,"hover":true},"ab":[1,14,11,10,10,11],"dr":"acid, cold, fire, lightning, thunder; bludgeoning, piercing, and slashing from nonmagical attacks","di":"necrotic, poison","ci":"charmed, exhaustion, grappled, paralyzed, petrified, poisoned, prone, restrained, unconscious","sen":"darkvision 60 ft., passive Perception 10","lang":"understands all languages it knew in life but can't speak","cr":"1","env":["dungeon","urban","underdark"],"tr":[{"n":"Incorporeal Movement","nd":"Körperlose Bewegung","d":"Can move through creatures and objects as difficult terrain. Takes 5 (1d10) force damage if it ends its turn inside an object.","dd":"Kann sich durch Kreaturen und Gegenstände wie durch schwieriges Gelände bewegen. Erleidet 5 (1W10) Energieschaden, wenn es seinen Zug in einem Gegenstand beendet."},{"n":"Sunlight Sensitivity","nd":"Sonnenlichtempfindlichkeit","d":"In sunlight, disadvantage on attack rolls and on Wisdom (Perception) checks that rely on sight.","dd":"Im Sonnenlicht Nachteil bei Angriffswürfen und bei Weisheitswürfen (Wahrnehmung), die auf Sicht beruhen."}],"act":[{"n":"Life Drain","nd":"Lebensentzug","hit":4,"rng":"reach 5 ft.","dmg":[["3d6","necrotic"]],"d":"Target must succeed on a DC 10 Constitution save or its HP maximum is reduced by the damage taken until a long rest; dies at 0.","dd":"Das Ziel muss einen SG-10-Konstitutionsrettungswurf bestehen, sonst sinkt sein TP-Maximum bis zu einer langen Rast um den erlittenen Schaden; bei 0 stirbt es."}]},{"id":"spider","en":"Spider","de":"Spinne","size":"T","type":"beast","al":"unaligned","ac":12,"hp":1,"hd":"1d4-1","spd":{"walk":20,"climb":20},"ab":[2,14,8,1,10,2],"sk":{"Stealth":4},"sen":"darkvision 30 ft., passive Perception 10","lang":"—","cr":"0","env":["forest","dungeon","underdark","urban","swamp"],"tr":[{"n":"Spider Climb","nd":"Spinnenklettern","d":"Can climb difficult surfaces, incl t is grappled (escape DC 20) and restrained while grappled; the tarrasque can't bite another target.","dd":"Eine Kreatur wird gepackt (Rettung SG 20) und ist dabei festgesetzt; die Tarraske kann kein anderes Ziel beißen."},{"n":"Claw","nd":"Klaue","hit":19,"rng":"reach 15 ft.","dmg":[["4d8+10","slashing"]]},{"n":"Horns","nd":"Hörner","hit":19,"rng":"reach 10 ft.","dmg":[["4d10+10","piercing"]]},{"n":"Tail","nd":"Schwanz","hit":19,"rng":"reach 20 ft.","dmg":[["4d6+10","bludgeoning"]],"d":"If the target is a creature, DC 20 Str save or knocked prone.","dd":"Eine Kreatur muss einen SG-20-Stärkerettungswurf bestehen, sonst liegt sie."},{"n":"Frightful Presence","nd":"Furchterregende Präsenz","dc":17,"save":"wis","dmg":[],"d":"Each creature of its choice within 120 ft. that is aware of it: save or frightened for 1 minute, repeating the save at the end of each turn (disadvantage if the tarrasque is in line of sight). Success or end grants 24-hour immunity.","dd":"Jede Kreatur ihrer Wahl im Umkreis von 36 m, die sie bemerkt: Rettungswurf, sonst 1 Minute verängstigt; Wiederholung am Ende jedes Zuges (mit Nachteil bei Sichtlinie). Erfolg gewährt 24 Stunden Immunität."},{"n":"Swallow","nd":"Verschlingen","d":"One bite attack against a Large or smaller creature it is grappling. On a hit, the target takes the bite's damage and is swallowed (grapple ends): blinded, restrained, total cover, 56 (16d6) acid at the start of each of the tarrasque's turns. If it takes 60+ damage in one turn from a creature inside, DC 20 Con save or it regurgitates all swallowed creatures (prone within 10 ft.).","dd":"Ein Bissangriff gegen eine gepackte, höchstens große Kreatur. Bei Treffer Bissschaden und verschlungen: blind, festgesetzt, volle Deckung, 56 (16d6) Säure zu Beginn jedes Zuges. Erleidet sie in einem Zug 60+ Schaden von innen, SG-20-Konstitutionsrettungswurf, sonst würgt sie alle aus."}],"leg":[{"n":"Legendary Actions","nd":"Legendäre Aktionen","d":"The tarrasque can take 3 legendary actions, one at a time at the end of another creature's turn; regains spent actions at the start of its turn.","dd":"Die Tarraske kann 3 legendäre Aktionen ausführen, jeweils am Ende des Zuges einer anderen Kreatur; erhält sie zu Beginn ihres Zuges zurück."},{"n":"Attack","nd":"Angriff","d":"Makes one claw attack or tail attack.","dd":"Ein Klauen- oder Schwanzangriff."},{"n":"Move","nd":"Bewegung","d":"Moves up to half its speed.","dd":"Bewegt sich bis zur Hälfte ihrer Bewegungsrate."},{"n":"Chomp (Costs 2 Actions)","nd":"Zuschnappen (kostet 2 Aktionen)","d":"Makes one bite attack or uses its Swallow.","dd":"Ein Bissangriff oder Verschlingen."}]},{"id":"thug","en":"Thug","de":"Schläger","size":"M","type":"humanoid","sub":"any race","al":"any non-good alignment","ac":11,"acn":"leather armor","hp":32,"hd":"5d8+10","spd":{"walk":30},"ab":[15,11,14,10,10,11],"sk":{"Intimidation":2},"sen":"passive Perception 10","lang":"any one language (usually Common)","cr":"1/2","env":["urban"],"tr":[{"n":"Pack Tactics","nd":"Rudeltaktik","d":"Advantage on attack rolls against a creature if at least one of the thug's allies is within 5 feet of the creature and the ally isn't incapacitated.","dd":"Vorteil bei Angriffswürfen gegen eine Kreatur, wenn mindestens ein nicht kampfunfähiger Verbündeter innerhalb von 1,5 m (5 ft.) um sie ist."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The thug makes two melee attacks.","dd":"Der Schläger führt zwei Nahkampfangriffe aus."},{"n":"Mace","nd":"Streitkolben","hit":4,"rng":"reach 5 ft.","dmg":[["1d6+2","bludgeoning"]]},{"n":"Heavy Crossbow","nd":"Schwere Armbrust","hit":2,"rng":"range 100/400 ft.","dmg":[["1d10","piercing"]]}]},{"id":"tiger","en":"Tiger","de":"Tiger","size":"L","type":"beast","al":"unaligned","ac":12,"hp":37,"hd":"5d10+10","spd":{"walk":40},"ab":[17,15,14,3,12,8],"sk":{"Perception":3,"Stealth":6},"sen":"darkvision 60 ft., passive Perception 13","lang":"—","cr":"1","env":["forest","grassland","swamp"],"tr":[{"n":"Keen Smell","nd":"Scharfer Geruchssinn","d":"Advantage on Wisdom (Perception) checks that rely on smell.","dd":"Vorteil bei Weisheitswürfen (Wahrnehmung), die auf Geruch beruhen."},{"n":"Pounce","nd":"Anspringen","d":"If it moves at least 20 ft. straight toward a creature and hits it with a claw attack on the same turn, the target must succeed on a DC 13 Strength saving throw or be knocked prone. If prone, the tiger can make one bite attack against it as a bonus action.","dd":"Bewegt er sich mindestens 6 m geradlinig auf eine Kreatur zu und trifft sie im selben Zug mit einem Klauenangriff, muss das Ziel einen SG-13-Stärkerettungswurf bestehen oder wird umgestoßen. Liegt es, kann der Tiger als Bonusaktion einen Bissangriff gegen es ausführen."}],"act":[{"n":"Bite","nd":"Biss","hit":5,"rng":"reach 5 ft.","dmg":[["1d10+3","piercing"]]},{"n":"Claw","nd":"Klaue","hit":5,"rng":"reach 5 ft.","dmg":[["1d8+3","slashing"]]}]},{"id":"treant","en":"Treant","de":"Baumhirte","size":"H","type":"plant","al":"chaotic good","ac":16,"acn":"natural armor","hp":138,"hd":"12d12+60","spd":{"walk":30},"ab":[23,8,21,12,16,12],"dv":"fire","dr":"bludgeoning, piercing","sen":"passive Perception 13","lang":"Common, Druidic, Elvish, Sylvan","cr":"9","env":["forest"],"tr":[{"n":"False Appearance","nd":"Falsches Erscheinungsbild","d":"While motionless, indistinguishable from a normal tree.","dd":"Reglos nicht von einem normalen Baum zu unterscheiden."},{"n":"Siege Monster","nd":"Belagerungsmonster","d":"Deals double damage to objects and structures.","dd":"Verursacht doppelten Schaden an Gegenständen und Bauwerken."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"Two slam attacks.","dd":"Zwei Hiebangriffe."},{"n":"Slam","nd":"Hieb","hit":10,"rng":"reach 5 ft.","dmg":[["3d6+6","bludgeoning"]]},{"n":"Rock","nd":"Felsbrocken","hit":10,"rng":"range 60/180 ft.","dmg":[["4d10+6","bludgeoning"]]},{"n":"Animate Trees","nd":"Bäume beleben","use":"1/day","d":"Magically animates one or two trees within 60 ft.; they have awakened tree statistics but can't speak, act on the treant's turn, last 1 day or until the treant dies or is more than 120 ft. away.","dd":"Belebt ein oder zwei Bäume in 18 m (Werte des Erweckten Baums, ohne Sprache); handeln im Zug des Baumhirten, 1 Tag oder bis er stirbt oder über 36 m entfernt ist."}]},{"id":"tribal-warrior","en":"Tribal Warrior","de":"Stammeskrieger","size":"M","type":"humanoid","sub":"any race","al":"any alignment","ac":12,"acn":"hide armor","hp":11,"hd":"2d8+2","spd":{"walk":30},"ab":[13,11,12,8,11,8],"sen":"passive Perception 10","lang":"any one language","cr":"1/8","env":["arctic","desert","forest","grassland","coast","mountain","swamp"],"tr":[{"n":"Pack Tactics","nd":"Rudeltaktik","d":"Advantage on attack rolls against a creature if at least one of the warrior's allies is within 5 feet of the creature and the ally isn't incapacitated.","dd":"Vorteil bei Angriffswürfen gegen eine Kreatur, wenn mindestens ein nicht kampfunfähiger Verbündeter innerhalb von 1,5 m (5 ft.) um sie ist."}],"act":[{"n":"Spear","nd":"Speer","hit":3,"rng":"reach 5 ft. or range 20/60 ft.","dmg":[["1d6+1","piercing"]],"d":"Or 1d8+1 piercing if used with two hands to make a melee attack.","dd":"Oder 1W8+1 Stich, wenn zweihändig im Nahkampf geführt."}]},{"id":"triceratops","en":"Triceratops","de":"Triceratops","size":"H","type":"beast","al":"unaligned","ac":13,"acn":"natural armor","hp":95,"hd":"10d12+30","spd":{"walk":50},"ab":[22,9,17,2,11,5],"sen":"passive Perception 10","lang":"—","cr":"5","env":["grassland","forest"],"tr":[{"n":"Trampling Charge","nd":"Trampelnder Ansturm","d":"If it moves at least 20 ft. straight toward a creature and hits it with a gore attack on the same turn, the target must succeed on a DC 13 Strength saving throw or be knocked prone. If prone, the triceratops can make one stomp attack against it as a bonus action.","dd":"Bewegt er sich mindestens 6 m geradlinig auf eine Kreatur zu und trifft sie im selben Zug mit einem Aufspießen-Angriff, muss das Ziel einen SG-13-Stärkerettungswurf bestehen oder wird umgestoßen. Liegt es, kann der Triceratops als Bonusaktion einen Stampfangriff gegen es ausführen."}],"act":[{"n":"Gore","nd":"Aufspießen","hit":9,"rng":"reach 5 ft.","dmg":[["4d8+6","piercing"]]},{"n":"Stomp","nd":"Stampfen","hit":9,"rng":"reach 5 ft.","dmg":[["3d10+6","bludgeoning"]],"d":"One prone creature.","dd":"Eine liegende Kreatur."}]},{"id":"troll","en":"Troll","de":"Troll","size":"L","type":"giant","al":"chaotic evil","ac":15,"acn":"natural armor","hp":84,"hd":"8d10+40","spd":{"walk":30},"ab":[18,13,20,7,9,7],"sk":{"Perception":2},"sen":"darkvision 60 ft., passive Perception 12","lang":"Giant","cr":"5","env":["arctic","forest","mountain","swamp","underdark","grassland"],"tr":[{"n":"Keen Smell","nd":"Scharfer Geruchssinn","d":"Advantage on Wisdom (Perception) checks that rely on smell.","dd":"Vorteil bei Weisheitswürfen (Wahrnehmung), die auf Geruch beruhen."},{"n":"Regeneration","nd":"Regeneration","d":"The troll regains 10 hit points at the start of its turn. If it takes acid or fire damage, this trait doesn't function at the start of its next turn. The troll dies only if it starts its turn with 0 hit points and doesn't regenerate.","dd":"Der Troll erhält zu Beginn seines Zuges 10 TP zurück. Erleidet er Säure- oder Feuerschaden, wirkt dies zu Beginn seines nächsten Zuges nicht. Er stirbt nur, wenn er seinen Zug mit 0 TP beginnt und nicht regeneriert."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The troll makes three attacks: one with its bite and two with its claws.","dd":"Der Troll führt drei Angriffe aus: einen Biss und zwei Klauenangriffe."},{"n":"Bite","nd":"Biss","hit":7,"rng":"reach 5 ft.","dmg":[["1d6+4","piercing"]]},{"n":"Claw","nd":"Klaue","hit":7,"rng":"reach 5 ft.","dmg":[["2d6+4","slashing"]]}]},{"id":"tyrannosaurus-rex","en":"Tyrannosaurus Rex","de":"Tyrannosaurus Rex","size":"H","type":"beast","al":"unaligned","ac":13,"acn":"natural armor","hp":136,"hd":"13d12+52","spd":{"walk":50},"ab":[25,10,19,2,12,9],"sk":{"Perception":4},"sen":"passive Perception 14","lang":"—","cr":"8","env":["forest","grassland","swamp"],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The tyrannosaurus makes two attacks: one with its bite and one with its tail. It can't make both attacks against the same target.","dd":"Der Tyrannosaurus führt zwei Angriffe aus: einen Biss- und einen Schwanzangriff. Er kann nicht beide gegen dasselbe Ziel richten."},{"n":"Bite","nd":"Biss","hit":10,"rng":"reach 10 ft.","dmg":[["4d12+7","piercing"]],"d":"If the target is a Medium or smaller creature, it is grappled (escape DC 17). Until the grapple ends, the target is restrained, and the tyrannosaurus can't bite another target.","dd":"Ist das Ziel mittelgroß oder kleiner, wird es gepackt (Entkommen SG 17). Bis der Griff endet, ist es festgesetzt, und der Tyrannosaurus kann kein anderes Ziel beißen."},{"n":"Tail","nd":"Schwanz","hit":10,"rng":"reach 10 ft.","dmg":[["3d8+7","bludgeoning"]]}]},{"id":"unicorn","en":"Unicorn","de":"Einhorn","size":"L","type":"celestial","al":"lawful good","ac":12,"hp":67,"hd":"9d10+18","spd":{"walk":50},"ab":[18,14,15,11,17,16],"di":"poison","ci":"charmed, paralyzed, poisoned","sen":"darkvision 60 ft., passive Perception 13","lang":"Celestial, Elvish, Sylvan, telepathy 60 ft.","cr":"5","env":["forest"],"tr":[{"n":"Charge","nd":"Sturmangriff","d":"If it moves at least 20 ft. straight toward a target and then hits with a horn attack on the same turn, the target takes an extra 9 (2d8) piercing damage and must succeed on a DC 15 Strength save or be knocked prone.","dd":"Bewegt es sich mindestens 6 m geradlinig auf ein Ziel zu und trifft im selben Zug mit dem Horn, erleidet das Ziel zusätzlich 9 (2W8) Stichschaden und muss einen SG-15-Stärkerettungswurf bestehen oder wird umgestoßen."},{"n":"Innate Spellcasting","nd":"Angeborenes Zauberwirken","d":"Cha, save DC 14, no components. At will: detect evil and good, druidcraft, pass without trace. 1/day each: calm emotions, dispel evil and good, entangle.","dd":"Cha, SG 14, keine Komponenten. Beliebig oft: Gutes und Böses entdecken, Druidenkunst, Spurloses Gehen. Je 1/Tag: Gefühle besänftigen, Gutes und Böses bannen, Verstricken."},{"n":"Magic Resistance","nd":"Magieresistenz","d":"Advantage on saving throws against spells and other magical effects.","dd":"Vorteil bei Rettungswürfen gegen Zauber und andere magische Effekte."},{"n":"Magic Weapons","nd":"Magische Waffen","d":"Its weapon attacks are magical.","dd":"Seine Waffenangriffe sind magisch."}],"act":[{"n":"Multiattack","nd":"Mehrfachangriff","d":"The unicorn makes two attacks: one with its hooves and one with its horn.","dd":"Das Einhorn führt zwei Angriffe aus: einen mit den Hufen und einen mit dem Horn."},{"n":"Hooves","nd":"Hufe","hit":7,"rng":"reach 5 ft.","dmg":[["2d6+4","bludgeoning"]]},{"n":"Horn","nd":"Horn","hit":7,"rng":"reach 5 ft.","dmg":[["1d8+4","piercing"]]},{"n":"Healing Touch","nd":"Heilende Berührung","use":"3/day","d":"Touches another creature, which magically regains 11 (2d8+2) HP and is freed from all diseases and poisons.","dd":"Berührt eine andere Kreatur, die magisch 11 (2W8+2) TP zurückerhält und von allen Krankheiten und Giften befreit wird."},{"n":"Teleport","nd":"Teleportieren","use":"1/day","d":"Teleports itself and up to three willing creatures within 5 ft., with carried gear, to a location within 1 mile it is familiar with.","dd":"Teleportiert sich und bis zu drei bereitwillige Kreaturen im Umkreis von 1,5 m samt Ausrüstung an einen ihm bekannten Ort im Umkreis von 1,5 km."}],"leg":[{"n":"Legendary Actions","nd":"Legendäre Aktionen","d":"The unicorn can take 3 legendary actions, one at a time at the end of another creature's turn.","dd":"Das Einhorn kann 3 legendäre Aktionen ausführen, jeweils eine am Ende des Zuges einer anderen Kreatur."},{"n":"Hooves","nd":"Hufe","d":"Makes one attack with its hooves.","dd":"Führt einen Angriff mit den Hufen aus."},{"n":"Shimmering Shield (Costs 2 Actions)","nd":"Schimmernder Schild (kostet 2 Aktionen)","d":"The unicorn or another creature it can see within 60 ft. gains a +2 bonus to AC until the end of the unicorn's next turn.","dd":"Das Einhorn oder eine andere Kreatur im Umkreis von 18 m, die es sehen kann, erhält bis zum Ende des nächsten Zuges des Einhorns +2 auf die RK."},{"n":"Heal Self (Costs 3 Actions)","nd":"Selbstheilung (kostet 3 Aktionen)","d":"Magically regains 11 (2d8+2) HP.","dd":"Erhält magisch 11 (2W8+2) TP zurück."}],"spell":{"dc":14,"hit":null}},{"id":"vampire","en":"Vampire","de":"Vampir","size":"M","type":"undead","sub":"shapechanger","al":"lawful evil","ac":16,"acn":"natural armor","hp":144,"hd":"17d8+68","spd":{"walk":30},"ab":[18,18,18,17,15,18],"sv":{"dex":9,"wis":7,"cha":9},"sk":{"Perception":7,"Stealth":9},"dr":"necrotic; bludgeoning, piercing, and slashing from nonmagical attacks","sen":"darkvision 120 ft., passive Perception 17","lang":"the languages it knew in life","cr":"13","env":["urban","dungeon"],"tr":[{"n":"Shapechanger","nd":"Gestaltwandler","d":"If not in sunlight or running water, can use its action to polymorph into a Tiny bat or a Medium cloud of mist, or back.","dd":"Wenn nicht im Sonnenlicht oder fließendem Wasser, kann er sich als Aktion in eine winzige Fledermaus oder eine mittelgroße Nebelwolke verwandeln oder zurück."},{"n":"Legendary Resistance (3/Day)","nd":"Legendäre Resistenz (3/Tag)","d":"If the vampire fails a saving throw, it can choose to succeed instead.","dd":"Scheitert der Vampir bei einem Rettungswurf, kann er ihn stattdessen bestehen."},{"n":"Misty Escape","nd":"Flucht als Nebel","d":"When it drops to 0 HP outside its resting place, it turns into mist instead of falling unconscious and must reach its resting place within 2 hours; there it reverts and regains 1 HP after 1 hour.","dd":"Fällt er außerhalb seiner Ruhestätte auf 0 TP, wird er zu Nebel statt bewusstlos zu werden und muss binnen 2 Stunden seine Ruhestätte erreichen; dort nimmt er wieder Gestalt an und erhält nach 1 Stunde 1 TP zurück."},{"n":"Regeneration","nd":"Regeneration","d":"Regains 20 HP at the start of its turn if it has at least 1 HP and isn't in sunlight or running water. Radiant damage or holy water stops this until its next turn.","dd":"Erhält zu Beginn seines Zuges 20 TP zurück, wenn er mindestens 1 TP hat und nicht in Sonnenlicht oder fließendem Wasser ist. Gleißender Schaden oder Weihwasser verhindert dies bis zu seinem nächsten Zug."},{"n":"Spider Climb","nd":"Spinnenklettern","d":"Can climb difficult surfaces, including ceilings, without an ability check.","dd":"Kann ohne Attributswurf an schwierigen Oberflächen und Decken klettern."},{"n":"Vampire Weaknesses","nd":"Vampirschwächen","d":"Can't enter a residence uninvited; takes 20 acid damage per turn ending in running water; destroyed by a piercing wooden stake in the heart while incapacitated in its resting place; takes 20 radiant damage at the start of its turn in sunlight and has disadvantage on attack rolls and ability checks there.","dd":"Kann Wohnstätten nicht ungebeten betreten; erleidet 20 Säureschaden pro Zug, den er in fließendem Wasser beendet; wird durch einen Holzpflock ins Herz zerstört, während er in seiner Ruhestätte kampfunfähig ist; erleidet im Sonnenlicht zu Beginn seines Zuges 20 gleißenden Schaden und hat dort Nachteil bei Angriffs- und Attributswürfen."}],"act":[{"n":"Multiattack (Vampire Form Only)","nd":"Mehrfachangriff (nur Vampirgestalt)","d":"The vampire makes two attacks, only one of which can be a bite attack.","dd":"Der Vampir führt zwei Angriffe aus, von denen nur einer ein Biss sein darf."},{"n":"Unarmed Strike (Vampire Form Only)","nd":"Waffenloser Schlag (nur Vampirgestalt)","hit":9,"rng":"reach 5 ft.","dmg":[["1d8+4","bludgeoning"]],"d":"Instead of dealing damage, the vampire can grapple the target (escape DC 18).","dd":"Statt Schaden zuzufügen, kann der Vampir das Ziel packen (Entkommen SG 18)."},{"n":"Bite (Bat or Vampire Form Only)","nd":"Biss (nur Fledermaus- oder Vampirgestalt)","hit":9,"rng":"reach 5 ft.","dmg":[["1d6+4","piercing"],["3d6","necrotic"]],"d":"Target must be willing, grappled, incapacitated, or restrained. Target's HP max is reduced by the necrotic damage until a long rest; vampire regains HP equal to it. A humanoid slain this way and buried rises as a vampire spawn the next night.","dd":"Das Ziel muss einverstanden, gepackt, kampfunfähig oder festgesetzt sein. Das TP-Maximum des Ziels sinkt bis zu einer langen Rast um den nekrotischen Schaden; der Vampir erhält so viele TP zurück. Ein so getöteter und begrabener Humanoider erhebt sich in der nächsten Nacht als Vampirbrut."},{"n":"Charm","nd":"Bezauberung","dc":17,"save":"wis","d":"One humanoid within 30 ft. that can see the vampire must save or be charmed for 24 hours (regarding the vampire as a trusted friend). Repeats save when harmed by vampire or companions.","dd":"Ein Humanoider im Umkreis von 9 m, der den Vampir sehen kann, muss einen Rettungswurf bestehen oder ist 24 Stunden lang bezaubert (hält den Vampir für einen vertrauten Freund). Wiederholung, wenn der Vampir oder seine Gefährten ihm schaden."},{"n":"Children of the Night","nd":"Kinder der Nacht","use":"1/day","d":"Calls 2d4 swarms of bats or rats (if sun not up), or 3d6 wolves outdoors; arrive in 1d4 rounds, serve for 1 hour.","dd":"Ruft 2W4 Fledermaus- oder Rattenschwärme (wenn die Sonne nicht aufgegangen ist) oder im Freien 3W6 Wölfe herbei; sie erscheinen nach 1W4 Runden und dienen 1 Stunde lang."}],"leg":[{"n":"Legendary Actions","nd":"Legendäre Aktionen","d":"The vampire can take 3 legendary actions, one at a time at the end of another creature's turn.","dd":"Der Vampir kann 3 legendäre Aktionen ausführen, jeweils eine am Ende des Zuges einer anderen Kreatur."},{"n":"Move","nd":"Bewegung","d":"Moves up to its speed without provoking opportunity attacks.","dd":"Bewegt sich bis zu seiner Bewegungsrate, ohne Gelegenheitsangriffe zu provozieren."},{"n":"U ersion ends it.","dd":"Jede Kreatur im Umkreis von 4,5 m muss einen Rettungswurf bestehen oder wird vergiftet; solange erleidet sie zu Beginn jedes ihrer Züge 5 (1W10) Giftschaden (Wiederholung am Ende jedes Zuges). Weihwasser beendet den Effekt."},{"n":"Stunning Screech","nd":"Betäubendes Kreischen","use":"1/day","dc":14,"save":"con","d":"Each creature within 20 ft. that can hear it and isn't a demon must save or be stunned until the end of the vrock's next turn.","dd":"Jede Kreatur im Umkreis von 6 m, die es hört und kein Dämon ist, muss einen Rettungswurf bestehen oder ist bis zum Ende des nächsten Zuges des Vrocks betäubt."}]},{"id":"vulture","en":"Vulture","de":"Geier","size":"M","type":"beast","al":"unaligned","ac":10,"hp":5,"hd":"1d8+1","spd":{"walk":10,"fly":50},"ab":[7,10,13,2,12,4],"sk":{"Perception":3},"sen":"passive Perception 13","lang":"—","cr":"0","env":["desert","grassland"],"tr":[{"n":"Keen Sight and Smell","nd":"Scharfe Sicht und scharfer Geruchssinn","d":"Advantage on Wisdom (Perception) checks that rely on sight or smell.","dd":"Vorteil bei Weisheitswürfen (Wahrnehmung), die auf Sicht oder Geruch beruhen."},{"n":"Pack Tactics","nd":"Rudeltaktik","d":"Advantage on attack rolls against a creature if at least one of its allies is within 5 ft. of the creature and isn't incapacitated.","dd":"Vorteil bei Angriffswürfen gegen eine Kreatur, wenn mindestens ein nicht kampfunfähiger Verbündeter innerhalb von 1,5 m davon ist."}],"act":[{"n":"Beak","nd":"Schnabel","hit":2,"rng":"reach 5 ft.","dmg":[["1d4","piercing"]]}]},{"id":"warhorse","en":"Warhorse","de":"Schlachtross","size":"L","type":"beast","al":"unaligned","ac":11,"hp":19,"hd":"3d10+3","spd":{"walk":60},"ab":[18,12,13,2,12,7],"sen":"passive Perception 11","lang":"—","cr":"1/2","env":["grassland","urban"],"tr":[{"n":"Trampling Charge","nd":"Trampelnder Ansturm","d":"If it moves at least 20 ft. straight toward a creature and hits it with a hooves attack on the same turn, the target must succeed on a D     (h.facs || []).forEach(function (k) { if (FAC[k]) out += '<p>' + FAC[k].i + ' <b>' + esc(facName(k)) + ':</b> ' + esc(pick(FAC[k].hint)) + '</p>'; });

  function buildHint(d) {

    if (ms.some(function (m) { return (m.tr || []).some(function (t) { return /pack tactics/i.test(t.n); }); })) sp.push('pack');
    if (ms.some(C.isLegendary)) sp.push('legendary');

    if (d.encType !== 'ambush' && ms.some(function (m) { return (m.tr || []).some(function (t) { return /nimble escape|shadow stealth/i.test(t.n); }); })) sp.push('stealth');
    const n = (HINTS.type[d.encType] || []).length || 1;
    const facs = []; d.items.forEach(function (it) { const ri = roleInfo(it.role); if (ri && facs.indexOf(ri.fac) < 0) facs.push(ri.fac); const m = MB[it.mid]; if (m && m.faction && facs.indexOf(m.faction) < 0) facs.push(m.faction); });

  function filteredList(f) {

      if (cb.turn < 0) { if (cb.round > 1) { cb.round--; cb.turn = order.length - 1; } else cb.turn = 0; }
    }
    const x = order[cb.turn];

    onlyEnv: function (el) { scopeF(el).onlyEnv = el.checked; rerenderList(el.dataset.scope); },
    import: function (el) {
      const file = el.files && el.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = function () {
        try {
          const data = JSON.parse(rd.result); const arr = Array.isArray(data) ? data : data.encounters;
          if (!Array.isArray(arr)) throw new Error('format');
          let n = 0;
          if (Array.isArray(data.custom)) data.custom.forEach(function (m) { if (!m || !m.id || MB[m.id] && !MB[m.id].custom) return; const old = S.custom.findIndex(function (c) { return c.id === m.id; }); m.custom = true; if (old >= 0) S.custom[old] = m; else S.custom.push(m); const oi = MONSTERS.findIndex(function (x) { return x.id === m.id; }); if (oi >= 0) MONSTERS[oi] = prep(m); else MONSTERS.push(prep(m)); });
          if (Array.isArray(data.parties)) data.parties.forEach(function (p) { if (p && Array.isArray(p.levels)) S.parties.push(p); });
          if (data.names && typeof data.names === 'object') Object.assign(S.names, data.names);
          arr.forEach(function (e) { if (!e || !Array.isArray(e.items) || !Array.isArray(e.levels)) return; if (getEnc(e.id)) e.id = uid(); S.saved.push(e); n++; });
          persistCustom(); LS.set('eb.parties', S.parties); LS.set('eb.names', S.names); persistSaved(); toast(T('importDone', { n: n })); render();
        } catch (err) { window.alert(L('importErr')); }
      };
      rd.readAsText(file);
    },
    targetAc: function (el) { S.targetAc = el.value; render(); },
    saveDc: function (el) { S.saveDc = el.value; render(); },
    targetSave: function (el) { S.targetSave = el.value; },
    init: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.init = el.value === '' ? null : Number(el.value); saveCombat(); render(); },
    label: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.custom = el.value.trim(); saveCombat(); render(); },
    hp: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.hp = Math.max(0, parseInt(el.value, 10) || 0); saveCombat(); render(); },
    maxHp: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.maxHp = Math.max(1, parseInt(el.value, 10) || 1); if (x.hp > x.maxHp) x.hp = x.maxHp; saveCombat(); render(); },
    temp: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.temp = Math.max(0, parseInt(el.value, 10) || 0); saveCombat(); render(); },
    ac: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.ac = Math.max(0, parseInt(el.value, 10) || 0); saveCombat(); render(); },
    ab: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.ab[+el.dataset.i] = Math.max(1, Math.min(30, parseInt(el.value, 10) || 10)); saveCombat(); render(); }
  };
  function scopeF(el) { return el.dataset.scope === 'modal' ? S.modal : S.best; }
  const inputs = {
    encname: function (el) { S.draft.name = el.value; persistDraft(); },
    pname: function (el) { S.draft.pnames = S.draft.pnames || []; S.draft.pnames[+el.dataset.v] = el.value; persistDraft(); },
    cinput: function (el) { if (S.cedit) S.cedit[el.dataset.v] = el.value; },
    q: function (el) { scopeF(el).q = el.value; rerenderList(el.dataset.scope); },
    notes: function (el) { const x = findInst(el.dataset.v); if (!x) return; x.notes = el.value; saveCombat(); }
  };

  document.addEventListener('click', function (ev) {
    const el = ev.target.closest('[data-a]'); if (!el) return;
    const stop = ev.target.closest('[data-stop]');
    if (stop && !stop.contains(el)) return;
    const fn = actions[el.dataset.a]; if (fn) fn(el.dataset.v, el, ev);
  });
  document.addEventListener('change', function (ev) { const el = ev.target.closest('[data-c]'); if (!el) return; const fn = changes[el.dataset.c]; if (fn) fn(el); });
  document.addEventListener('input', function (ev) { const el = ev.target.closest('[data-i]'); if (!el || el.tagName === 'BUTTON' || el.tagName === 'SELECT') return; const fn = inputs[el.dataset.i]; if (fn) fn(el); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && (S.modal || S.cedit)) { S.modal = null; S.cedit = null; render(); return; }
    if (ev.key !== 'Enter') return;
    const t = ev.target;
    if (t.dataset && t.dataset.k === 'rename') actions.rnok(t.dataset.v);
    else if (t.dataset && t.dataset.k === 'expr') { const b = document.querySelector('[data-a="rollexpr"][data-scope="' + t.dataset.scope + '"]'); if (b) actions.rollexpr(null, b); }
    else if (t.id === 'amt') { const b = document.querySelector('[data-a="dmg"]'); if (b) actions.dmg(b.dataset.v); }
    else if (t.id === 'pname' || t.id === 'pinit') actions.addplayer();
  });

  // Ecken einmalig einfügen
  document.body.insertAdjacentHTML('afterbegin', ['tl', 'tr', 'bl', 'br'].map(SVG.corner).join(''));
  // ---------- Start aus der Sessionverwaltung ----------
  function takeLaunch() {
    let req = null;
    try { req = JSON.parse(localStorage.getItem('eb.launch') || 'null'); } catch (e) { req = null; }
    if (!req || !req.enc || !Array.isArray(req.enc.items)) return false;
    try { localStorage.removeItem('eb.launch'); } catch (e) { }
    if (Date.now() - (req.ts || 0) > 15 * 60 * 1000) return false;
    (req.custom || []).forEach(function (m) {
      if (!m || !m.id) return; m.custom = true; fillFromBase(m);
      const i = S.custom.findIndex(function (c) { return c.id === m.id; }); if (i >= 0) S.custom[i] = m; else S.custom.push(m);
      const oi = MONSTERS.findIndex(function (x) { return x.id === m.id; }); if (oi >= 0) MONSTERS[oi] = prep(m); else MONSTERS.push(prep(m));
    });
    if ((req.custom || []).length) persistCustom();
    const src = req.enc;
    const items = src.items.filter(function (it) { return MB[it.mid]; }).map(function (it) { return { mid: it.mid, count: Math.max(1, +it.count || 1), role: it.role || '' }; });
    const missing = src.items.length - items.length;
    if (!items.length) { toast(de() ? 'Die Begegnung aus der Sessionverwaltung enthält keine bekannten Kreaturen.' : 'The encounter from the Session Manager contains no known creatures.'); return false; }
    const party = (req.party || []).filter(function (p) { return p && p.name; });
    const levels = party.length ? party.map(function (p) { return Math.max(1, Math.min(20, +p.lvl || 1)); }) : (src.levels && src.levels.length ? src.levels.slice() : [3, 3, 3, 3]);
    const pnames = party.length ? party.map(function (p) { return p.name; }) : (src.pnames || []).slice();
    const sig = JSON.stringify(items);
    let e = src.svId ? S.saved.find(function (x) { return x.svRef === src.svId; }) : null;
    let resumed = false;
    if (e && JSON.stringify(e.items) === sig && e.combat) resumed = true;
    else if (e) Object.assign(e, { name: src.name || e.name, levels: levels, pnames: pnames, items: JSON.parse(sig), updated: Date.now(), combat: null });
    else {
      e = { id: uid(), name: src.name || L('defaultName'), levels: levels, pnames: pnames, ignoreWeak: false, diff: src.diff || 'medium', encType: src.encType || 'battle', env: src.env || 'urban', focus: 'any', items: JSON.parse(sig), hint: src.hint || null, created: Date.now(), updated: Date.now(), combat: null, svRef: src.svId || null, from: 'session' };
      S.saved.push(e);
    }
    persistSaved();
    openCombat(e.id);
    if (!resumed) {
      const cb = e.combat;
      party.forEach(function (p) { if (cb.list.some(function (x) { return x.kind === 'p' && x.name === p.name; })) return; cb.list.push({ uid: uid(), kind: 'p', name: p.name, init: null, lvl: +p.lvl || null, pac: p.ac || null, php: p.hp || null }); });
      persistSaved(); render();
    }
    toast((resumed ? (de() ? '⏯️ Kampf fortgesetzt: ' : '⏯️ Combat resumed: ') : (de() ? '⚔️ Aus der Sessionverwaltung: ' : '⚔️ From the Session Manager: ')) + e.name + (missing ? (de() ? ' (' + missing + ' unbekannte Kreatur(en) ausgelassen)' : ' (' + missing + ' unknown creature(s) skipped)') : ''));
    return true;
  }
  window.EB_STATE = S; // für Tests
  render();
  takeLaunch();
})();

</script>
</body>
</html>
